<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Currency Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .base-selector {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .base-selector label {
            color: white;
            font-size: 1.2em;
            margin-right: 10px;
        }
        
        .base-selector select {
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 8px;
            border: none;
            background: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .currency-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        .currency-card:hover {
            transform: translateY(-5px);
        }
        
        .currency-card.base {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .currency-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .currency-name {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .currency-card.base .currency-name {
            color: white;
        }
        
        .clear-btn {
            padding: 8px 15px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        
        .clear-btn:hover {
            background: #ff3838;
        }
        
        .currency-card.base .clear-btn {
            background: rgba(255,255,255,0.3);
        }
        
        .currency-card.base .clear-btn:hover {
            background: rgba(255,255,255,0.5);
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        .currency-card.base .input-group label {
            color: rgba(255,255,255,0.9);
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .currency-card.base .input-group input {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.9);
        }
        
        .formula-input {
            font-family: 'Courier New', monospace;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
        
        .links-section {
            margin-top: 40px;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        
        .links-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8em;
        }
        
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .link-card {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        .link-icon {
            font-size: 1.5em;
            margin-right: 12px;
        }
        
        .link-text {
            font-weight: 600;
            font-size: 1em;
        }
        
        @media (max-width: 768px) {
            .links-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💱 Currency Converter</h1>
        
        <div class="base-selector">
            <label for="baseCurrency">Base Currency:</label>
            <select id="baseCurrency">
                <option value="USD">USD</option>
                <option value="CNY">CNY</option>
                <option value="IQD">IQD</option>
                
                <option value="AED">AED</option>
                <option value="IRT">Iranian Toman</option>
            </select>
            
        </div>
        <!-- ستامپی دروستکەر -->
<div style="
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px 30px;
">
  <div style="
    position: relative;
    display: inline-block;
    padding: 18px 40px;
    border: 4px solid #4f8ef7;
    border-radius: 12px;

  ">

    <div style="

</div>
<!-- کۆتایی ستامپ -->
        <div class="grid" id="currencyGrid"></div>
        
        <div class="links-section">
            <h2>📊 Currency Resources</h2>
            <div class="links-grid">
                
                <a href="https://www.facebook.com/share/1aprwMnvhv/" target="_blank" class="link-card">
                    <span class="link-icon">📘</span>
                    <span class="link-text">Facebook Exchange</span>
                </a>
                <a href="https://almutalee.com/news/keywords/%D8%A8%DB%86%D8%B1%D8%B3%DB%95%DB%8C%20%D9%87%DB%95%D9%88%D9%84%DB%8E%D8%B1" target="_blank" class="link-card">

                <a href="https://t.me/s/bazari_dolaraka?before=13090" target="_blank" class="link-card">

                    <span class="link-text">Telegram Bazari Dolar</span>
                </a>
                <a href="https://www.xe.com/currencyconverter/convert/?Amount=1&From=USD&To=CNY" target="_blank" class="link-card">
                    <span class="link-icon">💱</span>
                    <span class="link-text">XE Currency Converter</span>
                </a>
                
                <a href="https://tradingeconomics.com/china/currency" target="_blank" class="link-card">
                    <span class="link-icon">📈</span>
                    <span class="link-text">Trading Economics China</span>
                </a>
                <a href="https://fred.stlouisfed.org/series/DEXCHUS?utm_source=chatgpt.com" target="_blank" class="link-card">
                    <span class="link-icon">🏦</span>

                </a>
            </div>
        </div>
    </div>

    <script>
        const currencies = ['USD', 'CNY', 'IQD', 'AED', 'IRT'];
        const currencyNames = {
            'USD': 'US Dollar',
            'CNY': 'Chinese Yuan',
            'IQD': 'Iraqi Dinar',
            'AED': 'UAE Dirham',
            'IRT': 'Iranian Toman'
        };
        
        let baseCurrency = 'USD';
        let data = {};
        
        function loadData() {
            const saved = localStorage.getItem('currencyData');
            if (saved) {
                data = JSON.parse(saved);
            } else {
                // Default exchange rates: 100 USD = 140,000 IQD = 708.32 CNY = 11,250,000 IRT
                data = {
                    'USD': { amount: '100', formula: '' },
                    'CNY': { amount: '708.32', formula: '*7.0832' },
                    'IQD': { amount: '140000', formula: '*1400' },
                    'AED': { amount: '367.3', formula: '*3.673' },
                    'IRT': { amount: '11250000', formula: '*112500' }
                };
            }
            
            const savedBase = localStorage.getItem('baseCurrency');
            if (savedBase) {
                baseCurrency = savedBase;
                document.getElementById('baseCurrency').value = baseCurrency;
            }
        }
        
        function saveData() {
            localStorage.setItem('currencyData', JSON.stringify(data));
            localStorage.setItem('baseCurrency', baseCurrency);
        }
        
        function evaluateFormula(formula, baseAmount) {
            try {
                if (!formula || formula.trim() === '') return baseAmount;
                
                let expression = formula.trim();
                if (expression.startsWith('*') || expression.startsWith('/') || 
                    expression.startsWith('+') || expression.startsWith('-')) {
                    expression = baseAmount + expression;
                } else {
                    expression = expression.replace(/base/gi, baseAmount);
                }
                
                const result = eval(expression);
                return isNaN(result) ? 0 : result;
            } catch (e) {
                return 0;
            }
        }
        
        function updateAllAmounts(changedCurrency) {
            const changedAmount = parseFloat(data[changedCurrency].amount) || 0;
            
            if (changedCurrency === baseCurrency) {
                currencies.forEach(curr => {
                    if (curr !== baseCurrency) {
                        const result = evaluateFormula(data[curr].formula, changedAmount);
                        data[curr].amount = result.toString();
                        const input = document.getElementById(`amount-${curr}`);
                        if (input) input.value = result;
                    }
                });
            } else {
                const formula = data[changedCurrency].formula;
                let baseAmount = 0;
                
                try {
                    if (!formula || formula.trim() === '') {
                        baseAmount = changedAmount;
                    } else {
                        let expr = formula.trim();
                        if (expr.startsWith('*')) {
                            const multiplier = parseFloat(expr.substring(1));
                            baseAmount = changedAmount / multiplier;
                        } else if (expr.startsWith('/')) {
                            const divisor = parseFloat(expr.substring(1));
                            baseAmount = changedAmount * divisor;
                        } else if (expr.startsWith('+')) {
                            const addend = parseFloat(expr.substring(1));
                            baseAmount = changedAmount - addend;
                        } else if (expr.startsWith('-')) {
                            const subtrahend = parseFloat(expr.substring(1));
                            baseAmount = changedAmount + subtrahend;
                        } else {
                            baseAmount = changedAmount;
                        }
                    }
                } catch (e) {
                    baseAmount = changedAmount;
                }
                
                data[baseCurrency].amount = baseAmount.toString();
                const baseInput = document.getElementById(`amount-${baseCurrency}`);
                if (baseInput) baseInput.value = baseAmount;
                
                currencies.forEach(curr => {
                    if (curr !== baseCurrency && curr !== changedCurrency) {
                        const result = evaluateFormula(data[curr].formula, baseAmount);
                        data[curr].amount = result.toString();
                        const input = document.getElementById(`amount-${curr}`);
                        if (input) input.value = result;
                    }
                });
            }
            
            saveData();
        }
        
        function clearAmount(currency) {
            data[currency].amount = '';
            const input = document.getElementById(`amount-${currency}`);
            if (input) input.value = '';
            saveData();
        }
        
        function createCurrencyCard(currency) {
            const isBase = currency === baseCurrency;
            
            return `
                <div class="currency-card ${isBase ? 'base' : ''}" id="card-${currency}">
                    <div class="currency-header">
                        <div class="currency-name">${currency}</div>
                        <button class="clear-btn" onclick="clearAmount('${currency}')">Clear</button>
                    </div>
                    
                    <div class="input-group">
                        <label for="amount-${currency}">Amount</label>
                        <input 
                            type="text" 
                            id="amount-${currency}" 
                            value="${data[currency].amount}"
                            oninput="handleAmountChange('${currency}', this.value)"
                            placeholder="0.00"
                        >
                    </div>
                    
                    ${!isBase ? `
                    <div class="input-group">
                        <label for="formula-${currency}">Formula (e.g., *1.4)</label>
                        <input 
                            type="text" 
                            id="formula-${currency}" 
                            class="formula-input"
                            value="${data[currency].formula}"
                            oninput="handleFormulaChange('${currency}', this.value)"
                            placeholder="*1"
                        >
                    </div>
                    ` : ''}
                </div>
            `;
        }
        
        function handleAmountChange(currency, value) {
            data[currency].amount = value;
            updateAllAmounts(currency);
        }
        
        function handleFormulaChange(currency, value) {
            data[currency].formula = value;
            saveData();
            
            const baseAmount = parseFloat(data[baseCurrency].amount) || 0;
            if (baseAmount) {
                const result = evaluateFormula(value, baseAmount);
                data[currency].amount = result.toString();
                const input = document.getElementById(`amount-${currency}`);
                if (input) input.value = result;
                saveData();
            }
        }
        
        function renderGrid() {
            const grid = document.getElementById('currencyGrid');
            const sortedCurrencies = [baseCurrency, ...currencies.filter(c => c !== baseCurrency)];
            grid.innerHTML = sortedCurrencies.map(curr => createCurrencyCard(curr)).join('');
        }
        
        document.getElementById('baseCurrency').addEventListener('change', function(e) {
            baseCurrency = e.target.value;
            saveData();
            renderGrid();
        });
        
        loadData();
        renderGrid();
    </script>
    <script src="qalyx-bridge.js"></script>
</body>
