<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
                    
    <title>Currency Converter</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

      body {
    background-image: url(''); /* Your Base64 code */
    background-color: black;
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 2rem;
            font-weight: 600;
            font-size: 2rem;
        }

        .rate-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .rate-group {
            background: #f8fafc;
            padding: 1.25rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
        }

        .rate-group label {
            display: block;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .rate-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .rate-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .currency-input {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
        }

        .flag {
            font-size: 2rem;
            width: 40px;
        }

        input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .results {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .conversion-box {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
        }

        .conversion-box h3 {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        .conversion-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .unit {
            color: #475569;
            font-size: 0.9rem;
        }

        .value {
            color: #1e293b;
            font-weight: 500;
        }
    </style>
</head>

<div style="

  <div style="
    position: relative;
    display: inline-block;
    padding: 18px 40px;
    border: 4px solid #4f8ef7;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    text-align: center;
    color: #4f8ef7;
    opacity: 0.75;
    transform: rotate(-4deg);
    box-shadow:
      0 0 0 2px #4f8ef7,
      0 0 18px rgba(79,142,247,0.3),
      inset 0 0 18px rgba(79,142,247,0.07);
    background: transparent;
    letter-spacing: 1px;
    pointer-events: none;
    user-select: none;
  ">
    <!-- ستێری سەرەوە -->
    <div style="
      position: absolute;
      top: -1px; left: 50%;
      transform: translateX(-50%) translateY(-50%);
      background: inherit;

      font-size: 13px;
      color: #4f8ef7;
      letter-spacing: 3px;
      font-weight: 700;
    ">✦ ✦ ✦</div>

    <div style="font-size: 15px; font-weight: 700; margin-bottom: 4px; letter-spacing: 2px;">
      دروست کراوە لە لایەن
    </div>
    <div style="font-size: 22px; font-weight: 900; letter-spacing: 1px;">
      ئاراس لطیف
    </div>

    <!-- ستێری خوارەوە -->
    <div style="
      position: absolute;
      bottom: -1px; left: 50%;
      transform: translateX(-50%) translateY(50%);
      background: inherit;
      padding: 0 10px;
      font-size: 13px;
      color: #4f8ef7;
      letter-spacing: 3px;
      font-weight: 700;
    ">✦ ✦ ✦</div>
  </div>
</div>
<!-- کۆتایی ستامپ -->
        <div class="rate-controls">
            <div class="rate-group">
                <label>نرخی دولار بەرامبەر دیناری عراقی = <span
                id="iqdExample">ex:1470</span> IQD)</label>
                <input type="number" id="usdIqdRate" class="rate-input"
                value="1475.5" step="0.1">
            </div>
            <div class="rate-group">
                <label>نرخی دولار بەرامبەر تمەنی ئێرانی<span id="irrExample">4,225,000</span> IRR)</label>
                <input type="number" id="usdIrrRate" class="rate-input" value="42250" step="100">
            </div>
        </div>

        <div class="input-group">
            <div class="currency-input">
                <span class="flag">🇺🇸</span>
                <input type="text" id="usd" placeholder="US Dollars (USD)">
            </div>
        </div>

        <div class="input-group">
            <div class="currency-input">
                <span class="flag">🇮🇶</span>
                <input type="text" id="iqd" placeholder="Iraqi Dinar (IQD)">
            </div>
        </div>

        <div class="input-group">
            <div class="currency-input">
                <span class="flag">🇮🇷</span>
                <input type="text" id="irr" placeholder="Iranian Toman (IRR)">
            </div>
        </div>

        <div class="results">
            <div class="conversion-box">
                <h3>USD Breakdown</h3>
                <div class="conversion-item">
                    <span class="unit">Cents</span>
                    <span class="value" id="cents">0</span>
                </div>
                <div class="conversion-item">
                    <span class="unit">Waraqa (100 USD)</span>
                    <span class="value" id="waraqa">0</span>
                </div>
                <div class="conversion-item">
                    <span class="unit">Daftar (10k USD)</span>
                    <span class="value" id="daftar">0</span>
                </div>
            </div>

            <div class="conversion-box">
                <h3>IQD Breakdown</h3>
                <div class="conversion-item">
                    <span class="unit">Mlion (1M IQD)</span>
                    <span class="value" id="mlion">0</span>
                </div>
            </div>
        </div>
        <p style="font-size:9px">Created By<span
        style="color:red;font-weight:bold"> Aras Lateef</span>
        07504913891</p>
    </div>
    

    <script>
        // Function to format numbers with commas
        const formatNumber = num => {
            if (num === 0) return '0';
            return num.toLocaleString('en-US', { maximumFractionDigits: 6 });
        };

        // Function to remove commas and convert to number
        const parseFormattedNumber = str => {
            return parseFloat(str.replace(/,/g, '')) || 0;
        };

        const inputs = {
            usd: document.getElementById('usd'),
            iqd: document.getElementById('iqd'),
            irr: document.getElementById('irr')
        };

        const rateInputs = {
            usdIqd: document.getElementById('usdIqdRate'),
            usdIrr: document.getElementById('usdIrrRate')
        };

        const conversions = {
            cents: document.getElementById('cents'),
            waraqa: document.getElementById('waraqa'),
            daftar: document.getElementById('daftar'),
            mlion: document.getElementById('mlion')
        };

        const examples = {
            iqdExample: document.getElementById('iqdExample'),
            irrExample: document.getElementById('irrExample')
        };

        function getRates() {
            return {
                usdIqd: parseFloat(rateInputs.usdIqd.value) || 1457.5,
                usdIrr: parseFloat(rateInputs.usdIrr.value) || 42250
            };
        }

        function updateExamples() {
            const rates = getRates();
            examples.iqdExample.textContent = formatNumber(rates.usdIqd * 100);
            examples.irrExample.textContent = formatNumber(rates.usdIrr * 100);
        }

        function convertCurrency(source, value) {
            const rates = getRates();
            let usd = 0;
            
            if (value !== undefined && !isNaN(value)) {
                switch(source) {
                    case 'usd':
                        usd = value;
                        break;
                    case 'iqd':
                        usd = value / rates.usdIqd;
                        break;
                    case 'irr':
                        usd = value / rates.usdIrr;
                        break;
                }
            }

            if (!isNaN(usd)) {
                inputs.usd.value = usd !== 0 ? formatNumber(usd) : '';
                inputs.iqd.value = usd !== 0 ? formatNumber(usd * rates.usdIqd) : '';
                inputs.irr.value = usd !== 0 ? formatNumber(usd * rates.usdIrr) : '';

                conversions.cents.textContent = usd !== 0 ? formatNumber(usd * 100) : '0';
                conversions.waraqa.textContent = usd !== 0 ? formatNumber(usd / 100) : '0';
                conversions.daftar.textContent = usd !== 0 ? formatNumber(usd / 10000) : '0';
                conversions.mlion.textContent = inputs.iqd.value ? 
                    formatNumber(parseFormattedNumber(inputs.iqd.value) / 1000000) : '0';
            }
        }

        Object.entries(inputs).forEach(([currency, input]) => {
            input.addEventListener('input', (e) => {
                const value = parseFormattedNumber(e.target.value);
                convertCurrency(currency, value);
            });
        });

        Object.entries(rateInputs).forEach(([_, input]) => {
            input.addEventListener('input', () => {
                updateExamples();
                convertCurrency('usd', parseFormattedNumber(inputs.usd.value));
            });
        });

        // Initialize examples
        updateExamples();
    </script>
    
    <script src="qalyx-bridge.js"></script>
