<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.5, user-scalable=no">
<title>IT Officer Prep — Study Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;
  --bg-elevated:#141b23;
  --bg-card:#1a222c;
  --bg-card-hover:#1f2933;
  --border:#2a3644;
  --border-soft:#212b36;
  --text:#e8edf2;
  --text-dim:#8fa0b3;
  --text-faint:#54677c;
  --amber:#e0a94a;
  --amber-soft:rgba(224,169,74,0.14);
  --teal:#4bbfae;
  --teal-soft:rgba(75,191,174,0.14);
  --gray:#4a5666;
  --danger:#d97b7b;
  --radius:12px;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(224,169,74,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(75,191,174,0.05), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
mark{background:var(--amber-soft);color:var(--amber);padding:0 2px;border-radius:3px;}
::selection{background:var(--amber-soft);}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;
  background:rgba(13,17,23,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer;}
.brand-chip{
  width:30px;height:30px;border-radius:6px;
  background:linear-gradient(135deg,var(--amber),#b9822f);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;color:#1a1206;font-size:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
}
.brand-text{font-family:var(--mono);font-weight:700;letter-spacing:0.02em;font-size:15px;}
.brand-text span{color:var(--text-faint);font-weight:500;}
.nav-btn{
  display:flex;align-items:center;gap:8px;
  background:transparent;border:1px solid var(--border);
  color:var(--text-dim);padding:10px 16px;border-radius:10px;
  font-size:14px;font-weight:600;transition:all .15s ease;
}
.nav-btn:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-soft);}
.nav-btn.active{border-color:var(--amber);color:var(--amber);background:var(--amber-soft);}
.top-action-btn{font-size:24px;padding:10px 18px;margin-left:4px;}
.close-btn{color:var(--danger);border-color:rgba(217,123,123,0.3);}
.close-btn:hover{color:#fff;background:var(--danger);border-color:var(--danger);}

/* ---------- Layout ---------- */
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}
.view{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Dashboard ---------- */
.dash-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:32px;}
.gauge-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
.gauge-readout{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.gauge-num{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--text);}
.gauge-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-faint);margin-top:2px;}
.stat-pills{display:flex;gap:12px;flex-wrap:wrap;}
.pill{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;min-width:120px;
}
.pill-val{font-family:var(--mono);font-size:20px;font-weight:800;}
.pill-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}
.pill.streak .pill-val{color:var(--amber);}
.pill.review .pill-val{color:var(--danger);}

.section-title-row{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;}
.section-title-row h2{font-family:var(--mono);font-size:16px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-faint);margin:0;}

.jack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.jack-card{
  position:relative;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 16px 16px;cursor:pointer;
  transition:all .15s ease;overflow:hidden;
}
.jack-card::before{
  content:'';position:absolute;top:0;left:16px;width:36px;height:5px;
  background:var(--border);border-radius:0 0 4px 4px;
}
.jack-card:hover{background:var(--bg-card-hover);border-color:var(--text-faint);transform:translateY(-2px);}
.jack-card.status-amber::before{background:var(--amber);}
.jack-card.status-teal::before{background:var(--teal);}
.jack-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.jack-num{font-family:var(--mono);font-size:var(--fs-notes,13px);color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--gray);flex-shrink:0;margin-top:2px;}
.status-dot.amber{background:var(--amber);box-shadow:0 0 8px var(--amber-soft);}
.status-dot.teal{background:var(--teal);box-shadow:0 0 8px var(--teal-soft);}
.jack-title{font-weight:700;font-size:var(--fs-notes,17px);line-height:1.4;margin-bottom:14px;min-height:38px;}
.jack-progress{height:6px;border-radius:3px;background:var(--border-soft);overflow:hidden;margin-bottom:8px;}
.jack-progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--teal));border-radius:3px;transition:width .3s ease;}
.jack-foot{display:flex;justify-content:space-between;font-size:var(--fs-notes,13px);color:var(--text-faint);font-family:var(--mono);}

.dash-note{
  margin-top:30px;padding:14px 16px;border:1px dashed var(--border);
  border-radius:10px;font-size:var(--fs-dash,14px);color:var(--text-faint);line-height:1.6;
}
.dash-note b{color:var(--text-dim);}

/* ---------- Study view ---------- */
.study-header{margin-bottom:18px;}
.back-link{
  display:inline-flex;align-items:center;gap:6px;color:var(--text-faint);
  font-size:var(--fs-dash,14px);font-family:var(--mono);text-decoration:none;margin-bottom:14px;
  background:none;border:none;padding:0;
}
.back-link:hover{color:var(--amber);}
.study-title{font-size:21px;font-weight:800;margin:0 0 4px;}
.study-sub{color:var(--text-faint);font-size:var(--fs-dash,14px);font-family:var(--mono);margin-bottom:16px;}
.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.progress-bar-lg{flex:1;height:8px;border-radius:4px;background:var(--bg-card);border:1px solid var(--border);overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .3s ease;}
.progress-count{font-family:var(--mono);font-size:var(--fs-dash,14px);color:var(--text-dim);white-space:nowrap;}
.mark-all-btn{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);
  padding:9px 14px;border-radius:8px;font-size:var(--fs-dash,12.5px);font-weight:600;margin:14px 0 22px;
}
.mark-all-btn:hover{border-color:var(--teal);color:var(--teal);}
.complete-banner{
  background:var(--teal-soft);border:1px solid var(--teal);color:var(--teal);
  padding:10px 14px;border-radius:8px;font-size:var(--fs-dash,13px);font-weight:600;margin-bottom:20px;
  display:flex;align-items:center;gap:8px;
}

.q-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;transition:border-color .2s ease;scroll-margin-top:80px;
}
.q-card.is-read{border-color:var(--border-soft);}
.q-card.has-note{background:#AFCBF0;border-color:#BABA82;color:#1a1206;}
.q-card.is-starred{background:#DCEDDA;border-color:#c2e8e8;color:#1a1206;}
.q-card.has-note .q-text,.q-card.is-starred .q-text{color:#1a1206;}
.q-card.has-note .q-answer,.q-card.is-starred .q-answer{color:#3a3026;}
.q-card.has-note .q-tag,.q-card.is-starred .q-tag{color:#1a1206;background:rgba(0,0,0,0.08);}
.q-card.has-note .check-label,.q-card.is-starred .check-label{color:#3a3026;}
.q-card.flash{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);}
.q-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.q-tag{
  font-family:var(--mono);font-size:var(--fs-tag,12px);text-transform:uppercase;letter-spacing:0.08em;
  color:var(--amber);background:var(--amber-soft);padding:4px 10px;border-radius:6px;
  display:inline-block;margin-bottom:8px;
}
.q-tag.practical{color:var(--teal);background:var(--teal-soft);}
.q-tag.tip{color:#c9a2e8;background:rgba(201,162,232,0.14);}
.q-tag.reference{color:var(--text-dim);background:var(--bg-elevated);}
.q-text{font-weight:700;font-size:var(--fs-q,18px);line-height:1.45;}
.star-btn{
  background:none;border:none;font-size:38px;color:var(--text-faint);
  padding:4px;line-height:1;flex-shrink:0;
}
.star-btn.starred{color:var(--amber);background:#FAF9B4;border-radius:8px;}
.q-answer{color:var(--text-dim);font-size:var(--fs-a,16.5px);line-height:1.7;-webkit-touch-callout:none;touch-callout:none;}
.q-answer p{margin:0 0 10px;}
.q-answer ul,.q-answer ol{margin:0 0 12px;padding-left:20px;}
.q-answer li{margin-bottom:3px;}
.q-answer hr{border:none;border-top:1px solid var(--border-soft);margin:14px 0;}
.q-answer .tip{color:var(--amber);font-size:13px;}
.q-answer .warn{color:var(--danger);font-size:13px;}
.mini-table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:14.5px;}
.mini-table th,.mini-table td{border:1px solid var(--border-soft);padding:8px 12px;text-align:left;}
.mini-table th{background:var(--bg-elevated);color:var(--text-dim);font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:0.04em;}
.q-foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);}
.check-label{display:flex;align-items:center;gap:10px;font-size:var(--fs-dash,14px);color:var(--text-dim);cursor:pointer;user-select:none;padding:4px 0;}
.check-label input{accent-color:var(--teal);width:20px;height:20px;}
.note-area{
  width:100%;background:var(--bg-elevated);border:1px solid var(--border-soft);
  color:var(--text);border-radius:6px;padding:8px 10px;font-size:12.5px;font-family:var(--sans);
  margin-top:10px;resize:vertical;min-height:44px;
}
.note-area:focus{outline:none;border-color:var(--amber);}

/* ---------- Notes tabs: Written | Highlight ---------- */
.notes-tabs{display:flex;gap:6px;margin:0 0 16px;}
.notes-tab-btn{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);
  padding:14px 24px;border-radius:10px;font-size:14.5px;font-weight:600;font-family:var(--sans);
  transition:all .15s ease;
}
.notes-tab-btn:hover{border-color:var(--amber);color:var(--amber);}
.notes-tab-btn.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
.notes-tab-btn .count{font-family:var(--mono);font-size:13px;margin-left:6px;opacity:.7;}
.hl-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.hl-card{
  position:relative;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 16px 16px;cursor:pointer;
  transition:all .15s ease;overflow:hidden;
}
.hl-card::before{
  content:'';position:absolute;top:0;left:16px;width:36px;height:5px;
  background:var(--amber);border-radius:0 0 4px 4px;
}
.hl-card:hover{background:var(--bg-card-hover);border-color:var(--text-faint);transform:translateY(-2px);}
.hl-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.hl-card-source{font-family:var(--mono);font-size:10.5px;color:var(--amber);text-transform:uppercase;letter-spacing:0.06em;}
.hl-card-quote{font-style:italic;color:var(--amber);font-size:var(--fs-notes,14px);line-height:1.4;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hl-card-note{color:var(--text-dim);font-size:var(--fs-notes,12.5px);line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hl-card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
.hl-card-date{color:var(--text-faint);font-family:var(--mono);font-size:10.5px;}
.hl-card-actions{display:flex;gap:8px;}
.hl-card-actions button{background:none;border:none;color:var(--text-dim);font-size:12px;padding:0;}
.hl-card-actions button:hover{color:var(--amber);}
.hl-card-actions .hl-danger:hover{color:var(--danger);}
.hl-card-empty{padding:30px 0;text-align:center;color:var(--text-faint);font-size:13.5px;}
.sh-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:4px;}
.sh-card{
  position:relative;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 16px 16px;cursor:pointer;
  transition:all .15s ease;overflow:hidden;
}
.sh-card::before{
  content:'';position:absolute;top:0;left:16px;width:36px;height:5px;
  border-radius:0 0 4px 4px;
}
.sh-card.color-yellow::before{background:#fff176;}
.sh-card.color-lime::before{background:#aed581;}
.sh-card.color-cyan::before{background:#4dd0e1;}
.sh-card.color-magenta::before{background:#f48fb1;}
.sh-card.color-coral::before{background:#ff8a65;}
.sh-card.color-gold::before{background:#ffd54f;}
.sh-card.color-blue::before{background:#64b5f6;}
.sh-card.color-lavender::before{background:#ce93d8;}
.sh-card-bar{position:absolute;top:0;left:16px;width:36px;height:5px;border-radius:0 0 4px 4px;}
.sh-card:hover{background:var(--bg-card-hover);border-color:var(--text-faint);transform:translateY(-2px);}
.sh-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.sh-card-source{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);}
.sh-card-text{font-size:14px;line-height:1.45;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.sh-card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
.sh-card-date{color:var(--text-faint);font-family:var(--mono);font-size:10.5px;}
.sh-card-actions{display:flex;gap:8px;}
.sh-card-actions button{background:none;border:none;color:var(--text-dim);font-size:12px;padding:0;}
.sh-card-actions button:hover{color:var(--amber);}
.sh-card-actions .sh-danger:hover{color:var(--danger);}
.sh-card-empty{padding:30px 0;text-align:center;color:var(--text-faint);font-size:13.5px;}

/* ---------- Settings ---------- */
.settings-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:16px;
}
.settings-card h3{font-family:var(--mono);font-size:var(--fs-set,16px);text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin:0 0 8px;}
.settings-card p{color:var(--text-faint);font-size:var(--fs-set,13px);line-height:1.5;margin:0 0 16px;}
.settings-card .stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;}
.settings-card .stat-item{font-size:12.5px;}
.settings-card .stat-item b{color:var(--text);font-family:var(--mono);}
.settings-card .stat-label{color:var(--text-faint);}
.settings-row{display:flex;gap:10px;flex-wrap:wrap;}

/* ---------- My Notes (multiple notes, rich text) ---------- */
.notes-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.notes-toolbar button, .notes-toolbar select{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);
  padding:7px 11px;border-radius:7px;font-size:13px;font-family:var(--sans);
}
.notes-toolbar button:hover{border-color:var(--amber);color:var(--amber);}
.notes-toolbar select{font-family:var(--sans);}
.notes-toolbar .spacer{flex:1;}
.notes-toolbar .danger-btn:hover{border-color:var(--danger);color:var(--danger);}
.rich-notes-box{
  min-height:280px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 22px;font-size:14.5px;line-height:1.7;
  color:var(--text);outline:none;overflow-wrap:anywhere;
}
.rich-notes-box:focus{border-color:var(--amber);}
.rich-notes-box:empty::before{content:attr(data-placeholder);color:var(--text-faint);}
.rich-notes-box img{max-width:100%;height:auto;border-radius:8px;margin:8px 0;display:block;cursor:pointer;}
.rich-notes-box img.note-img-selected{outline:3px solid var(--amber);outline-offset:2px;}
.note-view-content img{max-width:100%;height:auto;border-radius:8px;margin:8px 0;display:block;}
.image-toolbar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;
  background:var(--amber-soft);border:1px solid rgba(224,169,74,0.4);border-radius:8px;padding:8px 10px;
}
.image-toolbar button{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);
  padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:var(--sans);
}
.image-toolbar button:hover{border-color:var(--amber);color:var(--amber);}
.image-toolbar-label{font-size:12.5px;color:var(--amber);font-weight:700;margin-right:2px;}
.notes-hint{
  margin-top:12px;padding:12px 14px;border:1px dashed var(--border);border-radius:10px;
  font-size:12.5px;color:var(--text-faint);line-height:1.6;
}
.notes-saved-tag{font-family:var(--mono);font-size:11.5px;color:var(--teal);opacity:0;transition:opacity .3s ease;}
.notes-saved-tag.show{opacity:1;}
.note-label-input{
  width:100%;background:var(--bg-elevated);border:1px solid var(--border);
  color:var(--text);padding:12px 14px;border-radius:8px;font-size:15px;
  font-weight:700;margin-bottom:14px;font-family:var(--sans);
}
.note-label-input:focus{outline:none;border-color:var(--amber);}
.note-actions-row{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;}
.save-note-btn{
  background:linear-gradient(135deg,var(--amber),#b9822f);border:none;color:#1a1206;
  padding:14px 28px;border-radius:10px;font-size:15px;font-weight:800;
}
.save-note-btn:hover{filter:brightness(1.08);}
.note-linked-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--teal);
  background:var(--teal-soft);border:1px solid rgba(75,191,174,0.35);
  padding:8px 12px;border-radius:8px;margin-bottom:14px;font-family:var(--mono);
}
.note-linked-chip button{
  background:none;border:none;color:var(--teal);font-family:var(--mono);font-size:12px;
  text-decoration:underline;padding:0;
}
.note-card-linked-tag{color:var(--teal);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;}
.note-card-plain-tag{color:var(--text-faint);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;}
.note-card-excerpt{color:var(--text-dim);font-size:12.5px;line-height:1.5;margin:8px 0;min-height:36px;}
.note-card-date{color:var(--text-faint);font-family:var(--mono);font-size:11px;}

/* ---------- Text highlights inside answers ---------- */
mark.user-hl{
  background:var(--amber-soft);color:var(--amber);padding:1px 3px;border-radius:4px;
  border-bottom:2px solid var(--amber);cursor:pointer;transition:background .15s ease;
}
mark.user-hl:hover{background:rgba(224,169,74,0.30);}
mark.user-hl.flash-hl{background:var(--teal-soft);color:var(--teal);border-bottom-color:var(--teal);}
/* simple highlight — colored background, no pointer events, not clickable */

      {num:null,type:"tip",q:"About this chapter",a:`
        <p>This chapter covers the hardware knowledge expected from an IT Officer. Many interviewers begin with basic questions and gradually move to troubleshooting scenarios to assess your practical understanding.</p>

      {num:1,type:"question",q:"What are the main components of a computer?",a:`
        <p><strong>Why they ask:</strong> To determine whether you understand computer architecture and can explain it clearly.</p>
        <p><strong>Excellent Answer:</strong></p>
        <p>The main components of a computer are:</p>
        <ul>
        <li>Motherboard</li>
        <li>CPU (Processor)</li>
        <li>RAM (Memory)</li>
        <li>Storage (SSD/HDD)</li>
        <li>Power Supply Unit (PSU)</li>
        <li>Graphics Card (GPU) (if present)</li>
        <li>Cooling System (Fans or Liquid Cooling)</li>
        <li>Network Interface Card (NIC)</li>
        <li>BIOS/UEFI Firmware</li>
        <li>Input and Output Devices</li>
        </ul>
        <p>All these components work together to process data and allow the operating system and applications to run.</p>
        <p><strong>Follow-up questions:</strong> Which component is considered the brain of the computer? Which component stores data permanently? Which component supplies electrical power?</p>
      `},
      {num:2,type:"question",q:"What is the motherboard?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>The motherboard is the primary printed circuit board of the computer. It connects and enables communication between all hardware components, including the CPU, RAM, storage devices, graphics card, expansion cards, and peripheral interfaces. It also contains the chipset, firmware (BIOS/UEFI), and power distribution circuits.</p>
        <p><strong>Interview tip:</strong> Avoid saying "It's just a board." A professional answer explains its role in connecting and coordinating all hardware.</p>
      `},
      {num:3,type:"question",q:"What is a CPU?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>The CPU (Central Processing Unit) executes instructions from software, performs arithmetic and logical operations, and coordinates the activities of the entire computer system. It is often referred to as the "brain" of the computer because it controls how data is processed.</p>
        <p><strong>Common follow-up:</strong> What affects CPU performance?</p>
        <p>Good answer: clock speed (GHz), number of cores, number of threads, cache size, CPU architecture, cooling efficiency.</p>
      `},
      {num:4,type:"question",q:"What is the difference between a Core and a Thread?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A core is a physical processing unit inside the CPU capable of executing tasks independently.</p>
        <p>A thread is a logical execution path. Technologies like Intel Hyper-Threading or AMD SMT allow one physical core to handle multiple threads, improving multitasking performance.</p>
        <p><strong>Example:</strong> 4 cores / 4 threads, 4 cores / 8 threads, 8 cores / 16 threads</p>
      `},
      {num:5,type:"question",q:"What is CPU Cache?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>CPU cache is a small, high-speed memory located inside or very close to the processor. It stores frequently used instructions and data so the CPU can access them much faster than RAM.</p>
        <p><strong>Levels include:</strong> L1 Cache (fastest, smallest), L2 Cache, L3 Cache (largest, shared among cores)</p>
      `},
      {num:6,type:"question",q:"What is RAM?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>RAM (Random Access Memory) is volatile memory used to store data and instructions that the CPU is actively using. It provides fast access to running applications and the operating system. When the computer is powered off, the contents of RAM are lost.</p>
        <p><strong>Interview tip:</strong> Many interviewers ask "Why doesn't RAM save files permanently?" Correct answer: because RAM is volatile memory and requires continuous electrical power to retain data.</p>
      `},
      {num:7,type:"question",q:"What is the difference between RAM and ROM?",a:`
        <table class="mini-table"><thead><tr><th>RAM</th><th>ROM</th></tr></thead><tbody>
        <tr><td>Volatile</td><td>Non-volatile</td></tr>
        <tr><td>Temporary storage</td><td>Permanent firmware storage</td></tr>
        <tr><td>Read and Write</td><td>Mostly Read-only</td></tr>
        <tr><td>Used while system runs</td><td>Stores BIOS/UEFI firmware</td></tr>
        </tbody></table>
      `},
      {num:8,type:"question",q:"What is ROM?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>ROM (Read-Only Memory) is non-volatile memory that stores firmware, such as the BIOS or UEFI. It retains its contents even when power is removed and provides the instructions needed to initialize hardware during startup.</p>
      `},
      {num:9,type:"question",q:"What happens when you press the Power Button?",a:`
        <p>This is one of the most common interview questions.</p>
        <p><strong>Excellent Answer (step by step):</strong></p>
        <ol>
        <li>The power supply receives AC electricity from the wall outlet.</li>
        <li>The PSU converts AC to regulated DC voltages.</li>
        <li>The motherboard receives power.</li>
        <li>The CPU resets and begins execution.</li>
        <li>BIOS/UEFI firmware starts.</li>
        <li>POST (Power-On Self-Test) checks essential hardware.</li>
        <li>The firmware detects storage devices.</li>
        <li>The bootloader is loaded from the boot device.</li>
        <li>The operating system kernel starts.</li>
        <li>Windows initializes drivers and services.</li>
        <li>The login screen appears.</li>
        </ol>
        <p><strong>Interview tip:</strong> If you can explain this sequence confidently, it demonstrates a solid understanding of the PC boot process.</p>
      `},
      {num:10,type:"question",q:"What is POST?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>POST (Power-On Self-Test) is a diagnostic process performed by the BIOS or UEFI immediately after the computer is powered on. It checks critical hardware components such as the CPU, RAM, graphics adapter, keyboard, and storage devices. If a problem is detected, the firmware may display an error message or emit beep codes.</p>
      `},
      {num:11,type:"question",q:"What is BIOS?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>BIOS (Basic Input/Output System) is firmware stored on the motherboard that initializes hardware during startup and begins the boot process by locating a bootable device. It has largely been replaced by UEFI on modern systems.</p>
      `},
      {num:12,type:"question",q:"What is UEFI?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>UEFI (Unified Extensible Firmware Interface) is the modern replacement for BIOS. It supports:</p>
        <ul>
        <li>Faster boot times</li>
        <li>GPT disks</li>
        <li>Secure Boot</li>
        <li>Large storage devices (over 2 TB)</li>
        <li>Improved security</li>
        <li>Graphical configuration interfaces</li>
        <li>Mouse support</li>
        </ul>
      `},
      {num:13,type:"question",q:"BIOS vs UEFI — explain the difference",a:`
        <table class="mini-table"><thead><tr><th>BIOS</th><th>UEFI</th></tr></thead><tbody>
        <tr><td>Legacy firmware</td><td>Modern firmware</td></tr>
        <tr><td>Uses MBR</td><td>Uses GPT</td></tr>
        <tr><td>Slower startup</td><td>Faster startup</td></tr>
        <tr><td>Limited to 2 TB boot disks</td><td>Supports very large disks</td></tr>
        <tr><td>No Secure Boot</td><td>Supports Secure Boot</td></tr>
        <tr><td>Text-based interface</td><td>Often graphical</td></tr>
        </tbody></table>
      `},
      {num:14,type:"question",q:"What is Secure Boot?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>Secure Boot is a UEFI security feature that allows only trusted, digitally signed bootloaders and operating systems to start. This helps prevent bootkits and certain types of malware from loading before the operating system.</p>
      `},
      {num:15,type:"question",q:"What is CMOS?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>CMOS traditionally refers to the memory that stores BIOS/UEFI configuration settings, such as the system date, time, and boot order. These settings are maintained by the CMOS battery when the computer is powered off.</p>
      `},
      {num:16,type:"question",q:"What is the CMOS Battery?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>The CMOS battery supplies power to preserve firmware settings and the real-time clock when the computer is turned off.</p>
        <p><strong>If it fails:</strong> the system clock may reset, BIOS/UEFI settings may return to defaults, boot configuration may be lost.</p>
      `},
      {num:null,type:"practical",q:"Scenario 1: The computer does not turn on. How would you troubleshoot it?",a:`
        <p><strong>Excellent Answer:</strong> I would proceed systematically:</p>
        <ul>
        <li>Confirm the issue with the user.</li>
        <li>Verify that the wall outlet has power.</li>
        <li>Check the power cable and any power strip.</li>
        <li>Ensure the PSU switch is in the ON position (if applicable).</li>
        <li>Look for motherboard standby LEDs.</li>
        <li>Listen for fans or beep codes.</li>
        <li>Disconnect unnecessary peripherals.</li>
        <li>Reseat the RAM modules.</li>
        <li>Test with a known-good power supply if available.</li>
        <li>Check the motherboard for visible damage, such as swollen capacitors or burn marks.</li>
        <li>If necessary, test the CPU and motherboard with compatible replacement parts.</li>
        </ul>
        <p>This approach minimizes unnecessary part replacement and helps isolate the root cause efficiently.</p>
      `},
      {num:null,type:"practical",q:"Scenario 2: The computer turns on but displays a black screen. What is the troubleshooting process?",a:`
        <ul>
        <li>Verify the monitor is powered on.</li>
        <li>Check the video cable (HDMI, DisplayPort, etc.).</li>
        <li>Ensure the correct input source is selected.</li>
        <li>Test with another monitor or cable.</li>
        <li>Listen for POST beep codes.</li>
        <li>Reseat the RAM.</li>
        <li>If a dedicated GPU is installed, reseat it and confirm any required power connectors are attached.</li>
        <li>If available, test using the motherboard's integrated graphics.</li>
        <li>Clear CMOS if firmware settings are suspected.</li>
        <li>Check whether the system completes POST.</li>
        </ul>
      `},
      {num:null,type:"tip",q:"Interview tip: avoid jumping to conclusions",a:`
        <p>For troubleshooting questions, avoid jumping to a conclusion like "replace the motherboard." Employers want to see a logical diagnostic process. Start with the simplest, least invasive checks, gather evidence, and then move toward more complex hardware replacement if needed.</p>
      `},
      {num:null,type:"reference",q:"Next section",a:`
        <p><strong>Chapter 3 – Part 2</strong> continues right after this section, covering:</p>
        <ul>
        <li>HDD vs SSD vs NVMe</li>

        <li>Real hardware troubleshooting scenarios commonly used in IT Officer interviews</li>
        </ul>
        <p>This next part moves from fundamental hardware concepts into the storage and expansion technologies you'll encounter in enterprise environments.</p>
      `}
    ]

    questions:[
      {num:17,type:"question",q:"What is the difference between HDD, SSD, and NVMe SSD?",a:`
        <p><strong>HDD (Hard Disk Drive)</strong> stores data on spinning magnetic disks using a mechanical read/write head.</p>
        <p><em>Advantages:</em></p><ul><li>Low cost</li><li>Large storage capacity</li><li>Good for backups</li></ul>
        <p><em>Disadvantages:</em></p><ul><li>Slower performance</li><li>Mechanical parts can fail</li><li>Higher power consumption</li><li>Sensitive to vibration</li></ul>
        <p><em>Typical speed:</em> 5400 RPM, 7200 RPM</p>
        <hr>
        <p><strong>SSD (Solid State Drive)</strong> stores data in flash memory with no moving parts.</p>
        <p><em>Advantages:</em></p><ul><li>Much faster than HDD</li><li>Silent</li><li>Lower power consumption</li><li>More shock resistant</li><li>Faster boot times</li></ul>
        <p><em>Disadvantages:</em></p><ul><li>More expensive per GB</li><li>Limited write cycles (though sufficient for normal use)</li></ul>
        <hr>
        <p><strong>NVMe SSD</strong> also uses flash memory but connects through PCI Express instead of SATA.</p>
        <p><em>Advantages:</em></p><ul><li>Extremely fast</li><li>Lower latency</li><li>Ideal for operating systems</li><li>Excellent for virtualization</li><li>Excellent for databases</li></ul>
        <table class="mini-table"><thead><tr><th>Type</th><th>Typical Speed</th></tr></thead><tbody>
        <tr><td>HDD</td><td>100–150 MB/s</td></tr>
        <tr><td>SSD (SATA)</td><td>500–550 MB/s</td></tr>
        <tr><td>NVMe Gen3</td><td>3,500 MB/s</td></tr>
        <tr><td>NVMe Gen4</td><td>7,000 MB/s</td></tr>
        <tr><td>NVMe Gen5</td><td>12,000–14,000 MB/s</td></tr>
        </tbody></table>
        <p class="tip">💡 Interview tip: most companies install Windows on NVMe SSD, user files on HDD, and backups on NAS or SAN.</p>
      `},
      {num:18,type:"question",q:"SATA vs NVMe — what's the difference?",a:`
        <table class="mini-table"><thead><tr><th>SATA</th><th>NVMe</th></tr></thead><tbody>
        <tr><td>Uses SATA controller</td><td>Uses PCIe</td></tr>
        <tr><td>Maximum around 600 MB/s</td><td>Up to 14 GB/s</td></tr>
        <tr><td>Older technology</td><td>Modern technology</td></tr>
        <tr><td>Higher latency</td><td>Very low latency</td></tr>
        <tr><td>Better for general storage</td><td>Best for OS and high-performance workloads</td></tr>
        </tbody></table>
      `},
      {num:19,type:"question",q:"What is PCI Express?",a:`
        <p>PCI Express (PCIe) is a high-speed expansion interface used to connect devices such as:</p>
        <ul><li>Graphics cards</li><li>NVMe SSDs</li><li>Network cards</li><li>RAID controllers</li><li>Capture cards</li></ul>
        <p><strong>Follow-up — what do x1, x4, x8 and x16 mean?</strong> They represent the number of PCIe lanes. More lanes means more bandwidth.</p>
        <p>Example: PCIe x16 is normally used for graphics cards. PCIe x4 is often used for NVMe SSDs.</p>
      `},
      {num:20,type:"question",q:"What is M.2?",a:`
        <p>M.2 is a compact expansion slot used mainly for SSDs. It can support:</p>
        <ul><li>SATA SSD</li><li>NVMe SSD</li><li>Wi-Fi cards</li><li>Bluetooth cards</li></ul>
        <p class="tip">💡 Not every M.2 SSD is NVMe — some M.2 drives still use SATA.</p>
      `},
      {num:21,type:"question",q:"Explain RAID.",a:`
        <p><strong>RAID</strong> stands for <strong>Redundant Array of Independent Disks</strong>. It combines multiple drives to improve:</p>
        <ul><li>Performance</li><li>Redundancy</li><li>Availability</li></ul>
      `},
      {num:22,type:"question",q:"RAID 0 — how does it work?",a:`
        <p><strong>Minimum disks:</strong> 2</p>
        <ul><li>✔ Fastest RAID</li><li>✔ No redundancy</li><li>✔ Maximum storage</li></ul>
        <p>Example: 2 × 1 TB = 2 TB usable</p>
        <p class="warn">⚠ If one disk fails, everything is lost.</p>
      `},
      {num:23,type:"question",q:"RAID 1 — how does it work?",a:`
        <p><strong>Minimum disks:</strong> 2</p>
        <p>Mirroring — everything written to one disk is copied to another.</p>
        <p>Example: 2 × 1 TB → 1 TB usable</p>
        <p><em>Advantage:</em> excellent redundancy</p>
        <p><em>Disadvantage:</em> only 50% usable capacity</p>
      `},
      {num:24,type:"question",q:"RAID 5 — how does it work?",a:`
        <p><strong>Minimum disks:</strong> 3</p>
        <p>Uses parity — if one disk fails, data survives.</p>
        <p>Example: 3 × 1 TB → 2 TB usable</p>
        <p><em>Advantages:</em> good balance of performance, capacity, and fault tolerance</p>
      `},
      {num:25,type:"question",q:"RAID 6 — how does it work?",a:`
        <p><strong>Minimum disks:</strong> 4</p>
        <p>Allows two disks to fail. Often used in enterprise servers.</p>
      `},
      {num:26,type:"question",q:"RAID 10 — how does it work?",a:`
        <p>A combination of RAID 1 and RAID 0. Needs 4 drives minimum.</p>
        <p><em>Advantages:</em> fast, redundant, an enterprise favorite</p>
        <p><em>Disadvantage:</em> 50% storage efficiency</p>
      `},
      {num:null,type:"reference",q:"RAID Summary Table (quick reference)",a:`
        <table class="mini-table"><thead><tr><th>RAID</th><th>Min Disks</th><th>Performance</th><th>Redundancy</th><th>Usable (4×1TB example)</th></tr></thead><tbody>
        <tr><td>RAID 0</td><td>2</td><td>Excellent</td><td>None</td><td>4 TB</td></tr>
        <tr><td>RAID 1</td><td>2</td><td>Good</td><td>Excellent</td><td>2 TB</td></tr>
        <tr><td>RAID 5</td><td>3</td><td>Good</td><td>One disk failure</td><td>3 TB</td></tr>
        <tr><td>RAID 6</td><td>4</td><td>Good</td><td>Two disk failures</td><td>2 TB</td></tr>
        <tr><td>RAID 10</td><td>4</td><td>Excellent</td><td>Excellent</td><td>2 TB</td></tr>
        </tbody></table>
      `},
      {num:27,type:"question",q:"Does RAID replace backups?",a:`
        <p><strong>No.</strong> RAID only protects against hardware disk failure. It does NOT protect against:</p>
        <ul><li>Accidental deletion</li><li>Malware</li><li>Ransomware</li><li>Fire</li><li>Theft</li><li>File corruption</li><li>Natural disasters</li></ul>
        <p class="tip">💡 Always have proper backups.</p>
      `},
      {num:28,type:"question",q:"What is a Power Supply Unit (PSU)?",a:`
        <p>The PSU converts AC power from the electrical outlet into regulated DC voltages required by the motherboard, CPU, storage devices, and graphics card.</p>
        <p>Common outputs include: <strong>+12V</strong>, <strong>+5V</strong>, <strong>+3.3V</strong></p>
      `},
      {num:29,type:"question",q:"What happens if the PSU fails?",a:`
        <p>Possible symptoms:</p>
        <ul><li>PC won't turn on</li><li>Random shutdowns</li><li>Restarts</li><li>Burning smell</li><li>Fans don't spin</li><li>No POST</li><li>No power LEDs</li></ul>
      `},
      {num:null,type:"practical",q:"Practical: a PC turns off randomly — possible causes?",a:`
        <ul><li>PSU failure</li><li>Overheating</li><li>Faulty RAM</li><li>CPU overheating</li><li>Motherboard issue</li><li>Short circuit</li><li>Loose power cable</li><li>Faulty electrical outlet</li></ul>
      `},
      {num:30,type:"question",q:"What is an 80 PLUS Certification?",a:`
        <p>80 PLUS is a certification indicating PSU energy efficiency. Levels include:</p>
        <ul><li>White (Standard)</li><li>Bronze</li><li>Silver</li><li>Gold</li><li>Platinum</li><li>Titanium</li></ul>
        <p>Higher ratings indicate better efficiency, lower heat generation, and lower electricity consumption.</p>
      `},
      {num:31,type:"question",q:"What is a GPU?",a:`
        <p><strong>GPU</strong> = Graphics Processing Unit. Responsible for display output, 3D rendering, video editing, CAD, AI processing, gaming, and machine learning.</p>
        <table class="mini-table"><thead><tr><th>Integrated</th><th>Dedicated</th></tr></thead><tbody>
        <tr><td>Built into CPU</td><td>Separate card</td></tr>
        <tr><td>Lower performance</td><td>Higher performance</td></tr>
        <tr><td>Lower power consumption</td><td>Higher power consumption</td></tr>
        <tr><td>Shares system RAM</td><td>Has dedicated VRAM</td></tr>
        <tr><td>Suitable for office work</td><td>Suitable for graphics-intensive tasks</td></tr>
        </tbody></table>
      `},
      {num:32,type:"question",q:"What is VRAM?",a:`
        <p><strong>VRAM</strong> = Video Random Access Memory. It stores textures, images, frame buffers, and graphics data. The GPU accesses VRAM directly for rendering graphics.</p>
      `},
      {num:null,type:"practical",q:'Practical scenario: the computer displays "No Boot Device Found." How do you troubleshoot it?',a:`
        <ol>
        <li>Confirm the error message.</li>
        <li>Enter BIOS/UEFI and verify that the storage drive is detected.</li>
        <li>Check the boot order to ensure the correct drive is first.</li>
        <li>Inspect SATA or NVMe connections (if applicable).</li>
        <li>Reseat the drive if possible.</li>
        <li>Run the manufacturer's disk diagnostics or SMART check.</li>
        <li>Attempt to boot from recovery media.</li>
        <li>Repair the bootloader using Windows Recovery tools if needed.</li>
        <li>If the drive has failed, replace it and restore data from backup.</li>
        </ol>
      `},
      {num:null,type:"practical",q:"Practical scenario: a user says their computer has become extremely slow. How do you troubleshoot it?",a:`
        <ol>
        <li>Ask when the problem started and whether any changes were made.</li>
        <li>Check CPU, RAM, and disk usage in Task Manager.</li>
        <li>Ensure sufficient free disk space.</li>
        <li>Review startup programs and disable unnecessary ones.</li>
        <li>Scan for malware.</li>
        <li>Check Windows Event Viewer for errors.</li>
        <li>Verify Windows updates and driver status.</li>
        <li>Check SMART health of the storage drive.</li>
        <li>Test RAM if memory issues are suspected.</li>
        <li>Consider upgrading from an HDD to an SSD if appropriate.</li>
        </ol>
      `},
      {num:null,type:"tip",q:"Interview tip: how to structure any technical answer",a:`
        <p>When answering technical questions:</p>
        <ol>
        <li>Define the technology clearly.</li>
        <li>Explain how it works.</li>
        <li>Describe why it is used.</li>
        <li>Mention its advantages and disadvantages.</li>
        <li>If applicable, provide a real-world example from troubleshooting or system administration.</li>
        </ol>
        <p>This approach demonstrates both theoretical knowledge and practical experience.</p>
      `}
    ]
  },

    questions:[
      {num:null,type:"tip",q:"Why networking is important",a:`
        <p>Networking is one of the most important topics for IT Officer interviews. Even if the role is focused on user support, employers expect you to understand how devices communicate and how to troubleshoot network issues.</p>
      `},
      {num:33,type:"question",q:"What is a Computer Network?",a:`
        <p><strong>Why they ask:</strong> They want to know if you understand the basic purpose of networking.</p>
        <p><strong>Excellent Answer:</strong></p>
        <p>A computer network is a collection of computers, servers, printers, and other devices connected together so they can communicate and share resources such as files, printers, applications, and Internet access.</p>
        <p>The main goals of networking are: resource sharing, communication, centralized management, security, data exchange</p>
        <p><strong>Example:</strong> In an office — 50 computers, 2 servers, 15 printers, Wi-Fi, and Internet, all connected together. That is a network.</p>
      `},
      {num:34,type:"question",q:"What is the Internet?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>The Internet is a worldwide network of interconnected networks that communicate using the TCP/IP protocol suite.</p>
        <p>Millions of routers connect networks together across countries, allowing devices to exchange data globally.</p>
      `},
      {num:35,type:"question",q:"What is a LAN?",a:`
        <p><strong>LAN = Local Area Network</strong></p>
        <p>A LAN covers a small geographical area such as: office, school, home, hospital</p>
        <p><strong>Example:</strong> one building with PCs, printers, and servers, connected by switches.</p>
      `},
      {num:36,type:"question",q:"What is a WAN?",a:`
        <p><strong>WAN = Wide Area Network</strong></p>
        <p>A WAN connects multiple LANs over large geographical distances.</p>
        <p><strong>Example:</strong> a company has offices in Erbil, Baghdad, and Basra. Each office has its own LAN. VPN or leased lines connect them together — this becomes a WAN.</p>
      `},
      {num:37,type:"question",q:"What is the difference between LAN and WAN?",a:`
        <table class="mini-table">
        <tr><th>LAN</th><th>WAN</th></tr>
        <tr><td>Small area</td><td>Large area</td></tr>
        <tr><td>Faster</td><td>Usually slower</td></tr>
        <tr><td>Company owned</td><td>ISP or telecom</td></tr>
        <tr><td>Lower cost</td><td>Higher cost</td></tr>
        <tr><td>Switches</td><td>Routers</td></tr>
        </table>
      `},
      {num:38,type:"question",q:"What is an IP Address?",a:`
        <p>One of the most common interview questions.</p>
        <p><strong>Excellent Answer:</strong></p>
        <p>An IP (Internet Protocol) address is a logical address assigned to a device on a network. It uniquely identifies the device and allows data to be routed to the correct destination.</p>
        <p><strong>Example:</strong> <code>192.168.1.25</code></p>
        <p>Every device needs an IP address to communicate over an IP network.</p>
        <p><strong>Follow-up:</strong> Can two devices have the same IP? <strong>No</strong> — if they do, an IP Conflict occurs, causing network problems, connection drops, error messages, and inability to communicate reliably.</p>
      `},
      {num:39,type:"question",q:"What is the difference between IPv4 and IPv6?",a:`
        <table class="mini-table">
        <tr><th>IPv4</th><th>IPv6</th></tr>
        <tr><td>32-bit</td><td>128-bit</td></tr>
        <tr><td>Example: 192.168.1.10</td><td>Example: 2001:db8::1</td></tr>
        <tr><td>About 4.3 billion addresses</td><td>Vast address space</td></tr>
        <tr><td>Widely used</td><td>Increasing adoption</td></tr>
        <tr><td>Supports NAT commonly</td><td>Designed to reduce the need for NAT</td></tr>
        </table>
      `},
      {num:40,type:"question",q:"What is a MAC Address?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A MAC (Media Access Control) address is a unique hardware identifier assigned to a network interface card (NIC) by the manufacturer. It operates at the Data Link layer of the OSI model and is used for communication within the local network.</p>
        <p><strong>Example:</strong> <code>00:1A:2B:3C:4D:5E</code></p>
        <table class="mini-table">
        <tr><th>IP Address</th><th>MAC Address</th></tr>
        <tr><td>Logical</td><td>Physical</td></tr>
        <tr><td>Can change</td><td>Usually fixed</td></tr>
        <tr><td>Layer 3</td><td>Layer 2</td></tr>
        <tr><td>Used across networks</td><td>Used within the local network</td></tr>
        </table>
      `},
      {num:41,type:"question",q:"What is a Subnet Mask?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A subnet mask separates an IP address into two parts: network portion and host portion. It determines which devices are on the same local network.</p>
        <p><strong>Example:</strong> IP 192.168.1.25, Subnet Mask 255.255.255.0 → Network 192.168.1.0, Host 25</p>
      `},
      {num:42,type:"question",q:"What is the Default Gateway?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>The default gateway is the IP address of the router that forwards traffic from the local network to other networks, including the Internet.</p>
        <p>Without a correct default gateway: local communication may still work, but Internet access usually will not.</p>
        <p><strong>Example:</strong> PC → Switch → Router (Default Gateway) → Internet</p>
      `},
      {num:43,type:"question",q:"What is DNS?",a:`
        <p>One of the most frequently asked interview questions.</p>
        <p><strong>DNS = Domain Name System</strong></p>
        <p>DNS translates human-readable domain names into IP addresses.</p>
        <p><strong>Example:</strong> google.com → 142.250.x.x</p>
        <p>Without DNS, users would need to remember IP addresses instead of names.</p>
        <p><strong>Practical example:</strong> User types www.google.com → DNS converts it into an IP address → Browser connects to that IP → Google's webpage loads.</p>
      `},
      {num:44,type:"question",q:"What is DHCP?",a:`
        <p><strong>DHCP = Dynamic Host Configuration Protocol</strong></p>
        <p>DHCP automatically assigns IP Address, Subnet Mask, Default Gateway, and DNS Server to devices joining the network.</p>
        <p>Without DHCP, every computer would need manual configuration.</p>
      `},
      {num:45,type:"question",q:"What is the difference between Static IP and Dynamic IP?",a:`
        <table class="mini-table">
        <tr><th>Static</th><th>Dynamic</th></tr>
        <tr><td>Manually configured</td><td>Automatically assigned</td></tr>
        <tr><td>Doesn't change unless reconfigured</td><td>Can change</td></tr>
        <tr><td>Common for servers</td><td>Common for client PCs</td></tr>
        <tr><td>Easier to locate services</td><td>Easier to manage at scale</td></tr>
        </table>
      `},
      {num:46,type:"question",q:"What is a Switch?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A switch is a Layer 2 network device that connects devices within a local network. It forwards Ethernet frames based on MAC addresses, allowing efficient communication between connected devices.</p>
        <p>Advantages: faster than a hub, reduces collisions, supports full-duplex communication, can support VLANs (managed switches)</p>
      `},
      {num:47,type:"question",q:"What is a Hub?",a:`
        <p>A hub is an older networking device that repeats incoming data to every connected port without inspecting the destination.</p>
        <p>Problems: shared bandwidth, more collisions, less secure, rarely used today</p>
        <table class="mini-table">
        <tr><th>Hub</th><th>Switch</th></tr>
        <tr><td>Broadcasts to all ports</td><td>Sends only to the correct port</td></tr>
        <tr><td>Shared bandwidth</td><td>Dedicated bandwidth per port</td></tr>
        <tr><td>Many collisions</td><td>Minimal collisions</td></tr>
        <tr><td>Obsolete</td><td>Standard in modern networks</td></tr>
        </table>
      `},
      {num:48,type:"question",q:"What is a Router?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A router is a Layer 3 device that connects different networks and forwards packets based on IP addresses. It enables communication between a local network and external networks such as the Internet.</p>
        <p><strong>Typical office network:</strong> Internet → ISP → Router → Switch → PCs, Printers, Servers, Access Points</p>
      `},
      {num:49,type:"question",q:"What is an Access Point?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A wireless access point (AP) provides Wi-Fi connectivity, allowing wireless devices such as laptops and smartphones to connect to the wired network.</p>
        <p>Unlike a router, an access point primarily extends wireless access rather than routing traffic between networks.</p>
      `},
      {num:50,type:"question",q:"Explain what happens when you type \"www.google.com\" in a browser.",a:`
        <p>This is one of the most important interview questions.</p>
        <p><strong>Excellent Answer (step-by-step):</strong></p>
        <ul>
        <li>You enter www.google.com in the browser.</li>
        <li>The browser checks its local DNS cache.</li>
        <li>If not found, the operating system checks its DNS cache.</li>
        <li>If still not found, a DNS query is sent to the configured DNS server.</li>
        <li>The DNS server returns Google's IP address.</li>
        <li>The browser initiates a TCP connection to that IP address (typically using port 443 for HTTPS).</li>
        <li>A TLS handshake occurs to establish a secure encrypted session.</li>
        <li>The browser sends an HTTPS request.</li>
        <li>Google's web server processes the request.</li>
        <li>The server returns the webpage data.</li>
        <li>The browser downloads HTML, CSS, JavaScript, images, and other resources.</li>
        <li>The browser renders the page and displays it to the user.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario 1: A user says, \"I can't access the Internet.\" What is the excellent troubleshooting process?",a:`
        <ul>
        <li>Clarify whether only one user or multiple users are affected.</li>
        <li>Verify physical connections (Ethernet cable or Wi-Fi).</li>
        <li>Check whether the network adapter is enabled.</li>
        <li>Run <code>ipconfig</code> to confirm the device has an IP address.</li>
        <li>If the address is in the 169.254.x.x range, suspect a DHCP issue.</li>
        <li>Ping 127.0.0.1 (TCP/IP stack).</li>
        <li>Ping the local IP address.</li>
        <li>Ping the default gateway.</li>
        <li>Ping a public IP (e.g., 8.8.8.8) to test Internet connectivity.</li>
        <li>Ping google.com to verify DNS resolution.</li>
        <li>Review firewall or VPN settings if necessary.</li>
        <li>Escalate to the ISP if local troubleshooting indicates an upstream outage.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario 2: A user receives an IP address starting with 169.254.x.x. What does it mean?",a:`
        <p>This is an APIPA (Automatic Private IP Addressing) address.</p>
        <p>It usually indicates the computer could not obtain an IP address from a DHCP server.</p>
        <p>Possible causes:</p>
        <ul>
        <li>DHCP server unavailable</li>
        <li>Network cable unplugged</li>
        <li>Faulty switch port</li>
        <li>Disabled network adapter</li>
        <li>Incorrect VLAN assignment</li>
        <li>Network driver issues</li>
        </ul>
      `},
      {num:null,type:"tip",q:"Interview tip",a:`
        <p>When answering networking questions, think in layers:</p>
        <ul>
        <li><strong>Physical</strong> – Cable, power, link lights</li>
        <li><strong>Data Link</strong> – MAC addresses, switches</li>
        <li><strong>Network</strong> – IP address, subnet, gateway</li>
        <li><strong>Transport</strong> – TCP or UDP</li>
        <li><strong>Application</strong> – DNS, HTTP, HTTPS</li>
        </ul>
        <p>This structured approach demonstrates systematic troubleshooting skills, which are highly valued in IT Officer roles.</p>
      `},
      {num:null,type:"reference",q:"Next chapter",a:`
        <p><strong>Networking Fundamentals (Part 2)</strong></p>
        <p>In the next section, we'll cover:</p>
        <ul>
        <li>The OSI Model (all 7 layers)</li>
        <li>TCP/IP Model</li>
        <li>TCP vs UDP</li>
        <li>ARP</li>
        <li>ICMP</li>
        <li>Common Ports (20, 21, 22, 23, 25, 53, 67, 68, 80, 110, 143, 389, 443, 445, 3389, etc.)</li>
        <li>NAT & PAT</li>
        <li>VLANs</li>
        <li>VPNs</li>
        <li>Network commands (ping, tracert, nslookup, netstat, arp, ipconfig)</li>
        <li>Enterprise troubleshooting scenarios</li>
        </ul>
        <p>This next section is one of the most technically important parts of the guide and is commonly covered in written tests as well as interviews.</p>
      `}
    ]

    questions:[
      {num:null,type:"tip",q:"Why this chapter matters",a:`
        <p>Many interviewers believe that if you understand the OSI model, TCP/IP, TCP vs UDP, and common ports well, you have a strong networking foundation. This is one of the highest-weighted topics in any IT Officer interview.</p>
      `},
      {num:51,type:"question",q:"What is the OSI Model?",a:`
        <p><strong>Why they ask:</strong> The OSI Model is one of the most common interview topics. Interviewers want to see whether you understand how network communication is organized.</p>
        <p><strong>Excellent Answer:</strong></p>
        <p>The OSI (Open Systems Interconnection) Model is a conceptual framework that divides network communication into seven layers, making it easier to understand, design, troubleshoot, and implement networking technologies.</p>
        <p>Each layer has specific responsibilities and communicates with the layers directly above and below it.</p>
        <table class="mini-table"><thead><tr><th>Layer</th><th>Name</th><th>Main Function</th><th>Examples</th></tr></thead><tbody>
        <tr><td>7</td><td>Application</td><td>User-facing network services</td><td>HTTP, FTP, SMTP</td></tr>
        <tr><td>6</td><td>Presentation</td><td>Translation, encryption, compression</td><td>SSL/TLS, JPEG</td></tr>
        <tr><td>5</td><td>Session</td><td>Establishes and manages sessions</td><td>NetBIOS</td></tr>
        <tr><td>4</td><td>Transport</td><td>Reliable data delivery</td><td>TCP, UDP</td></tr>
        <tr><td>3</td><td>Network</td><td>Routing and IP addressing</td><td>IP, ICMP</td></tr>
        <tr><td>2</td><td>Data Link</td><td>MAC addressing</td><td>Ethernet, Switch</td></tr>
        <tr><td>1</td><td>Physical</td><td>Electrical signals and cables</td><td>RJ45, Fiber</td></tr>
        </tbody></table>
        <p><strong>Memory trick — top to bottom (A P S T N D P):</strong> Application, Presentation, Session, Transport, Network, Data Link, Physical.</p>
        <p><strong>Memory trick — bottom to top:</strong> "Please Do Not Throw Sausage Pizza Away" → Physical, Data Link, Network, Transport, Session, Presentation, Application.</p>
      `},
      {num:52,type:"question",q:"Explain Layer 1 (Physical Layer)",a:`
        <p>Responsible for transmitting raw electrical, optical, or radio signals.</p>
        <p><strong>Examples:</strong> Ethernet cable, fiber optic cable, wireless radio signals, RJ45 connector, switch port LEDs</p>
        <p><strong>Common problems:</strong> broken cable, loose connector, no power, faulty switch port</p>
      `},
      {num:53,type:"question",q:"Explain Layer 2 (Data Link Layer)",a:`
        <p>Responsible for MAC addresses, frames, error detection, and communication within the same LAN.</p>
        <p><strong>Devices:</strong> Switch, Bridge</p>
        <p><strong>Protocols:</strong> Ethernet, PPP</p>
      `},
      {num:54,type:"question",q:"Explain Layer 3 (Network Layer)",a:`
        <p>Responsible for IP addressing, routing, and packet forwarding.</p>
        <p><strong>Devices:</strong> Router, Layer 3 Switch</p>
        <p><strong>Protocols:</strong> IPv4, IPv6, ICMP</p>
      `},
      {num:55,type:"question",q:"Explain Layer 4 (Transport Layer)",a:`
        <p>Responsible for end-to-end communication, reliability, flow control, and error recovery.</p>
        <p><strong>Protocols:</strong> TCP, UDP</p>
      `},
      {num:56,type:"question",q:"Explain Layer 5 (Session Layer)",a:`
        <p>Responsible for opening, maintaining, and closing sessions.</p>
        <p><strong>Example:</strong> A video meeting begins → session established → meeting continues → meeting ends → session closed.</p>
      `},
      {num:57,type:"question",q:"Explain Layer 6 (Presentation Layer)",a:`
        <p>Responsible for encryption, compression, data formatting, and character encoding.</p>
        <p><strong>Examples:</strong> SSL, TLS, JPEG, PNG, MPEG</p>
      `},
      {num:58,type:"question",q:"Explain Layer 7 (Application Layer)",a:`
        <p>This is the layer users interact with.</p>
        <p><strong>Examples:</strong> HTTP, HTTPS, FTP, SMTP, DNS</p>
      `},
      {num:59,type:"question",q:"What is the TCP/IP Model?",a:`
        <p>Unlike the OSI model, the TCP/IP model is the practical model used on the Internet.</p>
        <table class="mini-table"><thead><tr><th>TCP/IP Layer</th><th>Corresponding OSI Layers</th></tr></thead><tbody>
        <tr><td>Application</td><td>5, 6, 7</td></tr>
        <tr><td>Transport</td><td>4</td></tr>
        <tr><td>Internet</td><td>3</td></tr>
        <tr><td>Network Access</td><td>1, 2</td></tr>
        </tbody></table>
      `},
      {num:60,type:"question",q:"TCP vs UDP — explain the difference",a:`
        <p>This question appears in almost every networking interview.</p>
        <p><strong>TCP (Transmission Control Protocol):</strong> reliable, connection-oriented, error checking, ordered delivery, retransmission. Examples: HTTPS, email, file transfer.</p>
        <p><strong>UDP (User Datagram Protocol):</strong> fast, connectionless, no retransmission, lower overhead. Examples: video streaming, online gaming, VoIP, DNS queries.</p>
        <table class="mini-table"><thead><tr><th>TCP</th><th>UDP</th></tr></thead><tbody>
        <tr><td>Reliable</td><td>Faster</td></tr>
        <tr><td>Connection-oriented</td><td>Connectionless</td></tr>
        <tr><td>Error recovery</td><td>No recovery</td></tr>
        <tr><td>Ordered delivery</td><td>No guarantee</td></tr>
        <tr><td>Larger overhead</td><td>Smaller overhead</td></tr>
        </tbody></table>
      `},
      {num:61,type:"question",q:"What is the TCP Three-Way Handshake?",a:`
        <p><strong>Excellent Answer:</strong> Before sending data, TCP establishes a connection using three steps:</p>
        <ol>
        <li><strong>SYN</strong> – Client requests a connection.</li>
        <li><strong>SYN-ACK</strong> – Server acknowledges and responds.</li>
        <li><strong>ACK</strong> – Client confirms.</li>
        </ol>
        <p>Only after this handshake does data transmission begin.</p>
      `},
      {num:62,type:"question",q:"What is ARP?",a:`
        <p><strong>ARP = Address Resolution Protocol</strong></p>
        <p><strong>Purpose:</strong> Converts an IP address into a MAC address.</p>
        <p><strong>Example:</strong> A computer wants to reach 192.168.1.50 → it uses ARP → receives the MAC address → communication begins.</p>
      `},
      {num:63,type:"question",q:"What is ICMP?",a:`
        <p><strong>ICMP = Internet Control Message Protocol</strong></p>
        <p>Used for diagnostics and error reporting.</p>
        <p><strong>Examples:</strong> ping, traceroute (uses ICMP on many operating systems)</p>
      `},
      {num:64,type:"question",q:"What is NAT?",a:`
        <p><strong>NAT = Network Address Translation</strong></p>
        <p><strong>Purpose:</strong> Converts a private IP address into a public IP address. Used by almost every home and office router.</p>
        <p><strong>Example:</strong> Internal 192.168.1.25 → Router → Public 203.0.113.50</p>
        <p><strong>Advantages:</strong> conserves public IPv4 addresses, improves isolation of internal networks, allows many devices to share one public IP.</p>
      `},
      {num:65,type:"question",q:"What is PAT?",a:`
        <p><strong>PAT = Port Address Translation</strong>, also called NAT Overload.</p>
        <p>Many internal devices → one public IP → different port numbers.</p>
        <p>This is how most home routers provide Internet access to multiple devices simultaneously.</p>
      `},
      {num:66,type:"question",q:"What is a VPN?",a:`
        <p><strong>VPN = Virtual Private Network</strong></p>
        <p>Creates an encrypted tunnel over the Internet.</p>
        <p><strong>Uses:</strong> remote workers, branch offices, secure access, privacy</p>
      `},
      {num:67,type:"question",q:"What is a VLAN?",a:`
        <p><strong>VLAN = Virtual Local Area Network</strong></p>
        <p>Allows one physical switch to be divided into multiple logical networks.</p>
        <p><strong>Example:</strong> one switch → VLAN 10 (Finance), VLAN 20 (HR), VLAN 30 (IT).</p>
        <p>Devices in different VLANs cannot communicate directly without routing.</p>
      `},
      {num:68,type:"question",q:"What is a Broadcast Domain?",a:`
        <p>A broadcast domain is a group of devices that receive the same broadcast traffic.</p>
        <p>Routers separate broadcast domains. Each VLAN is typically its own broadcast domain.</p>
      `},
      {num:69,type:"question",q:"What is a Collision Domain?",a:`
        <p>A collision domain is a network segment where data collisions can occur.</p>
        <p>Modern switches create a separate collision domain for each port, significantly reducing collisions compared to hubs.</p>
      `},
      {num:70,type:"question",q:"List common port numbers you should know",a:`
        <p>Interviewers often ask you to identify common ports.</p>
        <table class="mini-table"><thead><tr><th>Port</th><th>Protocol</th><th>Service</th></tr></thead><tbody>
        <tr><td>20</td><td>TCP</td><td>FTP Data</td></tr>

        <tr><td>23</td><td>TCP</td><td>Telnet</td></tr>
        <tr><td>25</td><td>TCP</td><td>SMTP</td></tr>
        <tr><td>53</td><td>TCP/UDP</td><td>DNS</td></tr>
        <tr><td>67</td><td>UDP</td><td>DHCP Server</td></tr>
        <tr><td>68</td><td>UDP</td><td>DHCP Client</td></tr>
        <tr><td>69</td><td>UDP</td><td>TFTP</td></tr>
        <tr><td>80</td><td>TCP</td><td>HTTP</td></tr>
        <tr><td>110</td><td>TCP</td><td>POP3</td></tr>
        <tr><td>123</td><td>UDP</td><td>NTP</td></tr>
        <tr><td>143</td><td>TCP</td><td>IMAP</td></tr>
        <tr><td>161</td><td>UDP</td><td>SNMP</td></tr>

        </tbody></table>
        <p><strong>Interview tip:</strong> You don't need to memorize every port immediately, but you should know the most common ones: 22, 53, 80, 443, 445, and 3389.</p>
      `},
      {num:71,type:"question",q:"Explain ping",a:`
        <p><strong>Purpose:</strong> Checks whether another device is reachable over the network using ICMP Echo Requests and Replies.</p>
        <p><strong>Example:</strong> <code>ping 8.8.8.8</code></p>
        <p>Useful for verifying basic IP connectivity.</p>
      `},
      {num:72,type:"question",q:"Explain tracert (Windows)",a:`
        <p><strong>Purpose:</strong> Shows the path packets take to reach a destination and the routers (hops) along the way.</p>
        <p><strong>Example:</strong> <code>tracert google.com</code></p>
        <p>Useful for identifying where connectivity problems occur.</p>
      `},
      {num:73,type:"question",q:"Explain ipconfig",a:`
        <p>Displays IP configuration information.</p>
        <p><strong>Useful commands:</strong></p>
        <ul>
        <li><code>ipconfig</code></li>
        <li><code>ipconfig /all</code></li>
        <li><code>ipconfig /release</code></li>
        <li><code>ipconfig /renew</code></li>
        <li><code>ipconfig /flushdns</code></li>
        </ul>
        <p>Know what each command does and when to use it.</p>
      `},
      {num:74,type:"question",q:"Explain nslookup",a:`
        <p>Used to query DNS servers and verify name resolution.</p>
        <p><strong>Example:</strong> <code>nslookup google.com</code></p>
        <p>If this fails while <code>ping 8.8.8.8</code> succeeds, the issue is likely DNS-related.</p>
      `},
      {num:75,type:"question",q:"Explain netstat",a:`
        <p>Displays network connections, listening ports, and routing information.</p>
        <p><strong>Example:</strong> <code>netstat -ano</code></p>
        <p>Useful for identifying active connections and the process IDs (PIDs) associated with them.</p>
      `},
      {num:null,type:"practical",q:"Scenario: A user can ping 8.8.8.8 but cannot open google.com. What is the most likely cause?",a:`
        <p>Because the user can reach 8.8.8.8, Internet connectivity is working. However, failure to access google.com suggests a DNS resolution problem.</p>
        <p><strong>Troubleshooting steps:</strong></p>
        <ul>
        <li>Run <code>nslookup google.com</code>.</li>
        <li>Check the configured DNS server (<code>ipconfig /all</code>).</li>
        <li>Try a different DNS server if appropriate.</li>
        <li>Flush the DNS cache (<code>ipconfig /flushdns</code>).</li>
        <li>Verify firewall or security software isn't blocking DNS.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario: A user can reach other local computers but cannot access the Internet. What are the most likely causes?",a:`
        <ul>
        <li>Incorrect or missing default gateway.</li>
        <li>Router failure.</li>
        <li>ISP outage.</li>
        <li>Firewall or proxy configuration issues.</li>
        <li>Incorrect routing.</li>
        </ul>
        <p>A good troubleshooting process starts by checking the IP configuration (<code>ipconfig /all</code>) and confirming the default gateway is correct and reachable.</p>
      `},
      {num:null,type:"practical",q:"Scenario: Two computers have the same IP address. What are the symptoms and resolution?",a:`
        <p><strong>Symptoms:</strong> intermittent connectivity, error messages about IP conflicts, one or both devices losing network access.</p>
        <p><strong>Resolution:</strong></p>
        <ul>
        <li>Identify the conflicting devices.</li>
        <li>If DHCP is used, renew the lease (<code>ipconfig /release</code> then <code>ipconfig /renew</code>).</li>
        <li>If static IPs are used, assign a unique address to one device.</li>
        <li>Verify there are no duplicate DHCP reservations.</li>
        </ul>
      `},
      {num:null,type:"tip",q:"Interview tip: think like a network engineer",a:`
        <p>When you answer networking questions, think like a network engineer:</p>
        <ol>
        <li>Identify the symptom.</li>
        <li>Gather evidence.</li>
        <li>Test one assumption at a time.</li>
        <li>Avoid changing multiple things simultaneously.</li>
        <li>Document what you found and what you changed.</li>
        </ol>
        <p>This systematic approach demonstrates professionalism and makes troubleshooting more effective.</p>
      `},
