var _hlToolbarDismissed = false;
var _selChangeTimer = null; /* debounce timer for selectionchange */
function hideHlToolbar(dismissed){
  const el = document.getElementById('hlToolbarBtn');
  if(el) el.remove();
  if(dismissed){
    _hlToolbarDismissed = true;
    setTimeout(function(){ _hlToolbarDismissed = false; }, 50);
  }
}
document.addEventListener('mousedown', function(ev){
  const el = document.getElementById('hlToolbarBtn');
  if(el && el.contains(ev.target)) return;
  hideHlToolbar(true);
});
document.addEventListener('touchstart', function(ev){
  const el = document.getElementById('hlToolbarBtn');
  if(el && el.contains(ev.target)) return;
  hideHlToolbar(true);
}, {passive:true});

/* debounced selectionchange — shows toolbar when selection is stable (handles mobile where touchend may not fire) */
document.addEventListener('selectionchange', function(){
  if(_selChangeTimer) clearTimeout(_selChangeTimer);
  _selChangeTimer = setTimeout(function(){
    _selChangeTimer = null;
    const toolbar = document.getElementById('hlToolbarBtn');
    if(toolbar) return;
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed) return;
    if(!sel.toString().trim()) return;
    const node = sel.getRangeAt(0).commonAncestorContainer;
    const answerEl = (node.nodeType===1?node:node.parentElement).closest('.q-answer');
    if(!answerEl) return;
    const qid = answerEl.dataset.qid, sid = answerEl.dataset.sid;
    if(!qid) return;
    const cardEl = answerEl.closest('.q-card');
    if(!cardEl) return;
    const range = sel.getRangeAt(0);
    if(!cardEl.contains(range.commonAncestorContainer)) return;
    if(_hlToolbarDismissed) return;
    _hlToolbarDismissed = false;
    pendingHighlight = {qid, sectionId:sid, range: range.cloneRange()};
    const rect = range.getBoundingClientRect();
    if(!rect || (!rect.width && !rect.height)) return;
    hlToolbarPos = { x: rect.left + rect.width/2, yTop: rect.top, yBot: rect.bottom };
    renderHlToolbar();
  }, 200);
});

function restoreSelectionAfterFormat(wrapper, qid, sectionId){
  const sel = window.getSelection();
  sel.removeAllRanges();
  const range = document.createRange();
  range.selectNodeContents(wrapper);
  sel.addRange(range);
  pendingRangeSave(qid, sectionId, range);
}
function pendingRangeSave(qid, sectionId, range){
  const cardEl = document.getElementById('card-'+qid);
  const container = cardEl ? cardEl.querySelector('.q-answer') : null;
  if(container) state.highlightHtml[qid] = container.innerHTML;
  saveState();
  pendingHighlight = { qid, sectionId, range };
}
function applyInlineFormat(tag, attr){
  const ph = pendingHighlight;
  if(!ph || !ph.range || ph.range.collapsed) return;
  const range = ph.range.cloneRange();
  /* walk up from common ancestor to see if selection is inside a matching wrapper */
  let node = range.commonAncestorContainer;
  if(node.nodeType===3) node = node.parentNode;
  while(node && node.nodeType===1){
    if(node.tagName.toLowerCase()===tag.toLowerCase()){
      /* found wrapper → toggle off: unwrap it, keep children */
      const parent = node.parentNode;
      const first = node.firstChild, last = node.lastChild;
      while(node.firstChild) parent.insertBefore(node.firstChild, node);
      parent.removeChild(node);
      if(!first) return;
      /* re-select the unwrapped content */
      const newRange = document.createRange();
      if(first && last){
        newRange.setStartBefore(first);
        newRange.setEndAfter(last);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(newRange);
        pendingRangeSave(ph.qid, ph.sectionId, newRange);
      }
      return;
    }
    node = node.parentNode;
  }
  /* not inside the tag → wrap */
  try {
    const wrapper = document.createElement(tag);
    if(attr) wrapper.setAttribute('style', attr);
    range.surroundContents(wrapper);
    const newRange = document.createRange();
    newRange.selectNodeContents(wrapper);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(newRange);
    pendingRangeSave(ph.qid, ph.sectionId, newRange);
  } catch(e){}
}
function applyFontSize(val){
  if(!val) return;
  const ph = pendingHighlight;
  if(!ph || !ph.range || ph.range.collapsed) return;
  const sizes = {2:'13px',3:'16px',5:'24px',7:'36px'};
  const px = sizes[val] || '16px';
  try {
    const wrapper = document.createElement('span');
    wrapper.style.fontSize = px;
    ph.range.cloneRange().surroundContents(wrapper);
    const newRange = document.createRange();
    newRange.selectNodeContents(wrapper);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(newRange);
    pendingRangeSave(ph.qid, ph.sectionId, newRange);
  } catch(e){}
}
function applyTextColor(color){
  if(!color) return;
  const ph = pendingHighlight;
  if(!ph || !ph.range || ph.range.collapsed) return;
  try {
    const wrapper = document.createElement('span');
    wrapper.style.color = color;
    ph.range.cloneRange().surroundContents(wrapper);
    const newRange = document.createRange();
    newRange.selectNodeContents(wrapper);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(newRange);
    pendingRangeSave(ph.qid, ph.sectionId, newRange);
  } catch(e){}
}

function clearFormatting(){
  const ph = pendingHighlight;
  if(!ph || !ph.range || ph.range.collapsed) return;
  const cardEl = document.getElementById('card-'+ph.qid);
  const container = cardEl ? cardEl.querySelector('.q-answer') : null;
  if(!container) return;
  const range = ph.range.cloneRange();
  const toStrip = [];
  (function walk(el){
    if(el.nodeType!==1) return;
    var tag = el.tagName.toLowerCase();
    if(tag==='b' || tag==='i' || tag==='u' || tag==='span'){
      try{ if(range.intersectsNode(el)) toStrip.push(el); }catch(e){}
    }
    for(var i=0;i<el.childNodes.length;i++) walk(el.childNodes[i]);
  })(range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentElement);
  toStrip.reverse();
  for(var i=0;i<toStrip.length;i++){
    var el = toStrip[i];
    if(el.parentNode){
      var p = el.parentNode;
      while(el.firstChild) p.insertBefore(el.firstChild, el);
      p.removeChild(el);
    }
  }
  pendingRangeSave(ph.qid, ph.sectionId, range);
  refreshHlToolbar();
}

function compressImage(dataUrl, maxW, quality){
  return new Promise(function(resolve){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > maxW){ h = h * maxW / w; w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ resolve(dataUrl); };
    img.src = dataUrl;
  });
}
function insertCompressedImage(dataUrl, box, maxW, quality){
  compressImage(dataUrl, maxW, quality).then(function(compressed){
    const imgTag = '<img src="'+compressed+'" style="width:60%;max-width:100%;height:auto;">';
    const ok = document.execCommand('insertHTML', false, imgTag);
    if(!ok){ box.innerHTML += imgTag; }
  });
}
function insertImageFromFileHL(file){
  if(!file || !file.type || file.type.indexOf('image')===-1) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const dataUrl = e.target.result;
    const box = document.getElementById('hlNoteEditor');
    if(!box) return;
    box.focus();
    insertCompressedImage(dataUrl, box, 800, 0.78);
  };
  reader.onerror = function(){ alert('Could not read that image file.'); };
  reader.readAsDataURL(file);
}
function handleHLPaste(e){
  const cd = e.clipboardData || window.clipboardData;
  if(!cd) return;
  const items = cd.items;
  if(items){
    for(let i=0;i<items.length;i++){
      const item = items[i];
      if(item.type && item.type.indexOf('image')!==-1){
        e.preventDefault();
        insertImageFromFileHL(item.getAsFile());
        return;
      }
    }
  }
  const html = cd.getData('text/html');
  if(html && html.trim()){
    e.preventDefault();
    const box = document.getElementById('hlNoteEditor');
    if(!box) return;
    box.focus();
    const sanitized = sanitizePastedHtml(html);
    if(document.execCommand('insertHTML', false, sanitized)) return;
    const sel = window.getSelection();
    if(sel && sel.rangeCount>0){
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const tpl = document.createElement('template');
      tpl.innerHTML = sanitized;
      range.insertNode(tpl.content);
    } else { box.innerHTML += sanitized; }
    return;
  }
  const text = cd.getData('text/plain');
  if(text){
    e.preventDefault();
    const box = document.getElementById('hlNoteEditor');
    if(!box) return;
    box.focus();
    if(document.execCommand('insertText', false, text)) return;
    const sel = window.getSelection();
    if(sel && sel.rangeCount>0){
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(document.createTextNode(text));
    } else { box.textContent += text; }
  }
}

/* Allow-listed inline style properties kept from pasted HTML — enough to
   preserve bold/italic/underline/color/highlight/font-size, but nothing
   that could break the note's layout (position, width, margins, etc.) */
const PASTE_ALLOWED_STYLE_PROPS = ['color','background-color','font-weight','font-style','text-decoration','font-size','font-family'];
const PASTE_BLOCKED_TAGS = ['script','style','link','meta','iframe','object','embed','noscript','head','title','base','form','input','button','svg','textarea','select'];

function filterPastedStyle(styleDecl){
  let out = '';
  for(let i=0;i<PASTE_ALLOWED_STYLE_PROPS.length;i++){
    const prop = PASTE_ALLOWED_STYLE_PROPS[i];
    const val = styleDecl.getPropertyValue(prop);
    if(val) out += prop+':'+val+';';
  }
  return out;
}
function sanitizePastedNode(node){
  Array.from(node.childNodes).forEach(function(child){
    if(child.nodeType===3) return; /* plain text is always safe */
    if(child.nodeType!==1){ child.remove(); return; }
    const tag = child.tagName.toLowerCase();
    if(PASTE_BLOCKED_TAGS.indexOf(tag)!==-1){ child.remove(); return; }
    sanitizePastedNode(child); /* clean children first */
    Array.from(child.attributes).forEach(function(attr){
      const name = attr.name.toLowerCase();
      if(name==='style'){
        const filtered = filterPastedStyle(child.style);
        if(filtered) child.setAttribute('style', filtered); else child.removeAttribute('style');
      } else if(tag==='a' && name==='href'){
        /* keep links as-is */
      } else if(tag==='img' && name==='src'){
        /* keep image sources as-is */
      } else {
        child.removeAttribute(attr.name); /* drop classes/ids/event handlers/inherited widths etc. */
      }
    });
  });
}
function sanitizePastedHtml(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  sanitizePastedNode(doc.body);
  return doc.body.innerHTML;
}
/* Manual insert-at-caret fallbacks for browsers/WebViews (common on Android)
   where document.execCommand no longer works reliably */
function insertHtmlAtCaret(html){
  const box = document.getElementById('richNotes');
  if(!box) return;
  box.focus();
  if(document.execCommand('insertHTML', false, html)) return;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0){ box.innerHTML += html; return; }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const frag = tpl.content;
  const lastNode = frag.lastChild;
  range.insertNode(frag);
  if(lastNode){
    range.setStartAfter(lastNode);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }
}
function insertPlainTextAtCaret(text){
  const box = document.getElementById('richNotes');
  if(!box) return;
  box.focus();
  if(document.execCommand('insertText', false, text)) return;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0){ box.textContent += text; return; }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const node = document.createTextNode(text);
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}
function handleNotesPaste(e){
  const cd = e.clipboardData || window.clipboardData;
  if(!cd) return;

  /* 1. A copied image (screenshot, image file) always wins */
  const items = cd.items;
  if(items){
    for(let i=0;i<items.length;i++){
      const item = items[i];
      if(item.type && item.type.indexOf('image')!==-1){
        e.preventDefault();
        insertImageFromFile(item.getAsFile());
        return;
      }
    }
  }

  /* 2. Read the clipboard's HTML ourselves and insert it explicitly.
     Android's in-page paste often silently drops formatting even when the
     clipboard does contain HTML (from Word, a webpage, etc.) — unlike
     desktop Chrome/Edge, which honors it via the default paste. Reading and
     inserting it manually here means the same bold/italic/color/font-size
     formatting is preserved on both platforms. */
  const html = cd.getData('text/html');
  if(html && html.trim()){
    e.preventDefault();
    insertHtmlAtCaret(sanitizePastedHtml(html));
    return;
  }

  /* 3. Plain text fallback */
  const text = cd.getData('text/plain');
  if(text){
    e.preventDefault();
    insertPlainTextAtCaret(text);
    return;
  }
  /* nothing usable found on the clipboard — let the browser's own default
     paste happen as a last resort */
}

function currentImgWidthPct(img){
  const w = img.style.width;
  if(w && w.indexOf('%')!==-1) return parseInt(w,10)||60;
  return 60;
}
function resizeSelectedImage(deltaPct){
  if(!selectedNoteImage) return;
  const pct = Math.max(15, Math.min(100, currentImgWidthPct(selectedNoteImage)+deltaPct));
  selectedNoteImage.style.width = pct+'%';
  selectedNoteImage.style.maxWidth = '100%';
  selectedNoteImage.style.height = 'auto';
}
function moveSelectedImageUp(){
  if(!selectedNoteImage || !selectedNoteImage.parentNode) return;
  const prev = selectedNoteImage.previousSibling;
  if(prev) selectedNoteImage.parentNode.insertBefore(selectedNoteImage, prev);
}
function moveSelectedImageDown(){
  if(!selectedNoteImage || !selectedNoteImage.parentNode) return;
  const next = selectedNoteImage.nextSibling;
  if(next) selectedNoteImage.parentNode.insertBefore(next, selectedNoteImage);
}
function removeSelectedImage(){
  if(!selectedNoteImage) return;
  if(!confirm('Remove this image?')) return;
  selectedNoteImage.remove();
  deselectNoteImage();
}

function exportNotesFile(){
  if(state.notesList.length===0){ alert('You have no notes yet to export.'); return; }
  const payload = {
    app:"it-officer-prep-notes",
    version:1,
    exportedAt:new Date().toISOString(),
    notes:state.notesList
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "it-officer-notes-"+stamp+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
/* ============================= RENDER ============================= */
function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function highlight(text, query){
  if(!query) return esc(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx===-1) return esc(text);
  return esc(text.slice(0,idx)) + "<mark>" + esc(text.slice(idx,idx+query.length)) + "</mark>" + esc(text.slice(idx+query.length));
}

function gaugeSVG(pct){
  const r=60, c=2*Math.PI*r;
  const offset = c - (pct/100)*c;
  const color = pct>=70? 'var(--teal)' : pct>=30 ? 'var(--amber)' : 'var(--gray)';
  return `<svg width="150" height="150" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--border-soft)" stroke-width="10"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 75 75)" style="transition:stroke-dashoffset .4s ease"/>
    ${Array.from({length:24}).map((_,i)=>{
      const a = (i/24)*2*Math.PI - Math.PI/2;
      const x1=75+Math.cos(a)*68, y1=75+Math.sin(a)*68;
      const x2=75+Math.cos(a)*72, y2=75+Math.sin(a)*72;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--border)" stroke-width="1.5"/>`;
    }).join('')}
  </svg>`;
}

function compressAllImages(){
  const btn = document.getElementById('compressBtn');
  if(btn) btn.textContent = '⏳ Compressing…';
  const promises = [];
  /* compress images in written notes */
  state.notesList.forEach(function(note){
    if(note.content && /<img[\s>]/i.test(note.content)){
      promises.push(compressImagesInHtml(note.content).then(function(compressed){ note.content = compressed; }));
    }
  });
  /* compress images in highlight notes */
  state.highlights.forEach(function(h){
    if(h && h.note && /<img[\s>]/i.test(h.note)){
      promises.push(compressImagesInHtml(h.note).then(function(compressed){ h.note = compressed; }));
    }
  });
  /* compress images in highlightHtml */
  Object.keys(state.highlightHtml).forEach(function(key){
    const html = state.highlightHtml[key];
    if(html && /<img[\s>]/i.test(html)){
      promises.push(compressImagesInHtml(html).then(function(compressed){ state.highlightHtml[key] = compressed; }));
    }
  });
  Promise.all(promises).then(function(){
    saveState(); render();
    if(btn) btn.textContent = '✅ Done!';
    setTimeout(function(){ if(btn) btn.textContent = '🗜 Compress all images'; }, 2500);
  }).catch(function(){
    if(btn) btn.textContent = '❌ Error';
    setTimeout(function(){ if(btn) btn.textContent = '🗜 Compress all images'; }, 2500);
  });
}

function compressImagesInHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const imgs = tmp.querySelectorAll('img');
  if(imgs.length===0) return Promise.resolve(html);
  const promises = [];
  imgs.forEach(function(img){
    const src = img.getAttribute('src');
    if(src && src.indexOf('data:image')===0){
      promises.push(compressImage(src, 800, 0.78).then(function(cs){ img.setAttribute('src', cs); }));
    }
  });
  return Promise.all(promises).then(function(){ return tmp.innerHTML; });
}

function localDateStr(ts){
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
function todayLocalStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}

function questionsReadOn(dateStr){
  return allQuestions().filter(q=>{
    const ts = state.read[q.id];
    return ts && localDateStr(ts) === dateStr;
  });
}

function streakCalendar(){
  const streak = state.streak.count||0;
  const today = todayLocalStr();
  const days = [];
  for(let i=30;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const ds = y+'-'+m+'-'+dd;
    const studied = state.read && Object.values(state.read).some(ts => localDateStr(ts) === ds);
    days.push({date:ds, studied, isToday: ds===today});

  if(selectedStreakDay){

  `;
  sec.questions.forEach(q=>{
    const isRead = !!state.read[q.id];
    const isStarred = !!state.stars[q.id];
    const linkedNote = findNoteByQid(q.id);
    const tag = q.type==='practical'?'Practical':q.type==='tip'?'Interview tip':q.type==='reference'?'Reference':`Question ${q.num}`;
    html += `
      <div class="q-card ${isRead?'is-read':''}${linkedNote?' has-note':''}${isStarred?' is-starred':''}" id="card-${q.id}">
        <div class="q-top">
          <div>
            <span class="q-tag ${q.type}">${esc(tag)}</span>
            <div class="q-text">${esc(q.q)}</div>
          </div>
          <div class="q-icon-row">
            <button class="link-btn ${linkedNote?'linked':''}"
              onclick="${linkedNote?`goNoteDetail('${linkedNote.id}')`:`openLinkPicker('${q.id}','${sec.id}')`}"
              title="${linkedNote?'View linked note':'Link or add a note for this question'}">🔗</button>
            <button class="star-btn ${isStarred?'starred':''}" onclick="toggleStar('${q.id}')" title="Save to reading list">${isStarred?'★':'☆'}</button>
          </div>
        </div>
        <div class="q-answer" data-qid="${q.id}" data-sid="${sec.id}" onmouseup="handleAnswerSelection(event,'${q.id}','${sec.id}')" ontouchend="handleAnswerSelection(event,'${q.id}','${sec.id}')" oncontextmenu="event.preventDefault()">${answerHtmlFor(q)}</div>
        <div class="q-foot">
          <label class="check-label">
            <input type="checkbox" ${isRead?'checked':''} onchange="markRead('${q.id}', this.checked)"> Mark as read
          </label>
        </div>
      </div>
    `;
  });
  return html;
}

function renderSearch(){
  const query = view.query||"";
  let html = `<input id="searchInput" class="search-box" placeholder="Search all 19 cards in this deck…" value="${esc(query)}" oninput="onSearchInput(this.value)">`;
  if(!query.trim()){
    html += `<div class="empty-state">Start typing to search across every question and answer.</div>`;
    return html;
  }
  const q = query.trim().toLowerCase();
  const hitsBySection = {};
  allQuestions().forEach(item=>{
    const plainAnswer = item.a.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    if(item.q.toLowerCase().includes(q) || plainAnswer.toLowerCase().includes(q)){
      (hitsBySection[item.sectionId]=hitsBySection[item.sectionId]||{title:item.sectionTitle,items:[]}).items.push({...item, plainAnswer});
    }
  });
  if(Object.keys(hitsBySection).length===0){
    html += `<div class="empty-state">No matches for "${esc(query)}".</div>`;
    return html;
  }
  Object.values(hitsBySection).forEach(group=>{
    html += `<div class="search-group-title">${esc(group.title)} — ${group.items.length} match${group.items.length>1?'es':''}</div>`;
    group.items.forEach(item=>{
      const snippet = item.plainAnswer.slice(0,160) + (item.plainAnswer.length>160?'…':'');
      html += `
        <button class="jump-link" onclick="goSection('${item.sectionId}','${item.id}')">
          <div class="search-hit">
            <div class="search-hit-q">${highlight(item.q, q)}</div>
            <div class="search-hit-a">${highlight(snippet, q)}</div>
          </div>
        </button>`;
    });
  });
  return html;
}
function onSearchInput(v){ view.query = v; const app=document.getElementById('app'); app.innerHTML = renderSearch(); const el=document.getElementById('searchInput'); el.focus(); el.setSelectionRange(v.length,v.length); }

function renderList(){
  const starred = allQuestions().filter(q=>state.stars[q.id]);
  let html = `<div class="section-title-row"><h2>☆ Saved — ${starred.length}</h2></div>`;
  if(starred.length===0){
    html += `<div class="empty-state">Nothing saved yet — tap the ☆ on any question while studying.</div>`;
    return html;
  }
  html += `<div class="jack-grid">`;
  starred.forEach(item=>{
    const tag = item.type==='practical'?'Practical':item.type==='tip'?'Interview tip':item.type==='reference'?'Reference':`Q${item.num}`;
    const dateStr = state.stars[item.id] ? new Date(state.stars[item.id]).toLocaleDateString() : '';
    html += `
      <div class="jack-card" onclick="goSection('${item.sectionId}','${item.id}')">
        <div class="jack-top">
          <span class="jack-num">${esc(item.sectionTitle)} · ${esc(tag)}</span>
          <button class="remove-star" onclick="event.stopPropagation(); toggleStar('${item.id}')" title="Remove">×</button>
        </div>
        <div class="jack-title">${esc(item.q)}</div>
        ${dateStr ? `<div class="note-card-date" style="margin-top:8px;">Saved ${dateStr}</div>` : ''}
      </div>`;
  });
  html += `</div>`;
  return html;
}

function renderHighlightsGrid(){
  const hls = [...state.highlights].sort((a,b)=>b.updatedAt-a.updatedAt);
  if(hls.length===0){
    return `<div class="hl-card-empty">No highlights yet.<br>Select any text inside a chapter's answer and tap <b style="color:var(--amber)">🖍 Highlight</b> to save a note.</div>`;
  }
  let html = `<div class="hl-card-grid">`;
  hls.forEach(h=>{
    const sec = findSection(h.sectionId);
    const dateStr = new Date(h.updatedAt).toLocaleDateString();
    const noteExcerpt = h.note ? truncateText(plainTextFromHtml(h.note), 100) : "";
    html += `
      <div class="hl-card" onclick="openHighlightModal('${h.id}')">
        <div class="hl-card-top">
          <span class="hl-card-source">${sec?esc(sec.title):'section removed'}</span>
          <button class="remove-star" onclick="event.stopPropagation(); deleteHighlight('${h.id}')" title="Delete">×</button>
        </div>
        <div class="hl-card-quote" onclick="event.stopPropagation(); goToHighlight('${h.id}')" title="Go to highlighted text">"${esc(truncateText(h.text,100))}"</div>
        ${noteExcerpt ? `<div class="hl-card-note">${esc(noteExcerpt)}</div>` : `<div class="hl-card-note" style="color:var(--text-faint);font-style:italic;">(no note text yet)</div>`}
        <div class="hl-card-foot">
          <span class="hl-card-date">${dateStr}</span>
          <span class="hl-card-actions">
            <button onclick="event.stopPropagation(); openHighlightModal('${h.id}')">✎ edit</button>
          </span>
        </div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

function renderSimpleHighlightsGrid(){
  const shs = [...state.simpleHighlights].sort((a,b)=>b.createdAt-a.createdAt);
  const knownColors = ['yellow','lime','cyan','magenta','coral','gold','blue','lavender'];
  if(shs.length===0){
    return `<div class="sh-card-empty">No simple highlights yet.<br>Select any text in a chapter's answer and pick a color from the toolbar.</div>`;
  }
  let html = `<div class="sh-card-grid">`;
  shs.forEach(h=>{
    const sec = findSection(h.sectionId);
    const dateStr = new Date(h.createdAt).toLocaleDateString();
    const isKnown = knownColors.indexOf(h.color)!==-1;
    const cardClass = isKnown ? 'sh-card color-'+h.color : 'sh-card';
    const barHtml = isKnown ? '' : '<div class="sh-card-bar" style="background:'+h.color+';"></div>';
    html += `
      <div class="${cardClass}" onclick="goSection('${h.sectionId}','${h.qid}')">
        ${barHtml}
        <div class="sh-card-top">
          <span class="sh-card-source">${sec?esc(sec.title):'section removed'}</span>
          <button class="remove-star" onclick="event.stopPropagation(); deleteSimpleHighlightConfirm('${h.id}')" title="Delete">×</button>
        </div>
        <div class="sh-card-text">"${esc(truncateText(h.text,120))}"</div>
        <div class="sh-card-foot">
          <span class="sh-card-date">${dateStr}</span>
        </div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

function exportAllData(){
  const payload = {
    app:"it-officer-prep-full",
    version:2,
    exportedAt:new Date().toISOString(),
    state:{
      read: state.read,
      stars: state.stars,
      notes: state.notes,
      notesList: state.notesList,
      highlights: state.highlights,
      simpleHighlights: state.simpleHighlights,
      highlightHtml: state.highlightHtml,
      lastSection: state.lastSection,
      streak: state.streak,
      reviewItems: state.reviewItems,
      lastLocation: state.lastLocation
    }
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = "it-officer-full-backup-"+stamp+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importAllData(file){
  if(!file) return;
  if(!confirm('This will REPLACE all your current notes, highlights, read status, and stars with the data from this file. Continue?')) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert('Invalid JSON file.'); return; }
    const st = data.state || data;
    if(!st.read && !st.notesList){
      alert('This file does not contain recognizable app data.');
      return;
    }
    state.read = st.read||{};
    state.stars = st.stars||{};
    state.notes = st.notes||{};
    state.notesList = st.notesList||[];
    state.highlights = st.highlights||[];
    state.simpleHighlights = st.simpleHighlights||[];
    state.highlightHtml = st.highlightHtml||{};
    state.lastSection = st.lastSection||null;
    state.streak = st.streak||{count:0,lastDate:null};
    state.reviewItems = st.reviewItems||[];
    state.lastLocation = st.lastLocation||null;
    saveState();
    render();
    alert('Full data imported successfully!');
  };
  reader.onerror = function(){ alert('Could not read that file.'); };
  reader.readAsText(file);
}

function deleteSimpleHighlightConfirm(id){
  if(!confirm('Remove this simple highlight?')) return;
  deleteSimpleHighlight(id);
}

function renderNotesHome(){
  const notes = [...state.notesList].sort((a,b)=>b.updatedAt-a.updatedAt);
  const tab = view.notesTab || "written";
  const hls = state.highlights;
  const shs = state.simpleHighlights;
  let html = `
    <div class="section-title-row">
      <h2>My Notes</h2>
    </div>
    <div class="export-row">
      <button class="export-btn" onclick="goNewNote()">+ New note</button>
      <button class="export-btn" onclick="exportNotesFile()">⬇ Notes</button>
      <button class="export-btn" onclick="exportAllData()" title="Export everything: notes, highlights, read status, stars">⬇ Full backup</button>
      <button class="export-btn" onclick="document.getElementById('importAllInput').click()">⬆ Restore backup</button>
      <input type="file" id="importAllInput" accept="application/json,.json" style="display:none"
        onchange="importAllData(this.files[0]); this.value='';">
    </div>
    <div class="notes-tabs">
      <button class="notes-tab-btn ${tab==='written'?'active':''}" onclick="goNotes('written')">
        📝 Written notes <span class="count">${notes.length}</span>
      </button>
      <button class="notes-tab-btn ${tab==='highlight'?'active':''}" onclick="goNotes('highlight')">
        🖍 Note highlights <span class="count">${hls.length}</span>
      </button>
      <button class="notes-tab-btn ${tab==='simplehl'?'active':''}" onclick="goNotes('simplehl')">
        🎨 Simple highlights <span class="count">${shs.length}</span>
      </button>
      <button class="notes-tab-btn ${tab==='review'?'active':''}" onclick="goNotes('review')">
        📋 Review items <span class="count">${state.reviewItems.length}</span>
      </button>
    </div>
  `;
  if(tab==='written'){
    if(notes.length===0){
      html += `<div class="empty-state" style="padding:30px 0;">No written notes yet. Tap <b style="color:var(--text-dim)">+ New note</b> above to create one, or tap the 🔗 icon on any question in a chapter.</div>`;
    } else {
      html += `<div class="jack-grid">`;
      notes.forEach(n=>{
        const excerptFull = plainTextFromHtml(n.content).replace(/\s+/g,' ').trim();
        const hasImage = /<img[\s>]/i.test(n.content||"");
        let excerpt = truncateText(excerptFull, 90);
        if(!excerpt && hasImage) excerpt = "🖼️ Image note";
        else if(hasImage) excerpt = "🖼️ " + excerpt;
        const dateStr = new Date(n.updatedAt).toLocaleDateString();
        html += `
          <div class="jack-card" onclick="goNoteDetail('${n.id}')">
            <div class="jack-top">
              <span class="${n.linkedQid?'note-card-linked-tag':'note-card-plain-tag'}">${n.linkedQid?'🔗 linked note':'note'}</span>
              <button class="remove-star" onclick="event.stopPropagation(); deleteNoteConfirm('${n.id}')" title="Delete">×</button>
            </div>
            <div class="jack-title">${esc(n.label||'Untitled note')}</div>
            <div class="note-card-excerpt">${esc(excerpt)}</div>
            <div class="note-card-date">${dateStr}</div>
          </div>`;
      });
      html += `</div>`;
    }
  } else if(tab==='highlight'){
    html += renderHighlightsGrid();
  } else if(tab==='simplehl'){
    html += renderSimpleHighlightsGrid();
  } else {
    html += renderReviewItemsGrid();
  }
  return html;
}

function buildLinkedChip(linkedQid, linkedSectionId, noteId){
  if(!linkedQid) return "";
  const q = findQuestion(linkedQid);
  if(!q) return "";
  return `
    <div class="note-linked-chip">
      🔗 Linked to: ${esc(q.sectionTitle)} —
      <button onclick="goSection('${linkedSectionId}','${linkedQid}')">${esc(truncateText(q.q,60))} · go to question</button>
      ${noteId ? `<button onclick="unlinkNote('${noteId}')" style="color:var(--danger);margin-left:8px;">✕ Unlink</button>` : ''}
    </div>
  `;
}

function renderNoteDetail(){
  const existing = view.noteId ? findNote(view.noteId) : null;
  if(view.noteId && !existing) return renderNotesHome(); // note was deleted elsewhere
  const editing = existing ? !!view.editing : true; // new notes always start editable
  return editing ? renderNoteEditForm(existing) : renderNoteViewMode(existing);
}

function renderNoteViewMode(note){
  const linkedInfo = buildLinkedChip(note.linkedQid, note.linkedSectionId, note.id);
  const dateStr = new Date(note.updatedAt).toLocaleString();
  return `
    <button class="back-link" onclick="goNotes()">&larr; my notes</button>
    ${linkedInfo}
    <div class="study-title" style="margin-bottom:4px;">${esc(note.label||'Untitled note')}</div>
    <div class="study-sub" style="margin-bottom:18px;">Last edited ${esc(dateStr)}</div>
    <div class="q-answer note-view-content">${note.content}</div>
    <div class="note-actions-row">
      <button class="save-note-btn" onclick="goEditNote()">✎ Edit note</button>
      <button style="background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);padding:11px 18px;border-radius:8px;font-size:13.5px;font-weight:600;" onclick="deleteNoteConfirm('${note.id}')">Delete note</button>
    </div>
  `;
}

function renderNoteEditForm(note){
  const label = note ? note.label : "";
  const content = note ? note.content : "";
  const linkedQid = note ? note.linkedQid : view.linkedQid;
  const linkedSectionId = note ? note.linkedSectionId : view.linkedSectionId;
  const linkedInfo = buildLinkedChip(linkedQid, linkedSectionId);

  return `
    <button class="back-link" onclick="${note? `goNoteDetail('${note.id}')` : 'goNotes()'}">&larr; ${note?'cancel editing':'my notes'}</button>
    ${linkedInfo}
    <input id="noteLabelInput" class="note-label-input" type="text"
      placeholder="Note label (auto-detected from your text if left blank)" value="${escAttr(label)}">
    <div class="notes-toolbar">
      <button onmousedown="event.preventDefault()" onclick="notesCmd('bold')" title="Bold"><b>B</b></button>
      <button onmousedown="event.preventDefault()" onclick="notesCmd('italic')" title="Italic"><i>I</i></button>
      <button onmousedown="event.preventDefault()" onclick="notesCmd('underline')" title="Underline"><u>U</u></button>
      <select onchange="notesFontSize(this.value); this.value='';" title="Font size">
        <option value="">Size…</option>
        <option value="2">Small</option>
        <option value="3">Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
      </select>
      <span style="display:inline-flex;align-items:center;gap:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--text-dim);">
        <span>A</span>
        <input type="color" id="notesColorPicker" value="#e0a94a" style="width:32px;height:32px;border:none;border-radius:4px;padding:0;cursor:pointer;vertical-align:middle;background:none;"
          onchange="notesColor(this.value)" title="Text color">
      </span>
      <button onmousedown="event.preventDefault()" onclick="document.getElementById('noteImageInput').click()" title="Insert image">🖼️ Image</button>
      <input type="file" id="noteImageInput" accept="image/*" style="display:none"
        onchange="insertImageFromFile(this.files[0]); this.value='';">
    </div>
    <div id="imageToolbar" class="image-toolbar" style="display:none;">
      <span class="image-toolbar-label">🖼️ Image selected:</span>
      <button onclick="resizeSelectedImage(-10)" title="Shrink">− Smaller</button>
      <button onclick="resizeSelectedImage(10)" title="Enlarge">+ Larger</button>
      <button onclick="moveSelectedImageUp()" title="Move earlier in the note">⬆ Move up</button>
      <button onclick="moveSelectedImageDown()" title="Move later in the note">⬇ Move down</button>
      <button onclick="removeSelectedImage()" title="Delete this image" style="color:var(--danger);">🗑 Remove</button>
      <button onclick="deselectNoteImage()">Done</button>
    </div>
    <div id="richNotes" class="rich-notes-box" contenteditable="true"
         data-placeholder="Paste anything here (Ctrl+V) — bold text, font size, colors and pasted images are kept as-is…"
         onpaste="handleNotesPaste(event)">${content}</div>
    <div class="note-actions-row">
      <button class="save-note-btn" onclick="saveNoteFromForm()">💾 Save note</button>
      ${note ? `<button style="background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);padding:11px 18px;border-radius:8px;font-size:13.5px;font-weight:600;" onclick="deleteNoteConfirm('${note.id}')">Delete note</button>` : ``}
    </div>
    <div class="notes-hint">
      <b style="color:var(--text-dim)">Tip:</b> paste text or a screenshot with Ctrl+V (Cmd+V on Mac), or use <b style="color:var(--amber)">🖼️ Image</b> to pick a photo. Tap any image in the note to select it, then use the image toolbar above to resize, reorder, or remove it. Tap <b style="color:var(--amber)">Save note</b> when you're done.
    </div>
  `;
}

function download(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function plainAnswerOf(item){ return item.a.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }
function exportList(fmt){
  const starred = allQuestions().filter(q=>state.stars[q.id]);
  if(starred.length===0){ alert('Your reading list is empty.'); return; }
  if(fmt==='md'){
    let out = `# IT Officer Prep — Reading List\n\n`;
    starred.forEach(item=>{
      out += `## ${item.q}\n\n*${item.sectionTitle}*\n\n${plainAnswerOf(item)}\n\n`;
      const note = state.notes[item.id];
      if(note) out += `**Note:** ${note}\n\n`;
      out += `---\n\n`;
    });
    download('reading-list.md', out, 'text/markdown');
  } else if(fmt==='txt'){
    let out = 'IT OFFICER PREP — READING LIST\n\n';
    starred.forEach(item=>{
      out += `${item.q}\n(${item.sectionTitle})\n\n${plainAnswerOf(item)}\n`;
      const note = state.notes[item.id];
      if(note) out += `\nNote: ${note}\n`;
      out += '\n----------------------------------------\n\n';
    });
    download('reading-list.txt', out, 'text/plain');
  } else if(fmt==='csv'){
    const rows = [['Section','Question','Answer','Note']];
    starred.forEach(item=>{
      rows.push([item.sectionTitle, item.q, plainAnswerOf(item), state.notes[item.id]||'']);
    });
    const csv = rows.map(r=>r.map(cell=>'"'+String(cell).replace(/"/g,'""')+'"').join(',')).join('\n');
    download('reading-list.csv', csv, 'text/csv');
  } else if(fmt==='json'){
    const out = starred.map(item=>({
      section: item.sectionTitle, question: item.q, answer: plainAnswerOf(item), note: state.notes[item.id]||''
    }));
    download('reading-list.json', JSON.stringify(out,null,2), 'application/json');
  }
}

  if(resumeId){ view = {screen:'study', sectionId:resumeId}; }
