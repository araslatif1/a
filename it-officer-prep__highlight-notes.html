      {num:null,type:"tip",q:"About this section",a:`
        <p>This section focuses on Windows Server, Active Directory, Microsoft 365, Azure, Linux, virtualization, and disaster recovery. These questions are common in interviews for banks, universities, telecom companies, NGOs, and large enterprises.</p>
      `},
      {num:null,type:"reference",q:"Section F – Active Directory",a:`<p>Enterprise identity and domain management concepts.</p>`},
      {num:391,type:"question",q:"What is Active Directory?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>Active Directory (AD) is Microsoft's directory service used to centrally manage users, computers, groups, security policies, and authentication within a Windows domain.</p>
      `},
      {num:392,type:"question",q:"What is a Domain?",a:`
        <p>A Domain is a logical group of computers and users managed by one or more Domain Controllers.</p>
        <p><strong>Benefits:</strong> central authentication, centralized management, Group Policy, improved security.</p>
      `},
      {num:393,type:"question",q:"What is a Domain Controller (DC)?",a:`
        <p>A Domain Controller is a Windows Server that:</p>
        <ul>
        <li>Authenticates users</li>
        <li>Stores Active Directory</li>
        <li>Applies Group Policy</li>
        <li>Provides authentication services (Kerberos)</li>
        </ul>
      `},
      {num:394,type:"question",q:"What is an Organizational Unit (OU)?",a:`
        <p>An OU is a container used to organize users, computers, and groups.</p>
        <p>It allows administrators to apply different Group Policies and delegate administration.</p>
      `},
      {num:395,type:"question",q:"Difference between Workgroup and Domain",a:`
        <table class="mini-table"><thead><tr><th>Workgroup</th><th>Domain</th></tr></thead><tbody>
        <tr><td>Peer-to-peer</td><td>Centralized</td></tr>
        <tr><td>Separate user accounts</td><td>Central user database</td></tr>
        <tr><td>Small offices</td><td>Medium/Large organizations</td></tr>
        <tr><td>Local management</td><td>Managed by Domain Controllers</td></tr>
        </tbody></table>
      `},
      {num:396,type:"question",q:"What is Group Policy (GPO)?",a:`
        <p>Group Policy allows administrators to centrally configure Windows settings.</p>
        <p><strong>Examples:</strong> password policies, desktop wallpaper, USB restrictions, software deployment, Windows Update settings.</p>
      `},
      {num:397,type:"question",q:"A user cannot log into the domain. What do you check?",a:`
        <p><strong>Professional process:</strong></p>
        <ul>
        <li>Network connection</li>
        <li>DNS settings</li>
        <li>Domain Controller availability</li>
        <li>User account status</li>
        <li>Password</li>
        <li>Time synchronization</li>
        <li>Event Viewer</li>
        </ul>
      `},
      {num:398,type:"question",q:"What is the difference between a User Group and an Organizational Unit?",a:`
        <table class="mini-table"><thead><tr><th>Group</th><th>OU</th></tr></thead><tbody>
        <tr><td>Used to assign permissions</td><td>Used for organization and GPO application</td></tr>
        <tr><td>Security object</td><td>Administrative container</td></tr>
        </tbody></table>
      `},
      {num:399,type:"question",q:"Why are time settings important in Active Directory?",a:`
        <p>Kerberos authentication depends on accurate time synchronization.</p>
        <p>Large time differences between clients and Domain Controllers can cause authentication failures.</p>
      `},
      {num:400,type:"question",q:"What is a Roaming Profile?",a:`
        <p>A roaming profile stores a user's desktop settings and profile on a server so they follow the user when logging into different domain computers.</p>
      `},
      {num:null,type:"reference",q:"Section G – Windows Server",a:`<p>Core server infrastructure and continuity concepts.</p>`},
      {num:401,type:"question",q:"What is DNS and why is it important?",a:`
        <p>DNS translates domain names into IP addresses.</p>
        <p><strong>Without DNS:</strong> Active Directory fails, websites cannot be resolved by name, and many network services stop functioning correctly.</p>
      `},
      {num:402,type:"question",q:"What happens if DHCP stops working?",a:`
        <p>New devices cannot automatically obtain an IP address, gateway, or DNS settings.</p>
        <p>Existing devices may continue working until their DHCP lease expires.</p>
      `},
      {num:403,type:"question",q:"Difference between Static IP and Dynamic IP",a:`
        <table class="mini-table"><thead><tr><th>Static</th><th>Dynamic</th></tr></thead><tbody>
        <tr><td>Manually configured</td><td>Assigned by DHCP</td></tr>
        <tr><td>Doesn't change automatically</td><td>May change</td></tr>
        <tr><td>Servers, printers</td><td>User computers</td></tr>
        </tbody></table>
      `},
      {num:404,type:"question",q:"Why do servers usually use Static IP addresses?",a:`
        <p>Servers should have predictable addresses so clients and services can reliably locate them.</p>
      `},
      {num:405,type:"question",q:"What is RAID?",a:`
        <p>RAID (Redundant Array of Independent Disks) combines multiple drives to improve performance, redundancy, or both.</p>
      `},
      {num:406,type:"question",q:"RAID 0 vs RAID 1 vs RAID 5",a:`
        <table class="mini-table"><thead><tr><th>RAID</th><th>Feature</th></tr></thead><tbody>
        <tr><td>RAID 0</td><td>Performance only (no redundancy)</td></tr>
        <tr><td>RAID 1</td><td>Mirroring (high redundancy)</td></tr>
        <tr><td>RAID 5</td><td>Performance + redundancy using parity</td></tr>
        </tbody></table>
      `},
      {num:407,type:"question",q:"What is UPS?",a:`
        <p>UPS (Uninterruptible Power Supply) provides temporary power during electrical outages.</p>
        <p><strong>Benefits:</strong> prevents sudden shutdowns, protects equipment, allows graceful server shutdown.</p>
      `},
      {num:408,type:"question",q:"Why is server backup important?",a:`
        <p><strong>Protects against:</strong> hardware failure, malware, ransomware, human error, natural disasters.</p>
      `},
      {num:409,type:"question",q:"Difference between Backup and Replication",a:`
        <table class="mini-table"><thead><tr><th>Backup</th><th>Replication</th></tr></thead><tbody>
        <tr><td>Recovery after data loss</td><td>Keeps systems synchronized</td></tr>
        <tr><td>Historical versions may exist</td><td>Usually mirrors current data</td></tr>
        <tr><td>Disaster recovery</td><td>High availability</td></tr>
        </tbody></table>
      `},
      {num:410,type:"question",q:"What is Disaster Recovery?",a:`
        <p>Disaster Recovery (DR) is the process of restoring IT services after major failures such as cyberattacks, hardware failures, or natural disasters.</p>
      `},
      {num:null,type:"reference",q:"Section H – Microsoft 365 & Azure",a:`<p>Cloud identity, collaboration, and service-model concepts.</p>`},
      {num:411,type:"question",q:"What is Microsoft Entra ID?",a:`
        <p>Microsoft Entra ID is Microsoft's cloud identity service used for authentication, authorization, and access management.</p>
      `},
      {num:412,type:"question",q:"What is Microsoft Intune used for?",a:`
        <p>Intune manages company devices by allowing administrators to:</p>
        <ul>
        <li>Deploy applications</li>
        <li>Apply security policies</li>
        <li>Manage mobile devices</li>
        <li>Perform remote wipe of corporate data</li>
        </ul>
      `},
      {num:413,type:"question",q:"What is OneDrive?",a:`
        <p>Cloud storage for individual users with file synchronization across devices.</p>
      `},
      {num:414,type:"question",q:"What is SharePoint?",a:`
        <p>A platform for team collaboration, document management, and intranet sites.</p>
      `},
      {num:415,type:"question",q:"Difference between OneDrive and SharePoint",a:`
        <table class="mini-table"><thead><tr><th>OneDrive</th><th>SharePoint</th></tr></thead><tbody>
        <tr><td>Personal files</td><td>Team/department files</td></tr>
        <tr><td>Individual ownership</td><td>Shared collaboration</td></tr>
        </tbody></table>
      `},
      {num:416,type:"question",q:"A user cannot access Microsoft 365. What do you check?",a:`
        <ul>
        <li>Internet connection</li>
        <li>Username/password</li>
        <li>MFA</li>
        <li>License assignment</li>
        <li>Account status</li>
        <li>Service health</li>
        </ul>
      `},
      {num:417,type:"question",q:"What is SaaS?",a:`
        <p>Software delivered over the Internet.</p>
        <p><strong>Examples:</strong> Microsoft 365, Google Workspace</p>
      `},
      {num:418,type:"question",q:"What is IaaS?",a:`
        <p>Cloud provider supplies virtual machines, storage, and networking. The customer manages the operating system and applications.</p>
      `},
      {num:419,type:"question",q:"What is PaaS?",a:`
        <p>Cloud provider manages infrastructure and runtime while the customer deploys and manages applications.</p>
      `},
      {num:420,type:"question",q:"Why are organizations moving to the cloud?",a:`
        <p><strong>Benefits:</strong> scalability, lower hardware costs, remote access, automatic updates, business continuity.</p>
      `},
      {num:null,type:"reference",q:"Section I – Linux Basics",a:`<p>Baseline Linux familiarity expected from IT Officer candidates.</p>`},
      {num:421,type:"question",q:"Have you worked with Linux?",a:`
        <p><strong>A strong answer if your experience is limited:</strong></p>
        <p>"Yes. I have basic experience with Linux, including navigating the file system, managing files, checking system information, installing packages, and working with common terminal commands. I'm comfortable learning more as required."</p>
      `},
      {num:422,type:"question",q:"Difference between Linux and Windows",a:`
        <table class="mini-table"><thead><tr><th>Linux</th><th>Windows</th></tr></thead><tbody>
        <tr><td>Open source (many distributions)</td><td>Proprietary</td></tr>
        <tr><td>CLI heavily used</td><td>GUI-focused (with CLI available)</td></tr>
        <tr><td>Common on servers</td><td>Common on desktops</td></tr>
        </tbody></table>
      `},
      {num:423,type:"question",q:"Name common Linux commands",a:`
        <p><code>pwd</code>, <code>ls</code>, <code>cd</code>, <code>mkdir</code>, <code>cp</code>, <code>mv</code>, <code>rm</code>, <code>cat</code>, <code>grep</code>, <code>find</code>, <code>chmod</code>, <code>chown</code>, <code>df</code>, <code>top</code>, <code>ps</code></p>
        <p>Know what each command does.</p>
      `},
      {num:424,type:"question",q:"What does ping do?",a:`
        <p>Tests basic network connectivity and measures response time.</p>
      `},
      {num:425,type:"question",q:"What does traceroute (or tracert on Windows) do?",a:`
        <p>Shows the path packets take to reach a destination, helping diagnose routing issues.</p>
      `},
      {num:null,type:"reference",q:"Section J – Virtualization",a:`<p>Core virtualization concepts used across enterprise data centers.</p>`},
      {num:426,type:"question",q:"What is a Virtual Machine?",a:`
        <p>A software-based computer running on virtualized hardware.</p>
      `},
      {num:427,type:"question",q:"Advantages of virtualization",a:`
        <p>Better hardware utilization, easy backups, snapshots, faster deployment, isolation, scalability.</p>
      `},
      {num:428,type:"question",q:"VMware vs Hyper-V",a:`
        <table class="mini-table"><thead><tr><th>VMware</th><th>Hyper-V</th></tr></thead><tbody>
        <tr><td>VMware virtualization platform</td><td>Microsoft's virtualization platform</td></tr>
        <tr><td>Cross-platform ecosystem</td><td>Integrated with Windows Server</td></tr>
        </tbody></table>
      `},
      {num:429,type:"question",q:"What is a Snapshot (Checkpoint)?",a:`
        <p>A saved state of a virtual machine that allows administrators to return to that point if needed.</p>
      `},
      {num:430,type:"question",q:"Can multiple virtual machines run on one physical server?",a:`
        <p>Yes. This is one of the main advantages of virtualization, provided the host has sufficient CPU, RAM, storage, and other resources.</p>
      `},
      {num:null,type:"reference",q:"Section K – Real Scenarios",a:`<p>Business-impact troubleshooting scenarios common in enterprise interviews.</p>`},
      {num:431,type:"practical",q:"The CEO cannot access email while everyone else can. What do you do?",a:`
        <ul>
        <li>Verify the issue.</li>
        <li>Check Internet connectivity.</li>
        <li>Test Outlook Web Access if available.</li>
        <li>Verify credentials and MFA.</li>
        <li>Check account status and mailbox.</li>
        <li>Escalate promptly if needed due to business impact.</li>
        </ul>
      `},
      {num:432,type:"practical",q:"The entire office lost Internet. What is the professional order of steps?",a:`
        <ul>
        <li>Verify if the outage affects everyone.</li>
        <li>Check routers, switches, and firewalls.</li>
        <li>Check ISP connectivity.</li>
        <li>Verify power.</li>
        <li>Contact the ISP if necessary.</li>
        <li>Inform management of status.</li>
        </ul>
      `},
      {num:433,type:"practical",q:"A user reports a virus. What are your actions?",a:`
        <ul>
        <li>Isolate the device if appropriate.</li>
        <li>Scan with approved security tools.</li>
        <li>Remove or quarantine threats.</li>
        <li>Determine how the infection occurred.</li>
        <li>Restore normal operation.</li>
        </ul>
      `},
      {num:434,type:"practical",q:"The printer works for everyone except one user. Likely causes?",a:`
        <ul>
        <li>Local printer mapping</li>
        <li>Driver issue</li>
        <li>User permissions</li>
        <li>Print queue</li>
        <li>Application-specific settings</li>
        </ul>
      `},
      {num:435,type:"practical",q:"You receive 50 help desk tickets at once. What is the professional answer?",a:`
        <ul>
        <li>Prioritize by business impact and urgency.</li>
        <li>Address critical outages first.</li>
        <li>Communicate expected response times.</li>
        <li>Escalate or delegate when appropriate.</li>
        <li>Document progress.</li>
        </ul>
      `},
      {num:436,type:"practical",q:"A server suddenly stops responding. What do you check?",a:`
        <ul>
        <li>Power</li>
        <li>Network connectivity</li>
        <li>Hardware health</li>
        <li>System logs</li>
        <li>Services</li>
        <li>Resource usage</li>
        </ul>
      `},
      {num:437,type:"practical",q:"Users cannot access a shared folder. What do you check?",a:`
        <ul>
        <li>Server availability</li>
        <li>Network connectivity</li>
        <li>Share permissions</li>
        <li>NTFS permissions</li>
        <li>Group membership</li>
        <li>DNS if accessing by name</li>
        </ul>
      `},
      {num:438,type:"practical",q:"A laptop was stolen. What actions do you take?",a:`
        <ul>
        <li>Report immediately.</li>
        <li>Disable or secure the associated account if required.</li>
        <li>If managed, remotely lock or wipe corporate data.</li>
        <li>Reset relevant passwords.</li>
        <li>Document the incident.</li>
        </ul>
      `},
      {num:439,type:"practical",q:"You accidentally misconfigured a server. What is the professional answer?",a:`
        <p>"I would immediately inform my supervisor, assess the impact, restore the correct configuration from documentation or backups if possible, verify that services are functioning correctly, and document both the incident and the corrective actions."</p>
      `},
      {num:440,type:"question",q:"Why should we hire you?",a:`
        <p><strong>Excellent Closing Answer:</strong></p>
        <p>"I have a strong foundation in IT, experience teaching technical subjects, and practical knowledge of networking, Windows systems, hardware, troubleshooting, and software development. I enjoy solving problems, communicating with users, and continuously learning new technologies. I believe I can contribute to your IT team while continuing to grow professionally."</p>
      `},
      {num:null,type:"tip",q:"⭐ Interviewer's secret",a:`
        <p>Many experienced interviewers evaluate candidates using five key criteria:</p>
        <table class="mini-table"><thead><tr><th>Area</th><th>What They're Looking For</th></tr></thead><tbody>
        <tr><td>Technical Knowledge</td><td>Do you understand the technology?</td></tr>
        <tr><td>Troubleshooting</td><td>Can you solve problems logically?</td></tr>
        <tr><td>Communication</td><td>Can you explain technical issues clearly?</td></tr>
        <tr><td>Professionalism</td><td>Do you remain calm and ethical?</td></tr>
        <tr><td>Learning Ability</td><td>Can you adapt to new technologies?</td></tr>
        </tbody></table>
        <p>If you consistently demonstrate these five qualities, you'll stand out even if you don't know every technical detail.</p>
      `},
      {num:null,type:"reference",q:"Next part",a:`
        <p><strong>Questions 441–500</strong> will include:</p>
        <ul>

    ]

      {num:468,type:"question",q:"Protocol used to query Active Directory?",a:`<p><strong>LDAP</strong></p>`},
      {num:469,type:"question",q:"What stores Group Policies?",a:`<p><strong>SYSVOL</strong></p>`},

        <li>Domain Naming Master</li>
        <li>RID Master</li>
        <li>PDC Emulator</li>
        <li>Infrastructure Master</li>
        </ul>
      `},
      {num:473,type:"question",q:"What does DNS stand for?",a:`<p><strong>Domain Name System</strong></p>`},
      {num:474,type:"question",q:"What does DHCP stand for?",a:`<p><strong>Dynamic Host Configuration Protocol</strong></p>`},
      {num:475,type:"question",q:"What does NAT stand for?",a:`<p><strong>Network Address Translation</strong></p>`},

      {num:479,type:"question",q:"What is the loopback IP?",a:`<p><strong>127.0.0.1</strong></p>`},

      {num:481,type:"question",q:"What does VPN stand for?",a:`<p><strong>Virtual Private Network</strong></p>`},
      {num:482,type:"question",q:"Difference between authentication and authorization?",a:`
        <p><strong>Authentication:</strong> Who you are.</p>
        <p><strong>Authorization:</strong> What you can access.</p>
      `},
      {num:483,type:"question",q:"What is phishing?",a:`<p>An attempt to trick users into revealing confidential information or performing unsafe actions.</p>`},
      {num:484,type:"question",q:"What is ransomware?",a:`<p>Malware that encrypts files and demands payment.</p>`},
      {num:485,type:"question",q:"What is MFA?",a:`<p><strong>Multi-Factor Authentication.</strong></p>`},
      {num:486,type:"question",q:"Strong password recommendations?",a:`
        <ul><li>Long passphrases</li><li>Unique passwords</li><li>MFA</li><li>Password manager (if approved)</li><li>Avoid common passwords</li></ul>
      `},
      {num:487,type:"question",q:"Why install updates?",a:`
        <ul><li>Security patches</li><li>Bug fixes</li><li>Performance improvements</li><li>Compatibility improvements</li></ul>
      `},
      {num:488,type:"question",q:"Why encrypt laptops?",a:`<p>To protect sensitive data if the device is lost or stolen.</p>`},
      {num:489,type:"question",q:"What is the principle of least privilege?",a:`<p>Users should receive only the permissions necessary to perform their work.</p>`},
      {num:490,type:"question",q:"What is the first thing to do after discovering malware?",a:`<p>Contain the threat by isolating the affected system if appropriate, then follow incident response procedures.</p>`},
      {num:null,type:"tip",q:"Final HR Questions",a:`<p>The last stretch of the interview — closing HR questions.</p>`},
      {num:491,type:"question",q:"Biggest professional achievement?",a:`
        <p>Choose a real achievement.</p>
        <p><strong>Example:</strong> "Successfully teaching programming courses while completing my university studies, which strengthened both my technical knowledge and communication skills."</p>
      `},
      {num:492,type:"question",q:"Describe yourself in one sentence.",a:`
        <p><strong>Example:</strong> "I am a reliable, analytical, and motivated IT professional who enjoys solving technical problems."</p>
      `},
      {num:493,type:"question",q:"Can you relocate?",a:`<p>Be honest based on your circumstances.</p>`},
      {num:494,type:"question",q:"Expected salary?",a:`
        <p>If you don't know: "I'm open to discussing a salary that is consistent with the responsibilities of the role and the organization's compensation structure."</p>
      `},
      {num:495,type:"question",q:"What if your manager criticizes your work?",a:`
        <p><strong>A good answer:</strong> "I would listen carefully, accept constructive feedback professionally, ask questions if needed, and use the feedback to improve."</p>
      `},
      {num:496,type:"question",q:"Would you work overtime?",a:`
        <p>Answer honestly. If appropriate: "Yes, when business needs require it, especially for critical IT issues."</p>
      `},
      {num:497,type:"question",q:"Can you work independently?",a:`
        <p><strong>A good answer:</strong> "Yes. I'm comfortable working independently while also recognizing when collaboration or escalation is appropriate."</p>
      `},
      {num:498,type:"question",q:"Can you work in a team?",a:`
        <p>Yes. Provide an example from your teaching or project experience if possible.</p>
      `},
      {num:499,type:"question",q:"What is your greatest career goal?",a:`
        <p><strong>Example:</strong> "To become an experienced IT infrastructure professional, continue earning certifications, and contribute to building secure and reliable IT environments."</p>
      `},
      {num:500,type:"question",q:"Do you have anything else you'd like to add?",a:`
        <p><strong>Excellent closing answer:</strong> "Thank you for the opportunity to interview. I appreciate your time and consideration. I'm enthusiastic about this opportunity and believe my technical background, teaching experience, and willingness to learn would allow me to contribute effectively to your IT team."</p>
      `},

      {num:501,type:"question",q:"What is PowerShell?",a:`
        <p><strong>Answer:</strong></p>
        <p>PowerShell is Microsoft's command-line shell and scripting language used for automation, system administration, and configuration management. Unlike Command Prompt, it works with .NET objects instead of plain text.</p>

      {num:502,type:"question",q:"Difference between CMD and PowerShell",a:`
        <table class="mini-table"><thead><tr><th>CMD</th><th>PowerShell</th></tr></thead><tbody>
        <tr><td>Older command interpreter</td><td>Modern automation shell</td></tr>
        <tr><td>Text output</td><td>Object-based output</td></tr>
        <tr><td>Limited scripting</td><td>Powerful scripting language</td></tr>
        <tr><td>Basic administration</td><td>Enterprise automation</td></tr>
        </tbody></table>
      `},
      {num:503,type:"question",q:"How do you list all running services?",a:`
        <p><code>Get-Service</code></p>
      `},
      {num:504,type:"question",q:"How do you list stopped services?",a:`

      `},
      {num:506,type:"question",q:"Stop a service.",a:`
        <p><code>Stop-Service spooler</code></p>
      `},
      {num:507,type:"question",q:"Start a service.",a:`
        <p><code>Start-Service spooler</code></p>
      `},
      {num:508,type:"question",q:"Display all running processes.",a:`
        <p><code>Get-Process</code></p>
      `},
      {num:509,type:"question",q:"Terminate a process.",a:`
        <p><code>Stop-Process -Id 1234</code></p>
      `},

    questions:[
      {num:null,type:"tip",q:"Why PowerShell comes up in IT Officer interviews",a:`
        <p>PowerShell is increasingly used by Windows administrators for automation, reporting, Active Directory management, Microsoft 365 administration, and Azure. Even if you're not applying for a System Administrator role, interviewers often ask a few PowerShell questions.</p>
      `},
      {num:521,type:"question",q:"What is a PowerShell cmdlet?",a:`
        <p>A cmdlet is a lightweight command in PowerShell that performs a specific task.</p>
        <p>Examples: <code>Get-Service</code>, <code>Get-Process</code>, <code>Get-Help</code>, <code>Restart-Service</code></p>
        <p>PowerShell cmdlets follow the format <strong>Verb-Noun</strong>, for example: <code>Get-Process</code>, <code>Start-Service</code>, <code>Stop-Computer</code>, <code>Restart-Service</code></p>
      `},
      {num:522,type:"question",q:"How do you get help for a command?",a:`
        <p><code>Get-Help Get-Service</code></p>
        <p>Detailed help: <code>Get-Help Get-Service -Full</code></p>
        <p>Examples: <code>Get-Help Get-Service -Examples</code></p>
      `},
      {num:523,type:"question",q:"Display all available commands.",a:`<p><code>Get-Command</code></p>`},
      {num:524,type:"question",q:"Search for commands related to services.",a:`<p><code>Get-Command *service*</code></p>`},
      {num:525,type:"question",q:"What is the PowerShell Pipeline?",a:`
        <p>One of PowerShell's most powerful features.</p>
        <p>Example: <code>Get-Service | Where-Object {$_.Status -eq "Running"}</code></p>
        <p>Meaning: Get Services → Send output → Filter only Running services</p>
      `},
      {num:526,type:"question",q:"What does $_ mean?",a:`
        <p><code>$_</code> represents the current object in the pipeline.</p>
        <p>Example: <code>Where-Object {$_.Status -eq "Running"}</code></p>
        <p>Current service → Check Status → If Running → Display</p>
      `},
      {num:527,type:"question",q:"Display only running services.",a:`<p><code>Get-Service | Where-Object Status -eq Running</code></p>`},
      {num:528,type:"question",q:"Sort services alphabetically.",a:`<p><code>Get-Service | Sort-Object Name</code></p>`},
      {num:529,type:"question",q:"Display only the first 10 processes.",a:`<p><code>Get-Process | Select-Object -First 10</code></p>`},
      {num:530,type:"question",q:"Display only process name and CPU usage.",a:`<p><code>Get-Process | Select Name,CPU</code></p>`},
      {num:531,type:"question",q:"Export services to CSV.",a:`<p><code>Get-Service | Export-Csv services.csv</code></p>`},
      {num:532,type:"question",q:"Export running processes.",a:`<p><code>Get-Process | Export-Csv process.csv</code></p>`},
      {num:533,type:"question",q:"List installed Windows updates.",a:`<p><code>Get-HotFix</code></p>`},
      {num:534,type:"question",q:"Display Windows version.",a:`<p><code>Get-ComputerInfo</code></p>`},
      {num:535,type:"question",q:"Display disk usage.",a:`<p><code>Get-Volume</code></p>`},
      {num:536,type:"question",q:"Display logical disks.",a:`<p><code>Get-PSDrive</code></p>`},
      {num:537,type:"question",q:"Restart Print Spooler.",a:`<p><code>Restart-Service Spooler</code></p>`},
      {num:538,type:"question",q:"Stop Print Spooler.",a:`<p><code>Stop-Service Spooler</code></p>`},
      {num:539,type:"question",q:"Start Print Spooler.",a:`<p><code>Start-Service Spooler</code></p>`},
      {num:540,type:"question",q:"List Windows services by status.",a:`
        <p><strong>Running:</strong> <code>Get-Service | Where Status -eq Running</code></p>
        <p><strong>Stopped:</strong> <code>Get-Service | Where Status -eq Stopped</code></p>
      `},
      {num:541,type:"question",q:"List startup applications.",a:`<p><code>Get-CimInstance Win32_StartupCommand</code></p>`},
      {num:542,type:"question",q:"Display BIOS information.",a:`<p><code>Get-CimInstance Win32_BIOS</code></p>`},
      {num:543,type:"question",q:"Display motherboard information.",a:`<p><code>Get-CimInstance Win32_BaseBoard</code></p>`},
      {num:544,type:"question",q:"Display processor information.",a:`<p><code>Get-CimInstance Win32_Processor</code></p>`},
      {num:545,type:"question",q:"Display RAM information.",a:`<p><code>Get-CimInstance Win32_PhysicalMemory</code></p>`},
      {num:546,type:"question",q:"Display installed software.",a:`<p><code>Get-Package</code></p>`},
      {num:547,type:"question",q:"Display local administrators.",a:`<p><code>Get-LocalGroupMember Administrators</code></p>`},
      {num:548,type:"question",q:"Display network adapters.",a:`<p><code>Get-NetAdapter</code></p>`},
      {num:549,type:"question",q:"Disable a network adapter.",a:`
        <p><code>Disable-NetAdapter</code></p>
        <p class="tip">💡 Requires administrator privileges.</p>
      `},
      {num:550,type:"question",q:"Enable a network adapter.",a:`<p><code>Enable-NetAdapter</code></p>`},
      {num:551,type:"question",q:"Test whether a TCP port is open.",a:`<p><code>Test-NetConnection google.com -Port 443</code></p>`},
      {num:552,type:"question",q:"Display firewall rules.",a:`<p><code>Get-NetFirewallRule</code></p>`},
      {num:553,type:"question",q:"Display shared folders.",a:`<p><code>Get-SmbShare</code></p>`},
      {num:554,type:"question",q:"Display local disks.",a:`<p><code>Get-Disk</code></p>`},
      {num:555,type:"question",q:"Display partitions.",a:`<p><code>Get-Partition</code></p>`},
      {num:556,type:"question",q:"Display scheduled tasks.",a:`<p><code>Get-ScheduledTask</code></p>`},
      {num:557,type:"question",q:"What is Execution Policy?",a:`
        <p>Execution Policy controls how PowerShell scripts are allowed to run.</p>
        <p>Common policies: <strong>Restricted</strong>, <strong>RemoteSigned</strong>, <strong>AllSigned</strong>, <strong>Unrestricted</strong>, <strong>Bypass</strong></p>
      `},
      {num:558,type:"question",q:"Check Execution Policy.",a:`<p><code>Get-ExecutionPolicy</code></p>`},
      {num:559,type:"question",q:"Why shouldn't you set the execution policy to Unrestricted on production systems?",a:`
        <p>Because it allows any script to run, including potentially malicious scripts, increasing the risk of malware or accidental execution.</p>
      `},
      {num:560,type:"question",q:"What is a PowerShell script?",a:`
        <p>A text file with the extension <code>.ps1</code> containing one or more PowerShell commands.</p>
      `},
      {num:561,type:"question",q:"Difference between a variable and an object in PowerShell.",a:`
        <ul>
        <li><strong>Variable:</strong> Stores a value or object (e.g., <code>$name = "Aras"</code>).</li>
        <li><strong>Object:</strong> Contains data (properties) and actions (methods). Most PowerShell commands return objects rather than plain text.</li>
        </ul>
      `},
      {num:562,type:"question",q:"What is Get-Member used for?",a:`
        <p>It shows the properties and methods of PowerShell objects.</p>
        <p>Example: <code>Get-Process | Get-Member</code></p>
      `},
      {num:563,type:"question",q:"Why is PowerShell object-based instead of text-based?",a:`
        <p>Because objects preserve structured data, making it easier to filter, sort, export, and automate tasks without parsing plain text.</p>
      `},
      {num:564,type:"question",q:"Can PowerShell be used remotely?",a:`
        <p>Yes. PowerShell Remoting allows administrators to manage remote Windows systems securely using protocols such as WinRM.</p>
      `},
      {num:565,type:"question",q:"Name three common enterprise uses of PowerShell.",a:`
        <ul><li>Automating Active Directory user management</li><li>Generating system and inventory reports</li><li>Managing Windows servers and services</li></ul>
      `},
      {num:566,type:"question",q:"What is the advantage of scripting repetitive tasks?",a:`
        <ul><li>Saves time</li><li>Reduces human error</li><li>Ensures consistent execution</li><li>Improves productivity</li></ul>
      `},
      {num:567,type:"question",q:"How can you view command history?",a:`<p><code>Get-History</code></p>`},
      {num:568,type:"question",q:"How do you clear the console screen?",a:`<p><code>Clear-Host</code> or simply <code>cls</code></p>`},
      {num:569,type:"question",q:"Can PowerShell interact with Active Directory?",a:`
        <p>Yes. With the Active Directory module installed, PowerShell can:</p>
        <ul><li>Create users</li><li>Reset passwords</li><li>Manage groups</li><li>Query directory information</li><li>Automate administrative tasks</li></ul>
      `},
      {num:570,type:"question",q:"Why is PowerShell important for an IT Officer?",a:`
        <p><strong>Excellent interview answer:</strong></p>
        <p>"PowerShell allows administrators to automate repetitive tasks, troubleshoot systems, manage Windows computers locally and remotely, generate reports, and improve efficiency. Even for routine IT support, knowing PowerShell helps complete administrative tasks more quickly and consistently."</p>
      `},
      {num:null,type:"tip",q:"Interview tip: don't overstate your PowerShell expertise",a:`
        <p>If asked whether you are an expert in PowerShell, don't exaggerate.</p>

  {
    id:"ch12-p1",
    part:"Volume 2",
    number:"Ch. 12 · Part 1",
    title:"VMware, Hyper-V & Enterprise Virtualization (571–620)",
    questions:[
      {num:null,type:"tip",q:"Why virtualization comes up in IT Officer interviews",a:`
        <p>Virtualization is used by almost every medium and large organization. Even if you are applying for an IT Officer position rather than a System Administrator, interviewers often ask basic virtualization questions because many IT departments manage virtual servers.</p>
      `},
      {num:571,type:"question",q:"What is Virtualization?",a:`
        <p>Virtualization is the technology that allows multiple virtual computers (Virtual Machines) to run on a single physical computer by sharing its hardware resources through a hypervisor.</p>
        <p><strong>Example:</strong></p>
        <ul>
        <li>Physical Server</li>
        <li>→ Windows Server VM</li>
        <li>→ Linux VM</li>
        <li>→ SQL Server VM</li>
        <li>→ Web Server VM</li>
        </ul>
      `},
      {num:572,type:"question",q:"What is a Virtual Machine (VM)?",a:`
        <p>A Virtual Machine is a software-based computer that behaves like a physical computer.</p>
        <p>A VM has:</p>
        <ul>
        <li>Virtual CPU (vCPU)</li>
        <li>Virtual RAM</li>
        <li>Virtual Hard Disk (VHD/VMDK)</li>
        <li>Virtual Network Adapter</li>
        <li>Guest Operating System</li>
        </ul>
      `},
      {num:573,type:"question",q:"What is a Hypervisor?",a:`
        <p>A Hypervisor is software that creates and manages virtual machines.</p>
        <p>Its job is to allocate the following to each VM:</p>
        <ul>
        <li>CPU</li>
        <li>RAM</li>
        <li>Storage</li>
        <li>Network resources</li>
        </ul>
      `},
      {num:574,type:"question",q:"What are the types of Hypervisors?",a:`
        <p><strong>Type 1 (Bare Metal)</strong> — runs directly on hardware.</p>
        <p>Examples: VMware ESXi, Microsoft Hyper-V Server, Xen</p>
        <p>Advantages: better performance, higher security, used in enterprises</p>
        <p><strong>Type 2 (Hosted)</strong> — runs on top of an operating system.</p>
        <p>Examples: VMware Workstation, Oracle VirtualBox, VMware Fusion</p>
        <p>Advantages: easy to install, great for labs, development, learning</p>
      `},
      {num:575,type:"question",q:"What is the difference between Type 1 and Type 2 hypervisors?",a:`
        <table class="mini-table">
        <tr><th>Type 1</th><th>Type 2</th></tr>
        <tr><td>Runs directly on hardware</td><td>Runs on Windows/Linux/macOS</td></tr>
        <tr><td>Enterprise</td><td>Personal use</td></tr>
        <tr><td>Faster</td><td>Slightly slower</td></tr>
        <tr><td>More secure</td><td>Depends on host OS</td></tr>
        </table>
      `},
      {num:576,type:"question",q:"What is VMware ESXi?",a:`
        <p>VMware ESXi is a bare-metal hypervisor installed directly on a physical server.</p>
        <p>It manages virtual machines without requiring Windows or Linux as the host operating system.</p>
      `},
      {num:577,type:"question",q:"What is VMware vCenter?",a:`
        <p>vCenter is the centralized management platform for multiple ESXi hosts.</p>
        <p>It allows administrators to:</p>
        <ul>
        <li>Manage many servers</li>
        <li>Create VMs</li>
        <li>Monitor resources</li>
        <li>Configure clusters</li>
        <li>Perform migrations</li>
        <li>Manage permissions</li>
        </ul>
      `},
      {num:578,type:"question",q:"What is Hyper-V?",a:`
        <p>Hyper-V is Microsoft's virtualization platform included with Windows Server and supported editions of Windows Pro/Enterprise.</p>
        <p>It allows administrators to create and manage virtual machines.</p>
      `},
      {num:579,type:"question",q:"What is the difference between VMware and Hyper-V?",a:`
        <table class="mini-table">
        <tr><th>VMware</th><th>Hyper-V</th></tr>
        <tr><td>VMware ecosystem</td><td>Microsoft ecosystem</td></tr>
        <tr><td>ESXi hypervisor</td><td>Hyper-V hypervisor</td></tr>
        <tr><td>vCenter management</td><td>Hyper-V Manager / Windows Admin Center / System Center</td></tr>
        <tr><td>Widely used in enterprises</td><td>Common in Microsoft environments</td></tr>
        </table>
      `},
      {num:580,type:"question",q:"What is Oracle VirtualBox?",a:`
        <p>VirtualBox is a free Type 2 hypervisor used mainly for:</p>
        <ul>
        <li>Education</li>
        <li>Testing</li>
        <li>Software development</li>
        <li>Personal labs</li>
        </ul>
      `},
      {num:581,type:"question",q:"What is VMware Workstation?",a:`
        <p>A desktop virtualization product used to run multiple operating systems on Windows or Linux.</p>
        <p>Common uses: software testing, networking labs, training</p>
      `},
      {num:582,type:"question",q:"What is a Snapshot?",a:`
        <p>A Snapshot captures the current state of a virtual machine, including its configuration and disk state.</p>
        <p>Benefits:</p>
        <ul>
        <li>Test software safely</li>
        <li>Roll back after failed updates</li>
        <li>Recover from configuration mistakes</li>
        </ul>
      `},
      {num:583,type:"question",q:"Can a Snapshot Replace a Backup?",a:`
        <p><strong>No.</strong></p>
        <p>Snapshots are intended for short-term rollback and should not replace proper backups.</p>
        <p>Backups protect against storage failure, corruption, and long-term recovery needs.</p>
      `},
      {num:584,type:"question",q:"What is Cloning?",a:`
        <p>Cloning creates an exact copy of an existing virtual machine.</p>
        <p>Useful for: testing, rapid deployment, creating similar servers</p>
      `},
      {num:585,type:"question",q:"What is a Template?",a:`<p>A template is a prepared VM image used to deploy new virtual machines quickly with a standardized configuration.</p>`},
      {num:586,type:"question",q:"What is Thin Provisioning?",a:`
        <p>Thin provisioning allocates storage as it is actually used rather than reserving all configured disk space immediately.</p>
        <p><strong>Example:</strong> Create a 200 GB virtual disk. Initially, only 20 GB may be consumed if that's all the data written.</p>
      `},
      {num:587,type:"question",q:"What is Thick Provisioning?",a:`
        <p>Thick provisioning reserves the entire configured disk space immediately.</p>
        <p><strong>Example:</strong> 200 GB virtual disk = 200 GB allocated on storage from the start.</p>
      `},
      {num:588,type:"question",q:"What is the difference between Thin and Thick Provisioning?",a:`
        <table class="mini-table">
        <tr><th>Thin</th><th>Thick</th></tr>
        <tr><td>Saves storage space</td><td>Uses full space immediately</td></tr>
        <tr><td>Flexible</td><td>Predictable allocation</td></tr>
        <tr><td>Common for labs</td><td>Often preferred for critical workloads</td></tr>
        </table>
      `},
      {num:589,type:"question",q:"What is a Virtual Switch?",a:`
        <p>A Virtual Switch connects virtual machines to other VMs, the host, and physical networks.</p>
        <p>It performs a role similar to a physical network switch.</p>
      `},
      {num:590,type:"question",q:"What are the types of Hyper-V Virtual Switches?",a:`
        <p><strong>External</strong> — VMs can communicate with the physical network, internet, and other computers.</p>
        <p><strong>Internal</strong> — communication between the host and virtual machines, with no direct external network access.</p>
        <p><strong>Private</strong> — communication only between virtual machines on the same host. The host cannot communicate through this switch.</p>
      `},
      {num:591,type:"question",q:"What is Live Migration?",a:`
        <p>Live Migration moves a running virtual machine from one host to another with minimal or no downtime.</p>
        <p>Benefits: hardware maintenance, load balancing, high availability</p>
      `},
      {num:592,type:"question",q:"What is Storage Migration?",a:`<p>Moves a VM's virtual disks from one storage location to another without significantly interrupting service.</p>`},
      {num:593,type:"question",q:"What is High Availability (HA)?",a:`<p>If one virtualization host fails, another host automatically restarts or continues running the affected virtual machines, depending on the platform and configuration.</p>`},
      {num:594,type:"question",q:"What is Fault Tolerance (FT)?",a:`
        <p>Fault Tolerance runs a secondary synchronized copy of a VM on another host.</p>
        <p>If the primary host fails, the secondary VM continues running with little or no interruption.</p>
      `},
      {num:595,type:"question",q:"What is DRS (Distributed Resource Scheduler)?",a:`<p>In VMware environments, DRS balances workloads across multiple hosts by moving virtual machines to optimize resource usage.</p>`},
      {num:596,type:"question",q:"Why do companies use virtualization?",a:`
        <ul>
        <li>Reduced hardware costs</li>
        <li>Better resource utilization</li>
        <li>Faster deployment</li>
        <li>Simplified backups</li>
        <li>Easier disaster recovery</li>
        <li>Improved scalability</li>
        <li>Isolation of workloads</li>
        </ul>
      `},
      {num:597,type:"question",q:"What resources does a VM need?",a:`
        <p>A VM typically requires:</p>
        <ul>
        <li>CPU</li>
        <li>RAM</li>
        <li>Storage</li>
        <li>Network adapter</li>
        <li>Guest operating system</li>
        </ul>
      `},
      {num:598,type:"question",q:"Can you run Windows inside Linux?",a:`
        <p><strong>Yes.</strong></p>
        <p>By using virtualization software such as VMware Workstation, VirtualBox, KVM, or Hyper-V (Windows host).</p>
      `},
      {num:599,type:"question",q:"Can you run Linux inside Windows?",a:`
        <p><strong>Yes.</strong></p>
        <p>This can be done using Hyper-V, VMware Workstation, VirtualBox, or Windows Subsystem for Linux (WSL) for certain Linux workloads (though WSL is not a full VM by default).</p>
      `},
      {num:600,type:"question",q:"What is Nested Virtualization?",a:`
        <p>Nested virtualization means running a hypervisor inside a virtual machine.</p>
        <p><strong>Example:</strong> Physical Server → Hyper-V Host → Windows VM → VMware Workstation → Linux VM</p>
        <p>It is mainly used for labs, testing, and training.</p>
      `},
      {num:null,type:"tip",q:"Rapid Fire (601–620)",a:`<p>Quick-answer questions that commonly appear in enterprise virtualization interviews.</p>`},
      {num:601,type:"question",q:"Can multiple VMs share one CPU?",a:`<p>Yes, through CPU scheduling by the hypervisor.</p>`},
      {num:602,type:"question",q:"Can VMs have different operating systems?",a:`<p>Yes.</p>`},
      {num:603,type:"question",q:"Is virtualization the same as cloud computing?",a:`<p>No. Virtualization is a technology; cloud computing is a service model that often uses virtualization.</p>`},
      {num:604,type:"question",q:"What file extension is commonly used for VMware virtual disks?",a:`<p><code>.vmdk</code></p>`},
      {num:605,type:"question",q:"What file extension is commonly used for Hyper-V virtual disks?",a:`<p><code>.vhdx</code></p>`},
      {num:606,type:"question",q:"Which uses fewer physical servers: virtualization or one server per application?",a:`<p>Virtualization, because multiple workloads share the same hardware.</p>`},
      {num:607,type:"question",q:"What happens if the host server fails?",a:`<p>Unless high availability or fault tolerance is configured, all VMs on that host stop running.</p>`},
      {num:608,type:"question",q:"Why monitor CPU and RAM usage on virtualization hosts?",a:`<p>To avoid resource overcommitment that can degrade VM performance.</p>`},
      {num:609,type:"question",q:"Can you back up a running VM?",a:`<p>Yes, many enterprise backup solutions support application-aware backups of running VMs.</p>`},
      {num:610,type:"question",q:"Why should snapshots not be kept for long periods?",a:`<p>They consume storage, can reduce performance, and are not intended as long-term backups.</p>`},
      {num:611,type:"practical",q:"Scenario (611–620): A virtual machine becomes extremely slow. What would you check?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <ul>
        <li>CPU utilization</li>
        <li>RAM allocation and usage</li>
        <li>Disk latency and storage performance</li>
        <li>Available host resources</li>
        <li>Network utilization</li>
        <li>Recent changes or updates</li>
        <li>VM event logs</li>
        <li>Host health</li>
        <li>Backup or snapshot activity</li>
        <li>Resource contention with other VMs</li>
        </ul>
      `},
      {num:null,type:"tip",q:"Interview tip",a:`
        <p>For an IT Officer position, you are not expected to design an enterprise virtualization cluster from scratch.</p>
        <p>However, you should understand:</p>
        <ul>
        <li>What virtualization is</li>
        <li>The difference between VMware, Hyper-V, and VirtualBox</li>
        <li>What a VM, hypervisor, snapshot, clone, and template are</li>
        <li>Basic troubleshooting concepts</li>
        </ul>
        <p>Demonstrating this foundational knowledge shows that you can support modern enterprise IT environments and learn more advanced administration as your role grows.</p>
      `},
      {num:null,type:"reference",q:"Next chapter",a:`
        <p><strong>Cisco Networking & Enterprise Switching (Questions 621–700)</strong></p>
        <p>This chapter will cover:</p>
        <ul>
        <li>VLANs</li>

        </ul>
      `}

  }  ,
  {
    id:"ch13-p1",

    title:"Cisco Networking & Enterprise Switching (621–670)",
    questions:[
      {num:null,type:"tip",q:"About this chapter",a:`
        <p>This chapter is one of the most frequently tested topics in IT Officer, Network Administrator, and System Administrator interviews.</p>
        <p>Even if you are not applying for a Cisco-specific role, understanding these networking concepts is highly valuable.</p>
      `},
      {num:621,type:"question",q:"What is a Switch?",a:`
        <p>A switch is a Layer 2 networking device that forwards Ethernet frames based on MAC addresses.</p>
        <p>Unlike a hub, it sends data only to the intended destination port, reducing unnecessary traffic and improving network performance.</p>
      `},
      {num:622,type:"question",q:"What is a Router?",a:`
        <p>A router is a Layer 3 device that forwards packets between different IP networks using routing tables.</p>
        <p>Examples:</p>
        <ul>
        <li>Connects a LAN to the Internet</li>
        <li>Connects different VLANs</li>
        <li>Connects branch offices</li>
        </ul>
      `},
      {num:623,type:"question",q:"What is the difference between Hub, Switch, and Router?",a:`
        <table class="mini-table">
        <tr><th>Hub</th><th>Switch</th><th>Router</th></tr>
        <tr><td>Layer 1</td><td>Layer 2</td><td>Layer 3</td></tr>
        <tr><td>Broadcasts to all ports</td><td>Uses MAC addresses</td><td>Uses IP addresses</td></tr>
        <tr><td>Slow</td><td>Fast</td><td>Routes between networks</td></tr>
        <tr><td>Rarely used today</td><td>Very common</td><td>Essential for inter-network communication</td></tr>
        </table>
      `},
      {num:624,type:"question",q:"What is a Managed Switch?",a:`
        <p>A managed switch allows administrators to configure:</p>
        <ul>
        <li>VLANs</li>
        <li>Port security</li>
        <li>QoS</li>
        <li>SNMP</li>
        <li>Monitoring</li>
        <li>Link aggregation</li>
        <li>Spanning Tree Protocol</li>
        </ul>
      `},
      {num:625,type:"question",q:"What is an Unmanaged Switch?",a:`
        <p>An unmanaged switch requires no configuration.</p>
        <p>Simply plug in devices and it starts forwarding traffic.</p>
        <p>Best for: home networks, small offices</p>
      `},
      {num:626,type:"question",q:"What is a MAC Address?",a:`
        <p>A MAC (Media Access Control) address is a unique hardware identifier assigned to a network interface.</p>
        <p><strong>Example:</strong> <code>00:1A:2B:3C:4D:5E</code></p>
        <p>MAC addresses operate at Layer 2.</p>
      `},
      {num:627,type:"question",q:"What is an IP Address?",a:`
        <p>An IP address uniquely identifies a device on a network.</p>
        <p><strong>Example:</strong> <code>192.168.1.100</code></p>
        <p>IP addresses operate at Layer 3.</p>
      `},
      {num:628,type:"question",q:"What is the difference between MAC and IP Address?",a:`
        <table class="mini-table">
        <tr><th>MAC</th><th>IP</th></tr>
        <tr><td>Physical address</td><td>Logical address</td></tr>
        <tr><td>Usually fixed</td><td>Can change</td></tr>
        <tr><td>Layer 2</td><td>Layer 3</td></tr>
        <tr><td>Used within local network</td><td>Used for routing between networks</td></tr>
        </table>
      `},
      {num:629,type:"question",q:"What is ARP?",a:`
        <p>ARP (Address Resolution Protocol) maps an IPv4 address to a MAC address.</p>
        <p><strong>Example:</strong></p>
        <ul>
        <li>192.168.1.10</li>
        <li>→ Who has 192.168.1.10?</li>
        <li>→ 00:11:22:33:44:55</li>
        </ul>
      `},
      {num:630,type:"question",q:"What is an ARP Table?",a:`
        <p>The ARP table stores recently learned IP-to-MAC mappings.</p>
        <p>View it on Windows: <code>arp -a</code></p>
      `},
      {num:631,type:"question",q:"What is a VLAN?",a:`
        <p>A VLAN (Virtual Local Area Network) logically separates devices into different broadcast domains, even when connected to the same physical switch.</p>
        <p>Benefits:</p>
        <ul>
        <li>Improved security</li>
        <li>Better traffic management</li>
        <li>Reduced broadcasts</li>
        <li>Easier administration</li>
        </ul>
      `},
      {num:632,type:"question",q:"Why use VLANs?",a:`
        <p><strong>Example:</strong></p>
        <ul>
        <li>Switch</li>
        <li>├── VLAN 10 → HR</li>
        <li>├── VLAN 20 → Finance</li>
        <li>├── VLAN 30 → IT</li>
        <li>└── VLAN 40 → Guests</li>
        </ul>
        <p>Even on the same switch, devices in different VLANs cannot communicate directly without routing.</p>
      `},
      {num:633,type:"question",q:"What is an Access Port?",a:`
        <p>An access port belongs to one VLAN only.</p>
        <p>Typically used for: PCs, printers, IP Phones (sometimes with voice VLAN), servers</p>
      `},
      {num:634,type:"question",q:"What is a Trunk Port?",a:`
        <p>A trunk port carries traffic for multiple VLANs between networking devices.</p>
        <p>Used between: Switch ↔ Switch, Switch ↔ Router, Switch ↔ Firewall, Switch ↔ Hypervisor</p>
      `},
      {num:635,type:"question",q:"What is the difference between Access Port and Trunk Port?",a:`
        <table class="mini-table">
        <tr><th>Access</th><th>Trunk</th></tr>
        <tr><td>One VLAN</td><td>Multiple VLANs</td></tr>
        <tr><td>End devices</td><td>Network devices</td></tr>
        <tr><td>Untagged traffic</td><td>Tagged traffic (802.1Q)</td></tr>
        </table>
      `},
      {num:636,type:"question",q:"What is 802.1Q?",a:`
        <p>IEEE 802.1Q is the standard used for VLAN tagging on trunk links.</p>
        <p>It adds VLAN identification information to Ethernet frames.</p>
      `},
      {num:637,type:"question",q:"What is Inter-VLAN Routing?",a:`
        <p>Devices in different VLANs cannot communicate directly.</p>
        <p>A Layer 3 device (router or Layer 3 switch) is required to route traffic between VLANs.</p>
      `},
      {num:638,type:"question",q:"What is a Broadcast Domain?",a:`
        <p>A broadcast domain includes all devices that receive the same Layer 2 broadcast traffic.</p>
        <p>Each VLAN is a separate broadcast domain.</p>
      `},
      {num:639,type:"question",q:"What is a Collision Domain?",a:`
        <p>A collision domain is a network segment where data collisions can occur.</p>
        <p>With modern switches, each switch port is its own collision domain.</p>
      `},
      {num:640,type:"question",q:"What is Spanning Tree Protocol (STP)?",a:`
        <p>STP prevents Layer 2 loops by blocking redundant paths while keeping them available if the primary path fails.</p>
        <p>Without STP: broadcast storms, MAC table instability, network outages</p>
      `},
      {num:641,type:"question",q:"What is RSTP?",a:`<p>Rapid Spanning Tree Protocol (RSTP) is a faster version of STP that converges more quickly after topology changes.</p>`},
      {num:642,type:"question",q:"What is EtherChannel?",a:`
        <p>EtherChannel combines multiple physical links into one logical connection.</p>
        <p>Benefits: higher bandwidth, redundancy, load balancing</p>
      `},
      {num:643,type:"question",q:"What is Port Security?",a:`
        <p>Port Security limits which devices can connect to a switch port based on MAC addresses.</p>
        <p><strong>Example:</strong> Allow only one authorized computer on a port.</p>
      `},
      {num:644,type:"question",q:"What happens if an unauthorized device is connected?",a:`
        <p>Depending on the configuration, the switch may:</p>
        <ul>
        <li>Block the traffic</li>
        <li>Disable (shutdown) the port</li>
        <li>Log the violation</li>
        </ul>
      `},
      {num:645,type:"question",q:"What is QoS (Quality of Service)?",a:`
        <p>QoS prioritizes important traffic.</p>
        <p>Examples: Voice (VoIP), video conferencing, critical business applications</p>
        <p>This helps reduce latency and packet loss for time-sensitive traffic.</p>
      `},
      {num:646,type:"question",q:"What is PoE (Power over Ethernet)?",a:`
        <p>PoE delivers electrical power and network connectivity through the same Ethernet cable.</p>
        <p>Common devices: IP Phones, Wireless Access Points, IP Cameras</p>
      `},
      {num:647,type:"question",q:"What is an SFP Module?",a:`<p>An SFP (Small Form-factor Pluggable) module is a removable transceiver used for fiber-optic or copper network connections.</p>`},
      {num:648,type:"question",q:"What is the difference between Copper and Fiber?",a:`
        <table class="mini-table">
        <tr><th>Copper</th><th>Fiber</th></tr>
        <tr><td>Lower cost</td><td>Higher cost</td></tr>
        <tr><td>Shorter distance</td><td>Much longer distance</td></tr>
        <tr><td>Electrical signals</td><td>Light signals</td></tr>
        <tr><td>More susceptible to interference</td><td>Immune to electromagnetic interference</td></tr>
        </table>
      `},
      {num:649,type:"question",q:"What is Link Aggregation?",a:`
        <p>Link Aggregation combines multiple physical network links into one logical connection to increase bandwidth and provide redundancy.</p>
        <p>Examples: EtherChannel, LACP</p>
      `},
      {num:650,type:"question",q:"What is LACP?",a:`<p>LACP (Link Aggregation Control Protocol) automatically negotiates and manages bundled network links between compatible devices.</p>`},
      {num:null,type:"practical",q:"Practical Scenario 1: Two computers on the same switch cannot communicate. How would you troubleshoot?",a:`
        <ul>
        <li>Check link lights.</li>
        <li>Verify cables.</li>
        <li>Confirm both devices are powered on.</li>
        <li>Check IP configuration (ipconfig).</li>
        <li>Verify subnet mask.</li>
        <li>Ping the local IP.</li>
        <li>Ping the default gateway.</li>
        <li>Verify VLAN assignment.</li>
        <li>Check switch port status.</li>
        <li>Review firewall settings if necessary.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Practical Scenario 2: Only one department lost network connectivity. Possible causes?",a:`
        <ul>
        <li>Incorrect VLAN configuration</li>
        <li>Failed switch port</li>
        <li>DHCP scope issue</li>
        <li>Access Control List (ACL)</li>
        <li>Trunk failure</li>
        <li>Layer 3 routing issue</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Practical Scenario 3: Users report intermittent network slowness. What would you check?",a:`
        <ul>
        <li>High CPU usage on network devices</li>
        <li>Interface errors</li>
        <li>Duplex/speed mismatches</li>
        <li>Bandwidth utilization</li>
        <li>Broadcast or multicast traffic</li>
        <li>Network loops</li>
        <li>Failing cables or hardware</li>
        <li>QoS configuration</li>
        <li>ISP issues (if Internet-related)</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Practical Scenario 4: A new employee cannot access the company network. What's the professional troubleshooting order?",a:`
        <ul>
        <li>Verify the network cable or Wi-Fi connection.</li>
        <li>Check whether the switch port is enabled.</li>
        <li>Confirm the correct VLAN assignment.</li>
        <li>Verify DHCP is assigning an IP address.</li>
        <li>Check Active Directory account (if applicable).</li>
        <li>Test access to network resources.</li>
        <li>Confirm permissions.</li>
        </ul>
      `},
      {num:null,type:"reference",q:"Common Cisco CLI Commands",a:`
        <p>Even if you're not a Cisco administrator, interviewers may ask whether you recognize these commands.</p>
        <table class="mini-table">
        <tr><th>Command</th><th>Purpose</th></tr>
        <tr><td><code>show running-config</code></td><td>Display current configuration</td></tr>
        <tr><td><code>show startup-config</code></td><td>Display saved configuration</td></tr>
        <tr><td><code>show interfaces</code></td><td>View interface status and statistics</td></tr>

        <tr><td><code>show vlan brief</code></td><td>Display VLANs</td></tr>
        <tr><td><code>show mac address-table</code></td><td>Display learned MAC addresses</td></tr>
        <tr><td><code>show arp</code></td><td>Display ARP table</td></tr>
        <tr><td><code>show version</code></td><td>Display software and hardware information</td></tr>
        <tr><td><code>show cdp neighbors</code></td><td>Show directly connected Cisco devices</td></tr>
        <tr><td><code>ping</code></td><td>Test connectivity</td></tr>
        <tr><td><code>traceroute</code></td><td>Trace network path</td></tr>
        </table>
      `},
      {num:null,type:"tip",q:"Interview tip",a:`
        <p>You are not expected to memorize every Cisco command for an IT Officer interview.</p>
        <p>However, you should confidently understand:</p>
        <ul>
        <li>How switches differ from routers.</li>
        <li>Why VLANs are used.</li>
        <li>The purpose of access and trunk ports.</li>
        <li>Basic network troubleshooting.</li>
        <li>Common enterprise networking concepts.</li>
        </ul>
        <p>This knowledge is frequently enough to perform well in interviews for IT support, IT officer, and junior network administration roles.</p>
      `},

    questions:[
      {num:null,type:"tip",q:"About this chapter",a:`
        <p>This chapter covers advanced networking concepts that are commonly asked in interviews for banks, universities, telecom companies, government organizations, and enterprise IT departments.</p>
      `},
      {num:null,type:"reference",q:"Section 1 – Routing",a:`<p>Static and dynamic routing, routing tables, and common routing protocols.</p>`},
      {num:671,type:"question",q:"What is Routing?",a:`
        <p>Routing is the process of forwarding IP packets from one network to another using a router or Layer 3 switch.</p>
        <p><strong>Example:</strong></p>
        <ul>
        <li>PC</li>
        <li>→ Switch</li>
        <li>→ Router</li>
        <li>→ Internet</li>
        </ul>
      `},
      {num:672,type:"question",q:"What is a Routing Table?",a:`
        <p>A routing table is a database that contains information about where packets should be forwarded.</p>
        <p>Typical entries include:</p>
        <ul>
        <li>Destination Network</li>
        <li>Subnet Mask</li>
        <li>Gateway (Next Hop)</li>
        <li>Interface</li>
        <li>Metric</li>
        </ul>
      `},
      {num:673,type:"question",q:"What is the difference between Static and Dynamic Routing?",a:`
        <table class="mini-table">
        <tr><th>Static</th><th>Dynamic</th></tr>

/* Flatten with stable ids */
const SECTIONS = DATA.map(sec=>{
  sec.questions.forEach((q,i)=>{ q.id = sec.id+"-q"+i; });
  return sec;
});
function allQuestions(){ return SECTIONS.flatMap(s=>s.questions.map(q=>({...q,sectionId:s.id,sectionTitle:s.title}))); }
function findSection(id){ return SECTIONS.find(s=>s.id===id); }
function findQuestion(qid){ return allQuestions().find(q=>q.id===qid); }

/* ============================= STATE ============================= */
const STORE_KEY = "itofficer_study_v1";
const DB_NAME = "itofficer_study_db";
const DB_STORE = "state";

function defaultState(){
  return {read:{}, stars:{}, notes:{}, notesList:[], highlights:[], simpleHighlights:[], highlightHtml:{}, lastSection:null, streak:{count:0,lastDate:null}, reviewItems:[], lastLocation:null, fsTag:12, fsQ:18, fsA:16.5, fsNotes:16, fsDash:14, fsSet:14};
}

/* ---- IndexedDB helpers ---- */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onerror = ()=>{ reject(req.error); };
    req.onsuccess = ()=>{ resolve(req.result); };
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
  });
}
function dbSave(data){
  return openDB().then(db=>{
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(DB_STORE,'readwrite');
      const store = tx.objectStore(DB_STORE);
      store.put(data, 'main');
      tx.oncomplete = ()=>{ db.close(); resolve(); };
      tx.onerror = ()=>{ db.close(); reject(tx.error); };
    });
  });
}
function dbLoad(){
  return openDB().then(db=>{
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(DB_STORE,'readonly');
      const store = tx.objectStore(DB_STORE);
      const req = store.get('main');
      req.onsuccess = ()=>{ db.close(); resolve(req.result); };
      req.onerror = ()=>{ db.close(); reject(req.error); };
    });
  }).catch(()=>null);
}

/* ---- Migrate data from localStorage to IndexedDB ---- */
function migrateFromLocalStorage(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    /* save to IndexedDB silently */
    dbSave(s).catch(()=>{});
    return s;
  } catch(e){ return null; }
}

/* ---- Load state: try IndexedDB first, fallback localStorage, then default ---- */
function normalizeState(s){
  if(!s) return null;
  s.read = s.read||{}; s.stars = s.stars||{}; s.notes = s.notes||{};
  s.notesList = s.notesList||[];
  s.highlights = s.highlights||[];
  s.simpleHighlights = s.simpleHighlights||[];
  s.highlightHtml = s.highlightHtml||{};
  s.reviewItems = s.reviewItems||[];
  s.lastLocation = s.lastLocation||null;
  /* migrate old single-blob scratchpad into a note */
  if(s.customNotes && s.notesList.length===0){
    s.notesList.push({
      id:'note_migrated_'+Date.now(), label:'Imported notes', content:s.customNotes,
      linkedQid:null, linkedSectionId:null, createdAt:Date.now(), updatedAt:Date.now()
    });
    delete s.customNotes;
  }
  s.streak = s.streak||{count:0,lastDate:null};
  s.fsTag = s.fsTag||12; s.fsQ = s.fsQ||18; s.fsA = s.fsA||16.5; s.fsNotes = s.fsNotes||16; s.fsDash = s.fsDash||14; s.fsSet = s.fsSet||14;
  return s;
}

let state = normalizeState(migrateFromLocalStorage()) || defaultState();

/* Try to load full state from IndexedDB (larger storage) in background */
dbLoad().then(data=>{
  if(data){
    const n = normalizeState(data);
    if(n){ Object.assign(state, n); }
  }
  /* apply saved font sizes */
  applyFontSizes();
  /* also cache a copy in localStorage for fast startup next time */
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ /* ignore full */ }
  render();
}).catch(()=>{});

function applyFontSizes(){
  var r = document.documentElement;
  r.style.setProperty('--fs-tag', (state.fsTag||12) + 'px');
  r.style.setProperty('--fs-q', (state.fsQ||18) + 'px');
  r.style.setProperty('--fs-a', (state.fsA||16.5) + 'px');
  r.style.setProperty('--fs-notes', (state.fsNotes||16) + 'px');
  r.style.setProperty('--fs-dash', (state.fsDash||14) + 'px');
  r.style.setProperty('--fs-set', (state.fsSet||14) + 'px');
}
applyFontSizes();
function saveState(){
  /* Primary: IndexedDB (much larger quota) */
  dbSave(state).catch(function(e){
    /* Fallback: localStorage */
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch(e2){
      alert("Storage is full. Try exporting your notes as backup, then remove or shrink some images.");
    }
  });
  /* Also keep localStorage cache for fast startup (silently ignore if full) */
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ /* ok */ }
}

const REVIEW_INTERVAL_DAYS = 3;
function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(state.streak.lastDate === today) return;
  if(state.streak.lastDate){
    const prev = new Date(state.streak.lastDate);
    const diffDays = Math.round((new Date(today)-prev)/86400000);
    state.streak.count = (diffDays === 1) ? state.streak.count+1 : 1;
  } else {
    state.streak.count = 1;
  }
  state.streak.lastDate = today;
  saveState();
}

function sectionStats(sec){
  const total = sec.questions.length;
  const read = sec.questions.filter(q=>state.read[q.id]).length;
  const pct = total? Math.round(read/total*100) : 0;
  let status = "gray";
  if(read===total && total>0) status="teal";
  else if(read>0) status="amber";
  return {total,read,pct,status};
}
function overallMastery(){
  const all = allQuestions();
  const total = all.length;
  const read = all.filter(q=>state.read[q.id]).length;
  return {total, read, pct: total? Math.round(read/total*100):0};
}
function dueForReviewCount(){
  const now = Date.now();
  return Object.entries(state.read).filter(([qid,ts])=>{
    return (now-ts) >= REVIEW_INTERVAL_DAYS*86400000;
  }).length;
}
function lastUnfinishedSection(){
  if(state.lastSection){
    const sec = findSection(state.lastSection);
    if(sec){ const st = sectionStats(sec); if(st.read>0 && st.read<st.total) return sec.id; }
  }
  for(const sec of SECTIONS){
    const st = sectionStats(sec);
    if(st.read>0 && st.read<st.total) return sec.id;
  }
  return null;
}

let view = {screen:"dashboard", sectionId:null, jumpTo:null};

/* ---- Navigation with back support (Android back button) ---- */
const navStack = [];
function saveLastLocation(){
  state.lastLocation = JSON.parse(JSON.stringify(view));
  saveState();
}
function navPush(){
  navStack.push(JSON.parse(JSON.stringify(view)));
  history.pushState({nav:true}, '');
  saveLastLocation();
}
window.addEventListener('beforeunload', function(){ saveLastLocation(); });

/* Swipe from left edge → go to dashboard (Android back gesture) */
(function(){
  let startX = 0, startY = 0;
  document.addEventListener('touchstart', function(e){
    const t = e.changedTouches[0];
    startX = t.clientX;
    startY = t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);
    /* swipe right ≥80px from left edge (within 40px), minimal vertical drift */
    if(dx >= 80 && startX <= 40 && dy < dx * 0.5){
      goDashboard();
    }
  }, {passive:true});
})();

function navBack(){
  if(navStack.length>1){
    navStack.pop();
    view = navStack.pop();
    render();
  } else if(navStack.length===1){
    view = navStack.pop();
    render();
  } else {
    view = {screen:'dashboard'};
    render();
  }
}
window.addEventListener('popstate', function(e){
  if(navStack.length>0) navBack();
});
function goDashboard(){ navPush(); view={screen:"dashboard"}; render(); }
function goLastLocation(){
  if(state.lastLocation && state.lastLocation.screen){
    navPush();
    view = JSON.parse(JSON.stringify(state.lastLocation));
    render();
  } else { goDashboard(); }
}
function goSearch(){ navPush(); view={screen:"search", query: view.query||""}; render(); setTimeout(()=>{ const el=document.getElementById('searchInput'); if(el) el.focus(); },0); }
function goList(){ navPush(); view={screen:"list"}; render(); }

/* ---- Link-a-note picker: lets a question link to an existing saved note
   (moving the link onto it) instead of always forcing a brand-new note ---- */
let linkPickerState = null;
function openLinkPicker(qid, sectionId){ linkPickerState = {qid, sectionId}; render(); }
function closeLinkPicker(){ linkPickerState = null; render(); }
function linkExistingNoteToQuestion(noteId){
  if(!linkPickerState) return;
  const note = findNote(noteId);
  if(!note) return;
  note.linkedQid = linkPickerState.qid;
  note.linkedSectionId = linkPickerState.sectionId;
  note.updatedAt = Date.now();
  saveState();
  const targetId = note.id;
  linkPickerState = null;
  goNoteDetail(targetId);
}
function createNewLinkedNote(){
  if(!linkPickerState) return;
  const {qid, sectionId} = linkPickerState;
  linkPickerState = null;
  goNewNote(qid, sectionId);
}
function renderLinkPickerModal(){
  const {qid} = linkPickerState;
  const q = findQuestion(qid);
  const notes = [...state.notesList].sort((a,b)=>b.updatedAt-a.updatedAt);
  const itemsHtml = notes.length ? notes.map(function(n){
    const isSameQ = n.linkedQid===qid;
    const excerpt = truncateText(plainTextFromHtml(n.content).replace(/\s+/g,' ').trim(), 70) || '(empty note)';
    let tag = '';
    if(isSameQ) tag = '<span class="link-picker-item-tag">🔗 already linked here</span>';
    else if(n.linkedQid){
      const otherQ = findQuestion(n.linkedQid);
      tag = '<span class="link-picker-item-tag">🔗 linked to: '+esc(truncateText(otherQ?otherQ.q:'another question',40))+'</span>';
    }
    return '<button class="link-picker-item" '+(isSameQ?'disabled':'')+' onclick="linkExistingNoteToQuestion(\''+n.id+'\')">'
      + '<div class="link-picker-item-label">'+esc(n.label)+(tag?' &nbsp; '+tag:'')+'</div>'
      + '<div class="link-picker-item-excerpt">'+esc(excerpt)+'</div>'
      + '</button>';
  }).join('') : '<div class="empty-state">No saved notes yet — create your first one below.</div>';
  return ''
    + '<div class="link-picker-overlay" onclick="if(event.target===this) closeLinkPicker()">'
    +   '<div class="link-picker-modal">'
    +     '<div class="link-picker-header">'
    +       '<div>'
    +         '<div class="link-picker-title">Link a note</div>'
    +         '<div class="link-picker-sub">'+(q?esc(truncateText(q.q,70)):'')+'</div>'
    +       '</div>'
    +       '<button class="link-picker-close-btn" onclick="closeLinkPicker()">✕</button>'
    +     '</div>'
    +     '<button class="export-btn" style="width:100%;margin-bottom:12px;" onclick="createNewLinkedNote()">+ Create new note</button>'
    +     '<div class="link-picker-list">'+itemsHtml+'</div>'
    +   '</div>'
    + '</div>';
}

let hlToolbarPos = null;       // {x, yTop, yBot}

function answerHtmlFor(q){ return state.highlightHtml[q.id] || q.a; }

function handleAnswerSelection(e, qid, sectionId){
  if(e.type==='contextmenu') e.preventDefault();
  if(!e.currentTarget) return; // bail if not called from a DOM event (e.g. programmatic)
  const sel = window.getSelection();
  /* Clicking/tapping on a note highlight mark opens the modal */
  if(e.type==='mouseup' || e.type==='touchend'){
    let t = e.target;
    if(t && t.nodeType!==1) t = t.parentNode;
    if(t && t.closest){
      const mark = t.closest('mark.user-hl[data-hlid]');
      if(mark){ e.preventDefault(); openHighlightModal(mark.getAttribute('data-hlid')); hideHlToolbar(); return; }
    }
  }
  if(!sel || sel.isCollapsed || sel.toString().trim()===''){ hideHlToolbar(); return; }
  /* toolbar was just dismissed by outside tap — don't reopen for the same stale selection */
  if(_hlToolbarDismissed) return;
  _hlToolbarDismissed = false;
  const container = e.currentTarget;
  const range = sel.getRangeAt(0);
  if(!container.contains(range.commonAncestorContainer)) return;
  pendingHighlight = {qid, sectionId, range: range.cloneRange()};
  const rect = range.getBoundingClientRect();
  if(!rect || (!rect.width && !rect.height)) return;
  hlToolbarPos = { x: rect.left + rect.width/2, yTop: rect.top, yBot: rect.bottom };
  renderHlToolbar();
}

function findHighlightUnderSelection(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return null;
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  while(node && node!==document.body){
    if(node.nodeType===1){
      if(node.matches && node.matches('mark.user-hl[data-hlid]'))
        return {type:'note', id:node.getAttribute('data-hlid')};
      if(node.matches && node.matches('mark.simple-hl[data-shid]'))
        return {type:'simple', id:node.getAttribute('data-shid')};
    }
    node = node.parentNode;
  }
  return null;
}
function removeHighlightAt(ex){

  pendingHighlight = null;
  if(ex.type==='note') deleteHighlight(ex.id);

}

function copySelectedText(){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed) return;
  const text = sel.toString();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){});
  } else {
    document.execCommand('copy');
  }
  hideHlToolbar();
  window.getSelection().removeAllRanges();
  pendingHighlight = null;
}
function selectAllInAnswer(){
  if(!pendingHighlight) return;
  const cardEl = document.getElementById('card-'+pendingHighlight.qid);
  const container = cardEl ? cardEl.querySelector('.q-answer') : null;
  if(!container) return;
  const range = document.createRange();
  range.selectNodeContents(container);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  const rect = range.getBoundingClientRect();
  hlToolbarPos = { x: rect.left + rect.width/2, yTop: rect.top, yBot: rect.bottom };
  renderHlToolbar();
}
