  {
    id:"ch4-p3",
    part:"Volume 1",
    number:"Ch. 4 · Part 3",
    title:"Subnetting, CIDR, Broadcast Addresses & Enterprise Networks",
    questions:[
      {num:76,type:"question",q:"What is subnetting?",a:`
        <p>Subnetting is the process of dividing a larger network into smaller logical networks called subnets.</p>
        <p>Subnetting is used to:</p>
        <ul><li>Improve security</li><li>Reduce broadcast traffic</li><li>Improve performance</li><li>Organize departments</li><li>Use IP addresses efficiently</li></ul>
        <p>Example — instead of putting the entire company on one network (192.168.1.0/24), you may create:</p>
        <ul>
        <li>192.168.1.0/26 → IT</li>
        <li>192.168.1.64/26 → HR</li>
        <li>192.168.1.128/26 → Finance</li>
        <li>192.168.1.192/26 → Management</li>
        </ul>
      `},
      {num:77,type:"question",q:"What is CIDR?",a:`
        <p><strong>CIDR</strong> = Classless Inter-Domain Routing. CIDR uses slash notation, e.g. <code>192.168.1.0/24</code> — the number after the slash indicates how many bits belong to the network portion.</p>
        <table class="mini-table"><thead><tr><th>CIDR</th><th>Subnet Mask</th></tr></thead><tbody>
        <tr><td>/8</td><td>255.0.0.0</td></tr>
        <tr><td>/16</td><td>255.255.0.0</td></tr>
        <tr><td>/24</td><td>255.255.255.0</td></tr>
        <tr><td>/25</td><td>255.255.255.128</td></tr>
        <tr><td>/26</td><td>255.255.255.192</td></tr>
        <tr><td>/27</td><td>255.255.255.224</td></tr>
        <tr><td>/28</td><td>255.255.255.240</td></tr>
        <tr><td>/29</td><td>255.255.255.248</td></tr>
        <tr><td>/30</td><td>255.255.255.252</td></tr>
        </tbody></table>
      `},
      {num:78,type:"question",q:"What is a network address?",a:`
        <p>The network address identifies the subnet itself.</p>
        <p>Example: IP <code>192.168.1.10</code>, mask <code>255.255.255.0</code> → network address <code>192.168.1.0</code></p>
      `},
      {num:79,type:"question",q:"What is a broadcast address?",a:`
        <p>A broadcast address is used to send traffic to all hosts within a subnet.</p>
        <p>Example: network <code>192.168.1.0/24</code> → broadcast <code>192.168.1.255</code>. Every device in that subnet receives the broadcast packet.</p>
      `},
      {num:80,type:"question",q:"What are usable host addresses?",a:`
        <p>Usable addresses are the addresses available for devices.</p>
        <p>Example: <code>192.168.1.0/24</code></p>
        <ul>
        <li>Network address: 192.168.1.0</li>
        <li>Broadcast address: 192.168.1.255</li>
        <li>Usable: 192.168.1.1 to 192.168.1.254</li>
        </ul>
        <p>Total usable hosts: <strong>254</strong></p>
      `},
      {num:81,type:"question",q:"What is the formula for number of hosts?",a:`
        <p><code>2^HostBits − 2</code></p>
        <p>Subtract 2 because:</p>
        <ul><li>One address is the network address</li><li>One address is the broadcast address</li></ul>
      `},
      {num:82,type:"question",q:"How many hosts can a /24 support?",a:`
        <p>Mask 255.255.255.0 → host bits: 8</p>
        <p>2^8 − 2 = 254</p>
        <p><strong>Answer: 254 usable hosts.</strong></p>
      `},
      {num:83,type:"question",q:"How many hosts can a /26 support?",a:`
        <p>Host bits: 6</p>
        <p>2^6 − 2 = 62</p>
        <p><strong>Answer: 62 usable hosts.</strong></p>
      `},
      {num:84,type:"question",q:"How many hosts can a /27 support?",a:`
        <p>Host bits: 5</p>
        <p>2^5 − 2 = 30</p>
        <p><strong>Answer: 30 usable hosts.</strong></p>
      `},
      {num:85,type:"question",q:"How many hosts can a /29 support?",a:`
        <p>Host bits: 3</p>
        <p>2^3 − 2 = 6</p>
        <p><strong>Answer: 6 usable hosts.</strong></p>
      `},
      {num:86,type:"question",q:"How many hosts can a /30 support?",a:`
        <p>Host bits: 2</p>
        <p>2^2 − 2 = 2</p>
        <p><strong>Answer: 2 usable hosts.</strong></p>
        <p class="tip">💡 Commonly used for router-to-router links and point-to-point connections.</p>
      `},
      {num:87,type:"question",q:"Subnetting example: find the network, broadcast, and usable range for 192.168.10.130/26",a:`
        <p><strong>Step 1:</strong> /26 means mask 255.255.255.192</p>
        <p><strong>Block size:</strong> 256 − 192 = 64</p>
        <p><strong>Subnets:</strong> 0, 64, 128, 192</p>
        <p>130 falls inside the 128–191 range, therefore:</p>
        <ul>
        <li>Network: 192.168.10.128</li>
        <li>Broadcast: 192.168.10.191</li>
        <li>Usable: 192.168.10.129 to 192.168.10.190</li>
        </ul>
      `},
      {num:88,type:"question",q:"What is VLSM?",a:`
        <p><strong>VLSM</strong> = Variable Length Subnet Mask. Allows different subnet sizes within the same network.</p>
        <p>Example:</p>
        <ul>
        <li>IT: 50 hosts → use /26</li>
        <li>HR: 20 hosts → use /27</li>
        <li>Management: 5 hosts → use /29</li>
        </ul>
        <p class="tip">💡 This saves IP addresses.</p>
      `},
      {num:89,type:"question",q:"Managed vs unmanaged switch — what's the difference?",a:`
        <table class="mini-table"><thead><tr><th>Managed</th><th>Unmanaged</th></tr></thead><tbody>
        <tr><td>VLAN support</td><td>No VLAN</td></tr>
        <tr><td>SNMP</td><td>No</td></tr>
        <tr><td>Monitoring</td><td>No</td></tr>
        <tr><td>Security features</td><td>No</td></tr>
        <tr><td>Configuration possible</td><td>Plug-and-play</td></tr>
        <tr><td>Enterprise use</td><td>Home use</td></tr>
        </tbody></table>
      `},
      {num:90,type:"question",q:"What is a Layer 3 switch?",a:`
        <p>A Layer 3 switch can:</p>
        <ul><li>Switch traffic like a normal switch</li><li>Route traffic between VLANs</li></ul>
        <p>It performs both Layer 2 switching and Layer 3 routing.</p>
      `},
      {num:91,type:"question",q:"Router vs Layer 3 switch — what's the difference?",a:`
        <table class="mini-table"><thead><tr><th>Router</th><th>Layer 3 Switch</th></tr></thead><tbody>
        <tr><td>WAN capable</td><td>Mostly LAN</td></tr>
        <tr><td>Slower</td><td>Faster</td></tr>
        <tr><td>Internet edge</td><td>Internal routing</td></tr>
        <tr><td>ISP connections</td><td>Inter-VLAN routing</td></tr>
        </tbody></table>
      `},
      {num:92,type:"question",q:"What is inter-VLAN routing?",a:`
        <p>Devices in different VLANs cannot communicate directly.</p>
        <p>Example: VLAN 10 (192.168.10.0/24) and VLAN 20 (192.168.20.0/24) need a router or a Layer 3 switch to communicate.</p>
      `},
      {num:93,type:"question",q:"What is a default route?",a:`
        <p>A default route is used when the router does not know a more specific route.</p>
        <p>Example: <code>0.0.0.0/0</code> — usually points toward the ISP router or internet gateway.</p>
      `},
      {num:94,type:"question",q:"Static routing vs dynamic routing — what's the difference?",a:`
        <table class="mini-table"><thead><tr><th>Static</th><th>Dynamic</th></tr></thead><tbody>
        <tr><td>Manual</td><td>Automatic</td></tr>
        <tr><td>Small networks</td><td>Large networks</td></tr>
        <tr><td>Less CPU usage</td><td>More CPU usage</td></tr>
        <tr><td>Easy</td><td>Complex</td></tr>
        <tr><td>Doesn't adapt automatically</td><td>Adapts automatically</td></tr>
        </tbody></table>
      `},
      {num:95,type:"question",q:"What is OSPF?",a:`
        <p><strong>OSPF</strong> = Open Shortest Path First. A dynamic routing protocol.</p>
        <p>Characteristics:</p>
        <ul><li>Fast convergence</li><li>Enterprise standard</li><li>Uses cost metric</li><li>Link-state protocol</li></ul>
      `},
      {num:96,type:"question",q:"What is BGP?",a:`
        <p><strong>BGP</strong> = Border Gateway Protocol. Used between ISPs, large organizations, and internet backbone providers.</p>
        <p class="tip">💡 The Internet itself largely relies on BGP.</p>
      `},
      {num:null,type:"practical",q:"Practical scenario 1: HR cannot access Finance servers — possible causes?",a:`
        <ul><li>VLAN issue</li><li>Routing issue</li><li>ACL restriction</li><li>Firewall rule</li><li>Incorrect subnet mask</li><li>Wrong default gateway</li></ul>
      `},
      {num:null,type:"practical",q:"Practical scenario 2: an entire VLAN loses connectivity — possible causes?",a:`
        <ul><li>Trunk failure</li><li>VLAN deleted</li><li>Switch failure</li><li>Layer 3 switch issue</li><li>Router failure</li><li>STP issue</li></ul>
      `},
      {num:null,type:"practical",q:"Practical scenario 3: one subnet cannot reach the Internet — troubleshooting steps?",a:`
        <ol>
        <li>Check IP address.</li>
        <li>Check subnet mask.</li>
        <li>Check default gateway.</li>
        <li>Ping gateway.</li>
        <li>Check routing.</li>
        <li>Check NAT.</li>
        <li>Check firewall.</li>
        <li>Check ISP connectivity.</li>
        </ol>
      `},
      {num:null,type:"reference",q:"Quick memorization table — CIDR to usable hosts",a:`
        <table class="mini-table"><thead><tr><th>CIDR</th><th>Hosts</th></tr></thead><tbody>
        <tr><td>/24</td><td>254</td></tr>
        <tr><td>/25</td><td>126</td></tr>
        <tr><td>/26</td><td>62</td></tr>
        <tr><td>/27</td><td>30</td></tr>
        <tr><td>/28</td><td>14</td></tr>
        <tr><td>/29</td><td>6</td></tr>
        <tr><td>/30</td><td>2</td></tr>
        </tbody></table>
        <p class="tip">💡 Memorizing this table will solve many subnetting questions quickly during interviews.</p>
      `},
      {num:null,type:"tip",q:"Interview tip: how to work through any subnetting problem",a:`
        <p>When given a subnetting problem:</p>
        <ol>
        <li>Determine the subnet mask.</li>
        <li>Calculate the block size.</li>
        <li>Identify the subnet range.</li>
        <li>Find the network address.</li>
        <li>Find the broadcast address.</li>
        <li>Determine the usable host range.</li>
        </ol>
        <p>Following this process consistently is much faster and less error-prone than trying to memorize answers.</p>
      `}
    ]
  },
  {
    id:"ch5-p1",
    part:"Volume 1",
    number:"Ch. 5 · Part 1",
    title:"Windows Fundamentals (97–115)",
    questions:[
      {num:null,type:"tip",q:"Why Windows is important",a:`
        <p>Over 90% of companies use Windows for employee workstations, and many rely on Windows Server for infrastructure. As an IT Officer, you'll be expected to install, configure, troubleshoot, and secure Windows systems.</p>
      `},
      {num:97,type:"question",q:"What is Microsoft Windows?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>Microsoft Windows is a graphical operating system developed by Microsoft that manages computer hardware and software resources while providing users with an interface to run applications.</p>
        <p>Its responsibilities include:</p>
        <ul>
        <li>Memory management</li>
        <li>Process management</li>
        <li>File management</li>
        <li>Device management</li>
        <li>Security</li>
        <li>User authentication</li>
        <li>Networking</li>
        </ul>
      `},
      {num:98,type:"question",q:"What is an Operating System?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>An Operating System (OS) is system software that acts as an intermediary between users, applications, and computer hardware.</p>
        <p>Without an OS: programs cannot run, hardware cannot be managed, users cannot interact efficiently with the computer.</p>
        <p>Examples include: Windows, Linux, macOS</p>
      `},
      {num:99,type:"question",q:"What happens when Windows boots?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <ul>
        <li>Power button pressed.</li>
        <li>PSU supplies power.</li>
        <li>BIOS/UEFI starts.</li>
        <li>POST checks hardware.</li>
        <li>Bootloader starts.</li>
        <li>Windows Kernel loads.</li>
        <li>Hardware drivers initialize.</li>
        <li>System services start.</li>
        <li>User login screen appears.</li>
        <li>User profile loads after authentication.</li>
        <li>Desktop and startup applications load.</li>
        </ul>
      `},
      {num:100,type:"question",q:"What is the Windows Kernel?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>The Windows Kernel is the core component of the operating system. It manages:</p>
        <ul>
        <li>CPU scheduling</li>
        <li>Memory allocation</li>
        <li>Device communication</li>
        <li>Process execution</li>
        <li>Security</li>
        <li>Interrupt handling</li>
        </ul>
        <p>Applications communicate with hardware through the kernel rather than directly.</p>
      `},
      {num:101,type:"question",q:"What is NTFS?",a:`
        <p>One of the most common Windows interview questions.</p>
        <p><strong>Excellent Answer:</strong></p>
        <p>NTFS (New Technology File System) is the default file system used by modern Windows operating systems.</p>
        <p>Features include: file permissions (ACLs), encryption (EFS), compression, journaling, large file support, disk quotas, reliability</p>
      `},
      {num:102,type:"question",q:"What is the difference between FAT32, exFAT, and NTFS?",a:`
        <table class="mini-table">
        <tr><th>Feature</th><th>FAT32</th><th>exFAT</th><th>NTFS</th></tr>
        <tr><td>Maximum file size</td><td>4 GB</td><td>Very large</td><td>Very large</td></tr>
        <tr><td>Permissions</td><td>❌</td><td>❌</td><td>✅</td></tr>
        <tr><td>Encryption</td><td>❌</td><td>❌</td><td>✅</td></tr>
        <tr><td>Compression</td><td>❌</td><td>❌</td><td>✅</td></tr>
        <tr><td>Journaling</td><td>❌</td><td>❌</td><td>✅</td></tr>
        <tr><td>Windows system drive</td><td>No</td><td>No</td><td>Yes</td></tr>
        </table>
        <p class="tip">Interview tip: many interviewers ask which format should be used for a Windows installation. The correct answer is NTFS.</p>
      `},
      {num:103,type:"question",q:"What is Device Manager?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>Device Manager is a Windows utility used to view, manage, configure, update, disable, or uninstall hardware devices and drivers.</p>
        <p>Common uses: install drivers, update drivers, check hardware status, diagnose hardware problems</p>
        <p>Shortcut: <code>devmgmt.msc</code></p>
      `},
      {num:104,type:"question",q:"What is Task Manager?",a:`
        <p>Task Manager monitors: running applications, CPU usage, memory usage, disk usage, network usage, startup applications, services, user sessions</p>
        <p>Shortcut: <code>Ctrl + Shift + Esc</code></p>
        <p class="tip">Interview tip: if a PC is slow, Task Manager is usually the first tool to open.</p>
      `},
      {num:105,type:"question",q:"What is Event Viewer?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>Event Viewer records Windows events including: errors, warnings, information, security events, application logs, system logs</p>
        <p>Useful for diagnosing: Blue Screens, driver failures, login problems, service failures</p>
        <p>Shortcut: <code>eventvwr.msc</code></p>
      `},
      {num:106,type:"question",q:"What are Windows Services?",a:`
        <p>Services are background programs that start automatically or manually and provide system functions.</p>
        <p>Examples: Windows Update, Print Spooler, DHCP Client, DNS Client, Windows Defender, Remote Desktop Services</p>
        <p>Command: <code>services.msc</code></p>
      `},
      {num:107,type:"question",q:"What is the Registry?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>The Windows Registry is a hierarchical database that stores: operating system settings, user preferences, installed software configuration, hardware information</p>
        <p>Registry Editor: <code>regedit</code></p>
        <p class="warn">Interview warning: incorrect changes to the registry can prevent Windows from working properly. Always back up the registry before making significant changes.</p>
      `},
      {num:108,type:"question",q:"What is Safe Mode?",a:`
        <p>Safe Mode starts Windows using only essential drivers and services.</p>
        <p>Used for: malware removal, driver troubleshooting, startup problems, system recovery</p>
      `},
      {num:109,type:"question",q:"What are the different types of Safe Mode?",a:`
        <p><strong>Safe Mode</strong> — basic drivers only.</p>
        <p><strong>Safe Mode with Networking</strong> — includes network drivers. Useful for internet access, downloading drivers, remote troubleshooting.</p>
        <p><strong>Safe Mode with Command Prompt</strong> — starts with Command Prompt instead of the desktop. Useful for advanced recovery tasks.</p>
      `},
      {num:110,type:"question",q:"What is Disk Management?",a:`
        <p>Disk Management allows administrators to: create partitions, delete partitions, extend volumes, shrink volumes, format drives, assign drive letters, initialize disks</p>
        <p>Command: <code>diskmgmt.msc</code></p>
      `},
      {num:111,type:"question",q:"What is the difference between MBR and GPT?",a:`
        <table class="mini-table">
        <tr><th>MBR</th><th>GPT</th></tr>
        <tr><td>Older</td><td>Modern</td></tr>
        <tr><td>Max 2 TB boot disk</td><td>Supports much larger disks</td></tr>
        <tr><td>Up to 4 primary partitions</td><td>Many partitions</td></tr>
        <tr><td>BIOS</td><td>UEFI</td></tr>
        <tr><td>Less resilient</td><td>More resilient with redundancy</td></tr>
        </table>
      `},
      {num:112,type:"question",q:"What is User Account Control (UAC)?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>User Account Control (UAC) is a Windows security feature that helps prevent unauthorized changes by prompting for administrator approval before allowing actions that require elevated privileges.</p>
      `},
      {num:113,type:"question",q:"What is the difference between Administrator and Standard User?",a:`
        <table class="mini-table">
        <tr><th>Administrator</th><th>Standard User</th></tr>
        <tr><td>Install software</td><td>Limited</td></tr>
        <tr><td>Change system settings</td><td>Limited</td></tr>
        <tr><td>Manage users</td><td>No</td></tr>
        <tr><td>Install drivers</td><td>No</td></tr>
        <tr><td>Full control</td><td>Restricted permissions</td></tr>
        </table>
      `},
      {num:114,type:"question",q:"What is Windows Defender?",a:`
        <p>Windows Defender (Microsoft Defender Antivirus) is Microsoft's built-in security solution.</p>
        <p>Features: antivirus, firewall integration, real-time protection, ransomware protection, cloud protection</p>
      `},
      {num:115,type:"question",q:"What is BitLocker?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>BitLocker is Microsoft's full-disk encryption technology.</p>
        <p>Advantages: protects data if a laptop is lost or stolen, prevents unauthorized access to the drive, can use a TPM chip for secure key storage</p>
      `},
      {num:null,type:"practical",q:"Scenario 1: Windows is stuck at \"Preparing Automatic Repair.\" What is the excellent troubleshooting process?",a:`
        <ul>
        <li>Restart the system once to rule out a temporary issue.</li>
        <li>Disconnect unnecessary USB devices.</li>
        <li>Boot into the Windows Recovery Environment (WinRE).</li>
        <li>Run Startup Repair.</li>
        <li>If Startup Repair fails, open Command Prompt and check the disk: <code>chkdsk C: /f /r</code></li>
        <li>Repair system files if Windows is accessible: <code>sfc /scannow</code></li>
        <li>If needed, repair the Windows image: <code>DISM /Online /Cleanup-Image /RestoreHealth</code></li>
        <li>Restore from a System Restore point if available.</li>
        <li>If hardware issues are suspected, test the SSD/HDD and RAM.</li>
        <li>As a last resort, reinstall Windows after backing up user data.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario 2: A user cannot install software. What are the possible causes and troubleshooting steps?",a:`
        <p>Possible causes:</p>
        <ul>
        <li>Standard user account without administrator rights.</li>
        <li>Group Policy restrictions.</li>
        <li>Application blocked by antivirus.</li>
        <li>Windows Defender SmartScreen.</li>
        <li>Corrupted installer.</li>
        <li>Insufficient disk space.</li>
        </ul>
        <p>Troubleshooting:</p>
        <ul>
        <li>Verify user permissions.</li>
        <li>Run the installer as Administrator.</li>
        <li>Check antivirus or SmartScreen messages.</li>
        <li>Ensure enough free disk space.</li>
        <li>Review Event Viewer for installation errors.</li>
        <li>Confirm the installer is compatible with the Windows version.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario 3: A user reports their computer is very slow. What is the systematic troubleshooting approach?",a:`
        <ul>
        <li>Ask when the issue started.</li>
        <li>Open Task Manager and review CPU, RAM, Disk, and Network usage.</li>
        <li>Disable unnecessary startup applications.</li>
        <li>Check available disk space.</li>
        <li>Scan for malware.</li>
        <li>Install pending Windows updates if appropriate.</li>
        <li>Update device drivers.</li>
        <li>Review Event Viewer for recurring errors.</li>
        <li>Check storage health (SMART diagnostics).</li>
        <li>Consider upgrading from an HDD to an SSD if performance is limited by storage.</li>
        </ul>
      `},
      {num:null,type:"reference",q:"Windows Administrative Tools you should know",a:`
        <table class="mini-table">
        <tr><th>Tool</th><th>Command</th><th>Purpose</th></tr>
        <tr><td>Task Manager</td><td><code>taskmgr</code></td><td>Monitor processes and performance</td></tr>
        <tr><td>Device Manager</td><td><code>devmgmt.msc</code></td><td>Manage hardware devices</td></tr>
        <tr><td>Disk Management</td><td><code>diskmgmt.msc</code></td><td>Manage disks and partitions</td></tr>
        <tr><td>Event Viewer</td><td><code>eventvwr.msc</code></td><td>View system and application logs</td></tr>
        <tr><td>Services</td><td><code>services.msc</code></td><td>Manage Windows services</td></tr>
        <tr><td>Registry Editor</td><td><code>regedit</code></td><td>Edit registry settings</td></tr>
        <tr><td>System Configuration</td><td><code>msconfig</code></td><td>Configure startup and boot options</td></tr>
        <tr><td>Computer Management</td><td><code>compmgmt.msc</code></td><td>Central administration console</td></tr>
        </table>
      `},
      {num:null,type:"tip",q:"Interview tip",a:`
        <p>When answering Windows troubleshooting questions, avoid jumping straight to reinstalling Windows.</p>
        <p>A professional IT Officer follows a structured process:</p>
        <ul>
        <li>Gather information.</li>
        <li>Reproduce the issue if possible.</li>
        <li>Check logs and built-in tools.</li>
        <li>Identify the root cause.</li>
        <li>Apply the least disruptive solution.</li>
        <li>Test the fix.</li>
        <li>Document the work performed.</li>
        </ul>
        <p>Employers value methodical troubleshooting more than quick guesses.</p>
      `},

        </ul>
        <p>This section is especially important because many IT Officer positions require working in Windows domain environments with centralized management.</p>
      `}
    ]

  {
    id:"ch5-p2",
    part:"Volume 1",
    number:"Ch. 5 · Part 2",
    title:"Windows Administration (Enterprise Level) (116–138)",
    questions:[
      {num:116,type:"question",q:"What is Active Directory (AD)?",a:`
        <p><strong>Why they ask:</strong> Almost every medium or large company uses Active Directory. If the job mentions Windows Server, users, or enterprise IT, expect this question.</p>
        <p><strong>Excellent Answer:</strong></p>
        <p>Active Directory (AD) is Microsoft's centralized directory service used to manage:</p>
        <ul>
        <li>Users</li>
        <li>Computers</li>
        <li>Groups</li>
        <li>Printers</li>
        <li>Servers</li>
        <li>Security Policies</li>
        <li>Authentication</li>
        <li>Authorization</li>
        </ul>
        <p>Instead of creating user accounts on every computer separately, Active Directory stores all accounts centrally on a Domain Controller.</p>
        <p><strong>Real example:</strong> Without AD, a user "Ahmed" would need to be created separately on PC1, PC2, and PC3. With AD, Ahmed is created once on the Domain Controller and can log into any company computer — much easier to manage.</p>
      `},
      {num:117,type:"question",q:"What is a Domain?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A Domain is a centralized administrative environment managed by one or more Domain Controllers.</p>
        <p>Benefits include: centralized login, centralized security, Group Policies, shared resources, easier management</p>
        <p><strong>Example:</strong> company.local or company.com</p>
      `},
      {num:118,type:"question",q:"What is a Workgroup?",a:`
        <p>A Workgroup is a peer-to-peer environment.</p>
        <p>Characteristics: no centralized management, every PC has its own users, suitable for small offices, simple to configure</p>
        <table class="mini-table">
        <tr><th>Domain</th><th>Workgroup</th></tr>
        <tr><td>Centralized</td><td>Decentralized</td></tr>
        <tr><td>Active Directory</td><td>None</td></tr>
        <tr><td>Domain Controller</td><td>No server required</td></tr>
        <tr><td>Enterprise</td><td>Home / Small Office</td></tr>
        <tr><td>Group Policy</td><td>No Group Policy</td></tr>
        <tr><td>One login everywhere</td><td>Separate accounts on each PC</td></tr>
        </table>
      `},
      {num:119,type:"question",q:"What is a Domain Controller (DC)?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>A Domain Controller is a Windows Server that hosts Active Directory.</p>
        <p>Responsibilities include: user authentication, password management, Group Policy, DNS, security, user account management</p>
        <p>Think of it as the "brain" of a Windows domain.</p>
      `},
      {num:120,type:"question",q:"What is Authentication?",a:`
        <p>Authentication answers the question: <strong>Who are you?</strong></p>
        <p>Examples: username/password, smart card, fingerprint, face recognition, multi-factor authentication (MFA)</p>
      `},
      {num:121,type:"question",q:"What is Authorization?",a:`
        <p>Authorization answers: <strong>What are you allowed to do?</strong></p>
        <p><strong>Example:</strong> Ahmed logs in successfully (Authentication ✔). Can Ahmed access the Finance folder? Authorization decides.</p>
        <table class="mini-table">
        <tr><th>Authentication</th><th>Authorization</th></tr>
        <tr><td>Identity verification</td><td>Permission verification</td></tr>
        <tr><td>Login</td><td>Access control</td></tr>
        <tr><td>Username/password</td><td>Read, Write, Modify</td></tr>
        </table>
      `},
      {num:122,type:"question",q:"What is an Organizational Unit (OU)?",a:`
        <p>OU = Organizational Unit. Used to organize objects inside Active Directory.</p>
        <p><strong>Example:</strong> Company → IT → HR → Finance → Sales</p>
        <p>Each OU can have different policies, different administrators, and different permissions.</p>
      `},
      {num:123,type:"question",q:"What is Group Policy (GPO)?",a:`
        <p>One of the most important Windows Server interview questions.</p>
        <p><strong>Excellent Answer:</strong></p>
        <p>A Group Policy Object (GPO) allows administrators to centrally configure Windows computers and users.</p>
        <p>Examples: disable USB, require password complexity, install printers, map network drives, disable Control Panel, configure Windows Update</p>
      `},
      {num:124,type:"question",q:"Give examples of Group Policies.",a:`
        <p>Interviewers often ask for examples. Examples include:</p>
        <ul>
        <li>Disable USB storage</li>
        <li>Disable Command Prompt</li>
        <li>Disable Registry Editor</li>
        <li>Disable Task Manager</li>
        <li>Set desktop wallpaper</li>
        <li>Lock screen timeout</li>
        <li>Password policy</li>
        <li>Drive mapping</li>
        <li>Printer deployment</li>
        <li>Software deployment</li>
        </ul>
      `},
      {num:125,type:"question",q:"What is DNS in Active Directory?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>Active Directory depends heavily on DNS. DNS allows clients to locate Domain Controllers, authentication services, and network resources.</p>
        <p>Without DNS, Active Directory usually does not function correctly.</p>
      `},
      {num:126,type:"question",q:"What is DHCP?",a:`
        <p><strong>Enterprise Answer:</strong></p>
        <p>DHCP automatically assigns IP Address, Gateway, DNS, and Lease time — instead of configuring every computer manually.</p>
      `},
      {num:127,type:"question",q:"What is a Roaming Profile?",a:`
        <p>A roaming profile stores a user's desktop and settings on the server.</p>
        <p><strong>Benefit:</strong> a user logs into PC1 and their desktop appears. Later they log into PC2 and the same desktop appears.</p>
      `},
      {num:128,type:"question",q:"What is Folder Redirection?",a:`
        <p>Instead of saving files locally, folders like Desktop, Documents, Pictures, and Downloads can automatically be stored on a server.</p>
        <p>Advantages: easy backup, users keep files after PC replacement, central management</p>
      `},
      {num:129,type:"question",q:"NTFS Permission vs Share Permission?",a:`
        <p>Very common interview question.</p>
        <p><strong>NTFS:</strong> applies locally, works even without network sharing.</p>
        <p><strong>Share Permission:</strong> applies only over the network.</p>
        <p><strong>Effective Permission:</strong> usually, the most restrictive permission wins.</p>
      `},
      {num:130,type:"question",q:"What are the common NTFS Permissions?",a:`
        <ul>
        <li>Full Control</li>
        <li>Modify</li>
        <li>Read & Execute</li>
        <li>Read</li>
        <li>Write</li>
        </ul>
      `},
      {num:131,type:"question",q:"What is Remote Desktop (RDP)?",a:`
        <p>RDP = Remote Desktop Protocol. Default Port: <code>3389</code></p>
        <p>Allows remote administration of Windows computers.</p>
        <p>Advantages: remote support, remote administration, server management</p>
      `},
      {num:132,type:"question",q:"What is Windows Firewall?",a:`
        <p>Windows Firewall filters incoming and outgoing network traffic based on rules.</p>
        <p>Functions: allow traffic, block traffic, restrict ports, restrict applications</p>
      `},
      {num:133,type:"question",q:"What is Windows Update?",a:`
        <p>Windows Update provides: security patches, bug fixes, driver updates, feature updates</p>
        <p>Keeping systems updated helps reduce security risks and improve stability.</p>
      `},
      {num:134,type:"question",q:"What is WSUS?",a:`
        <p>WSUS = Windows Server Update Services</p>
        <p>Allows companies to: download updates once, approve updates, control update timing, reduce Internet bandwidth usage</p>
      `},
      {num:135,type:"question",q:"What is PowerShell?",a:`
        <p>PowerShell is Microsoft's command-line shell and scripting language for automation and administration.</p>
        <p>Examples of tasks: create users, restart services, manage files, query system information, automate repetitive tasks</p>
      `},
      {num:136,type:"question",q:"CMD vs PowerShell?",a:`
        <table class="mini-table">
        <tr><th>CMD</th><th>PowerShell</th></tr>
        <tr><td>Older</td><td>Modern</td></tr>
        <tr><td>Basic commands</td><td>Advanced scripting</td></tr>
        <tr><td>Limited automation</td><td>Powerful automation</td></tr>
        <tr><td>Text output</td><td>Structured objects</td></tr>
        <tr><td>Simple administration</td><td>Enterprise management</td></tr>
        </table>
      `},
      {num:137,type:"reference",q:"Useful CMD Commands",a:`
        <p>Interviewers sometimes ask you to list commands you use regularly.</p>
        <table class="mini-table">
        <tr><th>Command</th><th>Purpose</th></tr>
        <tr><td><code>ipconfig</code></td><td>Network configuration</td></tr>
        <tr><td><code>ping</code></td><td>Connectivity test</td></tr>
        <tr><td><code>tracert</code></td><td>Route tracing</td></tr>
        <tr><td><code>nslookup</code></td><td>DNS lookup</td></tr>
        <tr><td><code>netstat</code></td><td>Network connections</td></tr>
        <tr><td><code>tasklist</code></td><td>Running processes</td></tr>
        <tr><td><code>taskkill</code></td><td>End process</td></tr>
        <tr><td><code>sfc /scannow</code></td><td>Repair system files</td></tr>
        <tr><td><code>chkdsk</code></td><td>Check disk</td></tr>
        <tr><td><code>shutdown</code></td><td>Shutdown or restart</td></tr>
        </table>
      `},
      {num:138,type:"reference",q:"Useful PowerShell Commands",a:`
        <ul>
        <li><code>Get-Service</code> — Lists services.</li>
        <li><code>Get-Process</code> — Lists running processes.</li>
        <li><code>Get-ComputerInfo</code> — Displays system information.</li>
        <li><code>Restart-Service</code> — Restarts a service.</li>
        <li><code>Get-NetIPAddress</code> — Displays IP configuration.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario 1: A user cannot log into the domain. What is the excellent troubleshooting process?",a:`
        <ul>
        <li>Confirm username and password.</li>
        <li>Verify Caps Lock and keyboard layout.</li>
        <li>Check network connectivity.</li>
        <li>Ensure the computer can reach the Domain Controller.</li>
        <li>Verify DNS settings.</li>
        <li>Check whether the account is locked or disabled.</li>
        <li>Confirm the computer's time is synchronized with the domain.</li>
        <li>Review authentication-related events in Event Viewer.</li>
        <li>Test logging in with another domain account.</li>
        <li>Escalate if a Domain Controller outage is suspected.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario 2: Group Policy is not applying. How do you troubleshoot?",a:`
        <ul>
        <li>Verify the computer is joined to the domain.</li>
        <li>Confirm the user/computer is in the correct OU.</li>
        <li>Run: <code>gpupdate /force</code></li>
        <li>Check applied policies: <code>gpresult /r</code></li>
        <li>Verify security filtering on the GPO.</li>
        <li>Ensure the GPO is linked and enabled.</li>
        <li>Check DNS connectivity to the Domain Controller.</li>
        <li>Review Event Viewer for Group Policy errors.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario 3: A user cannot access a shared folder. What are the possible causes and troubleshooting steps?",a:`
        <p>Possible causes:</p>
        <ul>
        <li>Incorrect NTFS permissions.</li>
        <li>Incorrect Share permissions.</li>
        <li>Network connectivity issues.</li>
        <li>DNS or name resolution problems.</li>
        <li>User not in the required security group.</li>
        <li>Server offline.</li>
        </ul>
        <p>Troubleshooting:</p>
        <ul>
        <li>Confirm the server is reachable.</li>
        <li>Verify the shared folder path.</li>
        <li>Test with another user account.</li>
        <li>Review both Share and NTFS permissions.</li>
        <li>Confirm group membership.</li>
        <li>Check Event Viewer for related errors.</li>
        </ul>
      `},
      {num:null,type:"tip",q:"IT Officer interview tip",a:`
        <p>When discussing enterprise Windows administration, emphasize centralized management, security, and standardization.</p>
        <p>For example, rather than saying: <em>"I would change the setting on every computer."</em></p>
        <p>Say: <em>"If the computers are joined to a domain, I would first determine whether the change can be implemented centrally using Group Policy. This approach is more efficient, consistent, and easier to maintain across multiple systems."</em></p>
        <p>This demonstrates that you think like an enterprise IT professional rather than someone managing individual PCs.</p>
      `},
      {num:null,type:"reference",q:"Next chapter",a:`
        <p><strong>Windows Troubleshooting (Part 3)</strong></p>
        <p>The next section will focus on practical issues you'll encounter in daily IT support, including:</p>
        <ul>
        <li>Blue Screen of Death (BSOD)</li>
        <li>Windows startup failures</li>
        <li>Login problems</li>
        <li>Printer issues</li>
        <li>Driver conflicts</li>
        <li>Windows Update failures</li>
        <li>High CPU and memory usage</li>
        <li>Disk performance problems</li>
        <li>Event Viewer analysis</li>
        <li>Step-by-step troubleshooting workflows</li>
        <li>Real interview scenarios with model answers</li>
        </ul>
        <p>This chapter is particularly valuable because many interviewers present troubleshooting scenarios to evaluate how you approach problems, not just what facts you know.</p>
      `}
    ]

  {
    id:"ch5-p3",
    part:"Volume 1",
    number:"Ch. 5 · Part 3",
    title:"Windows Troubleshooting (Real IT Officer Scenarios)",
    questions:[
      {num:139,type:"question",q:"A user says: \"My computer won't turn on.\" How do you troubleshoot it?",a:`
        <p>First, determine whether the issue is no power or no display.</p>
        <p>Step-by-step troubleshooting:</p>
        <ol>
        <li>Ask what happened before the issue started.</li>
        <li>Check if the power cable is securely connected.</li>
        <li>Verify the wall outlet works.</li>
        <li>Check the PSU power switch.</li>
        <li>Look for power LEDs.</li>
        <li>Listen for fan activity.</li>
        <li>Check monitor power and cables.</li>
        <li>Disconnect unnecessary USB devices.</li>
        <li>Test with another power cable if available.</li>
        <li>If there is still no response, suspect the PSU, motherboard, or power button.</li>
        </ol>
      `},
      {num:140,type:"question",q:"The computer turns on but nothing appears on the screen — what do you check?",a:`
        <p>Possible causes:</p>
        <ul><li>Monitor powered off</li><li>Loose HDMI/DisplayPort cable</li><li>Wrong input source</li><li>Faulty RAM</li><li>Faulty GPU</li><li>Motherboard issue</li><li>CPU issue</li></ul>
        <p>Troubleshooting:</p>
        <ol>
        <li>Test with another monitor.</li>
        <li>Reseat RAM.</li>
        <li>Remove and reseat the graphics card.</li>
        <li>Listen for beep codes.</li>
        <li>Check motherboard diagnostic LEDs.</li>
        </ol>
      `},
      {num:141,type:"question",q:"What is POST?",a:`
        <p><strong>POST</strong> = Power-On Self-Test, performed by BIOS/UEFI before Windows starts.</p>
        <p>Checks: CPU, RAM, keyboard, storage, GPU, motherboard.</p>
        <p class="warn">⚠ If POST fails, Windows never starts.</p>
      `},
      {num:142,type:"question",q:"What are beep codes?",a:`
        <p>When hardware fails during POST, the motherboard may produce beep codes. Examples:</p>
        <ul>
        <li>Continuous beeps → RAM failure</li>
        <li>1 long, 2 short (varies by manufacturer) → graphics problem</li>
        <li>No beep → motherboard or PSU problem</li>
        </ul>
        <p class="tip">💡 Beep code meanings differ between BIOS vendors (AMI, Award, Phoenix, etc.).</p>
      `},
      {num:143,type:"question",q:"Windows shows a blue screen (BSOD) — what is it and how do you troubleshoot it?",a:`
        <p>A Blue Screen of Death (BSOD) occurs when Windows encounters a critical error from which it cannot safely recover.</p>
        <p>Common causes:</p>
        <ul><li>Faulty drivers</li><li>Bad RAM</li><li>SSD/HDD failure</li><li>Overheating</li><li>Corrupted Windows files</li><li>Hardware failures</li><li>BIOS incompatibility</li><li>Faulty software</li></ul>
        <p>Troubleshooting:</p>
        <ol>
        <li>Note the stop code.</li>
        <li>Check recent changes.</li>
        <li>Boot into Safe Mode if needed.</li>
        <li>Update or roll back drivers.</li>
        <li>Run <code>sfc /scannow</code></li>
        <li>Run <code>DISM /Online /Cleanup-Image /RestoreHealth</code></li>
        <li>Check Event Viewer.</li>
        <li>Test RAM using Windows Memory Diagnostic.</li>
        <li>Check disk health.</li>
        <li>Update BIOS only if recommended by the hardware vendor and necessary.</li>
        </ol>
      `},
      {num:144,type:"question",q:"What is Windows Memory Diagnostic?",a:`
        <p>A built-in tool for testing RAM.</p>
        <p>Command: <code>mdsched.exe</code></p>
      `},
      {num:145,type:"question",q:"How do you check disk health?",a:`
        <p>Methods:</p>
        <ul><li>SMART status (manufacturer tools or Windows utilities)</li><li><code>chkdsk</code></li><li>Vendor diagnostic software</li></ul>
        <p>Example: <code>chkdsk C: /f /r</code></p>
      `},
      {num:146,type:"question",q:"What is System File Checker (SFC)?",a:`
        <p>Repairs corrupted Windows system files.</p>
        <p>Command: <code>sfc /scannow</code></p>
      `},
      {num:147,type:"question",q:"What is DISM?",a:`
        <p><strong>DISM</strong> = Deployment Image Servicing and Management. Repairs the Windows component store.</p>
        <p>Command: <code>DISM /Online /Cleanup-Image /RestoreHealth</code></p>
      `},
      {num:148,type:"question",q:"A user forgot their Windows password — what do you do?",a:`
        <p><strong>If local account:</strong></p>
        <ul>
        <li>Use password reset options if configured.</li>
        <li>Use another administrator account to reset the password.</li>
        <li>Follow the organization's approved password reset procedures.</li>
        </ul>
        <p><strong>If domain account:</strong></p>
        <ul>
        <li>Reset the password through Active Directory (with appropriate permissions).</li>
        <li>Verify the account is not locked or disabled.</li>
        <li>Ask the user to sign in with the new password.</li>
        </ul>
      `},
      {num:149,type:"question",q:"Windows Update keeps failing — how do you troubleshoot it?",a:`
        <ol>
        <li>Check Internet connection.</li>
        <li>Verify free disk space.</li>
        <li>Restart the Windows Update service.</li>
        <li>Run the Windows Update troubleshooter.</li>
        <li>Review update error codes.</li>
        <li>Check Event Viewer.</li>
        <li>Reset Windows Update components if required.</li>
        <li>Install updates manually from Microsoft if appropriate.</li>
        </ol>
      `},
      {num:150,type:"question",q:"Print jobs are stuck — what's the fix?",a:`
        <p>Most common cause: a Print Spooler issue.</p>
        <p><strong>Solution:</strong> restart the Print Spooler service, or use:</p>
        <p><code>net stop spooler</code><br><code>net start spooler</code></p>
        <p>If needed:</p>
        <ul><li>Clear the print queue.</li><li>Reinstall or update the printer driver.</li><li>Verify network connectivity to the printer.</li></ul>
      `},
      {num:151,type:"question",q:"A USB device is not detected — what do you check?",a:`
        <p>Possible causes:</p>
        <ul><li>Faulty USB port</li><li>Faulty cable</li><li>Driver issue</li><li>Device failure</li><li>Disabled USB controller</li><li>Power management settings</li></ul>
        <p>Troubleshooting:</p>
        <ol><li>Try another USB port.</li><li>Test the device on another PC.</li><li>Check Device Manager.</li><li>Reinstall the USB driver.</li><li>Restart the computer.</li></ol>
      `},
      {num:152,type:"question",q:"There's no sound from the computer — what do you check?",a:`
        <ul><li>Volume settings</li><li>Default playback device</li><li>Audio driver</li><li>Speakers/headphones</li><li>Audio service</li><li>Muted applications</li><li>Hardware connections</li></ul>
      `},
      {num:153,type:"question",q:"The microphone is not working — what are the possible causes?",a:`
        <ul><li>Privacy settings</li><li>Wrong recording device</li><li>Driver issue</li><li>Application permissions</li><li>Faulty microphone</li></ul>
      `},
      {num:154,type:"question",q:"Wi-Fi is connected but there's no internet — how do you troubleshoot it?",a:`
        <ol>
        <li>Test another website.</li>
        <li>Ping the default gateway.</li>
        <li>Ping 8.8.8.8.</li>
        <li>Test DNS.</li>
        <li>Restart Wi-Fi adapter.</li>
        <li>Restart router if appropriate.</li>
        <li>Forget and reconnect to the wireless network.</li>
        </ol>
      `},
      {num:155,type:"question",q:"The computer runs very slowly — what do you check?",a:`
        <ul><li>CPU usage</li><li>RAM usage</li><li>Disk usage</li><li>Startup programs</li><li>Malware</li><li>Windows updates</li><li>SSD/HDD health</li><li>Available storage</li><li>Thermal throttling</li></ul>
      `},
      {num:156,type:"question",q:"CPU usage is 100% — what are the possible causes?",a:`
        <ul><li>Windows Update</li><li>Antivirus scan</li><li>Malware</li><li>Runaway application</li><li>Driver issue</li></ul>
        <p>Use Task Manager to identify the process consuming CPU.</p>
      `},
      {num:157,type:"question",q:"RAM usage is very high — what are the possible causes?",a:`
        <ul><li>Too many applications</li><li>Memory leak</li><li>Browser tabs</li><li>Virtual machines</li><li>Malware</li><li>Insufficient RAM</li></ul>
      `},
      {num:158,type:"question",q:"Disk usage stays at 100% — what are the possible causes?",a:`
        <ul><li>HDD limitations</li><li>Windows Search indexing</li><li>Windows Update</li><li>Antivirus</li><li>Failing drive</li><li>Background services</li></ul>
        <p class="tip">💡 Interview tip: a mechanical HDD often reaches 100% active time under load. Replacing it with an SSD can dramatically improve responsiveness.</p>
      `},
      {num:159,type:"question",q:"A laptop overheats — what are the causes and the fix?",a:`
        <p>Possible causes:</p>
        <ul><li>Dust buildup</li><li>Blocked air vents</li><li>Failed cooling fan</li><li>Old thermal paste</li><li>High CPU load</li><li>Poor ventilation</li></ul>
        <p>Solution:</p>
        <ol><li>Clean dust.</li><li>Check fan operation.</li><li>Replace thermal paste if appropriate.</li><li>Improve airflow.</li><li>Reduce unnecessary background load.</li></ol>
      `},
      {num:160,type:"question",q:"The Internet is slow — what do you check?",a:`
        <ul><li>Wi-Fi signal strength</li><li>Ethernet cable</li><li>Speed test</li><li>Other users consuming bandwidth</li><li>Malware</li><li>DNS issues</li><li>Router health</li><li>ISP issues</li></ul>
      `},
      {num:161,type:"question",q:"A user cannot access a shared folder — what are the possible causes?",a:`
        <ul><li>Incorrect permissions</li><li>Wrong credentials</li><li>Network issue</li><li>DNS issue</li><li>Firewall blocking SMB</li><li>Server unavailable</li></ul>
      `},
      {num:162,type:"question",q:"A user cannot print — what do you check?",a:`
        <ul><li>Printer powered on</li><li>Paper available</li><li>Toner/ink levels</li><li>Network connection</li><li>Printer queue</li><li>Correct printer selected</li><li>Driver installed</li><li>Print Spooler service</li></ul>
      `},
      {num:163,type:"question",q:"An application crashes repeatedly — what are the possible causes?",a:`
        <p>Possible causes:</p>
        <ul><li>Corrupted installation</li><li>Missing dependencies</li><li>Outdated version</li><li>Driver conflict</li><li>Compatibility issues</li><li>Insufficient permissions</li></ul>
        <p>Troubleshooting:</p>
        <ol><li>Check Event Viewer.</li><li>Update the application.</li><li>Repair or reinstall it.</li><li>Test under another user profile if appropriate.</li></ol>
      `},
      {num:164,type:"question",q:"A user deleted an important file — what steps do you take?",a:`
        <ol>
        <li>Check the Recycle Bin.</li>
        <li>Restore from backup if available.</li>
        <li>Restore previous versions (if enabled).</li>
        <li>Escalate to data recovery only if necessary, and avoid writing new data to the affected drive.</li>
        </ol>
      `},
      {num:165,type:"question",q:"How do you troubleshoot any IT problem?",a:`
        <p>A structured troubleshooting methodology is one of the strongest interview answers.</p>
        <p><strong>Model answer:</strong></p>
        <ol>
        <li>Gather information from the user.</li>
        <li>Identify and define the problem.</li>
        <li>Reproduce the issue if possible.</li>
        <li>Check the simplest and most likely causes first.</li>
        <li>Develop a theory of probable cause.</li>
        <li>Test the theory.</li>
        <li>Implement the solution.</li>
        <li>Verify that the issue is resolved.</li>
        <li>Confirm the user can perform their tasks.</li>
        <li>Document the incident and the resolution.</li>
        </ol>
      `},
      {num:null,type:"practical",q:'Behavioral scenario: "An employee says their computer is broken and they need it immediately. How would you handle it?"',a:`
        <p><strong>Strong answer:</strong> "I would remain calm and professional, ask the user to explain the issue, and determine how critical it is to their work. I would perform a quick initial assessment, checking for simple causes first. If the issue could not be resolved immediately, I would communicate the expected timeline, provide a temporary workaround if available, and keep the user informed until the problem was resolved."</p>
        <p>This answer demonstrates:</p>
        <ul><li>Customer service</li><li>Communication</li><li>Prioritization</li><li>Technical troubleshooting</li><li>Professionalism</li></ul>
      `},
      {num:null,type:"reference",q:"Top Windows commands every IT Officer should know",a:`
        <table class="mini-table"><thead><tr><th>Command</th><th>Purpose</th></tr></thead><tbody>
        <tr><td>ipconfig /all</td><td>View detailed network configuration</td></tr>
        <tr><td>ipconfig /flushdns</td><td>Clear DNS cache</td></tr>
        <tr><td>ping</td><td>Test connectivity</td></tr>
        <tr><td>tracert</td><td>Trace network path</td></tr>
        <tr><td>nslookup</td><td>Test DNS resolution</td></tr>
        <tr><td>netstat -ano</td><td>View active connections and listening ports</td></tr>
        <tr><td>tasklist</td><td>List running processes</td></tr>
        <tr><td>taskkill /PID &lt;id&gt; /F</td><td>Force-terminate a process</td></tr>
        <tr><td>sfc /scannow</td><td>Repair Windows system files</td></tr>
        <tr><td>DISM /Online /Cleanup-Image /RestoreHealth</td><td>Repair Windows image</td></tr>
        <tr><td>chkdsk C: /f /r</td><td>Check and repair disk errors</td></tr>
        <tr><td>gpupdate /force</td><td>Refresh Group Policy</td></tr>
        <tr><td>gpresult /r</td><td>Show applied Group Policies</td></tr>
        <tr><td>shutdown /r /t 0</td><td>Restart immediately</td></tr>
        <tr><td>systeminfo</td><td>Display detailed system information</td></tr>
        </tbody></table>
      `},
      {num:null,type:"tip",q:"Interview tip: what not to say in a troubleshooting scenario",a:`
        <p>When you're given a troubleshooting scenario, avoid saying: <em>"I would reinstall Windows."</em></p>
        <p>Instead, explain a logical diagnostic process first. Reinstalling the operating system should generally be a last resort after less disruptive solutions have been evaluated.</p>
      `}
    ]
  },
  {
    id:"ch6-p1",
    part:"Volume 1",
    number:"Ch. 6 · Part 1",
    title:"Windows Server Administration (166–185)",
    questions:[
      {num:null,type:"tip",q:"About this chapter",a:`
        <p>Windows Server is the backbone of many enterprise environments. Even if the position is titled IT Officer rather than System Administrator, interviewers often expect a working knowledge of Windows Server.</p>
      `},
      {num:166,type:"question",q:"What is Windows Server?",a:`
        <p>Windows Server is Microsoft's enterprise operating system designed to provide centralized management, networking, security, storage, virtualization, and application hosting for organizations.</p>
        <p>Unlike Windows 11, Windows Server is optimized for managing many users and devices rather than a single workstation.</p>
        <p><strong>Common uses:</strong></p>
        <ul>
        <li>Active Directory</li>
        <li>DNS</li>
        <li>DHCP</li>
        <li>File Server</li>
        <li>Print Server</li>
        <li>IIS Web Server</li>
        <li>Hyper-V Virtualization</li>
        <li>Remote Desktop Services</li>
        <li>Certificate Services</li>
        </ul>
      `},
      {num:167,type:"question",q:"What is the difference between Windows 11 and Windows Server?",a:`
        <table class="mini-table">
        <tr><th>Windows 11</th><th>Windows Server</th></tr>
        <tr><td>Desktop OS</td><td>Server OS</td></tr>
        <tr><td>Single user focus</td><td>Multi-user environment</td></tr>
        <tr><td>Office work</td><td>Enterprise services</td></tr>
        <tr><td>Gaming supported</td><td>Gaming not intended</td></tr>
        <tr><td>Joins a domain</td><td>Can host a domain</td></tr>
        <tr><td>Client operating system</td><td>Server operating system</td></tr>
        </table>
      `},
      {num:168,type:"question",q:"What is Server Manager?",a:`
        <p>Server Manager is the central console used to manage Windows Server.</p>
        <p>It allows administrators to:</p>
        <ul>
        <li>Install roles</li>
        <li>Install features</li>
        <li>Monitor servers</li>
        <li>Manage services</li>
        <li>Add remote servers</li>
        <li>Configure networking</li>
        <li>Review events</li>
        </ul>
      `},
      {num:169,type:"question",q:"What is a Server Role?",a:`
        <p>A Role is a major function the server performs.</p>
        <p>Examples:</p>
        <ul>
        <li>Active Directory Domain Services (AD DS)</li>
        <li>DNS Server</li>
        <li>DHCP Server</li>
        <li>File Server</li>
        <li>Print Server</li>
        <li>IIS Web Server</li>
        <li>Hyper-V</li>
        <li>Remote Desktop Services</li>
        </ul>
      `},
      {num:170,type:"question",q:"What is a Feature, and how does it differ from a Role?",a:`
        <p>Features provide additional capabilities but are not primary server functions.</p>
        <p>Examples: .NET Framework, Windows PowerShell, BitLocker, Failover Clustering, Telnet Client, Backup tools</p>
        <table class="mini-table">
        <tr><th>Role</th><th>Feature</th></tr>
        <tr><td>Primary server service</td><td>Supporting capability</td></tr>
        <tr><td>AD DS</td><td>.NET Framework</td></tr>
        <tr><td>DHCP</td><td>BitLocker</td></tr>
        <tr><td>DNS</td><td>PowerShell</td></tr>
        </table>
      `},
      {num:171,type:"question",q:"What is Active Directory Domain Services (AD DS)?",a:`
        <p>AD DS is the server role that provides Active Directory functionality.</p>
        <p>It stores:</p>
        <ul>
        <li>Users</li>
        <li>Groups</li>
        <li>Computers</li>
        <li>Organizational Units (OUs)</li>
        <li>Security policies</li>
        </ul>
        <p>It also provides centralized authentication and authorization.</p>
      `},
      {num:172,type:"question",q:"What is a DNS Server?",a:`
        <p>A DNS Server translates domain names into IP addresses.</p>
        <p><strong>Example:</strong> company.local → 192.168.1.10</p>
        <p>Without DNS, users would need to remember IP addresses instead of names.</p>
      `},
      {num:173,type:"question",q:"Why is DNS required for Active Directory?",a:`
        <p><strong>Excellent Answer:</strong></p>
        <p>Active Directory relies on DNS to locate:</p>
        <ul>
        <li>Domain Controllers</li>
        <li>Authentication services</li>
        <li>Global Catalog servers</li>
        <li>Kerberos services</li>
        </ul>
        <p>Without properly configured DNS, domain logins and many AD functions will fail.</p>
      `},
      {num:174,type:"question",q:"What is a DHCP Server?",a:`
        <p>DHCP automatically provides to client computers:</p>
        <ul>
        <li>IP Address</li>
        <li>Subnet Mask</li>
        <li>Default Gateway</li>
        <li>DNS Server</li>
        <li>Lease Duration</li>
        </ul>
      `},
      {num:175,type:"question",q:"Explain the DHCP process (DORA).",a:`
        <p>A classic interview question. DORA stands for:</p>
        <ul>
        <li><strong>D – Discover:</strong> Client broadcasts looking for a DHCP server.</li>
        <li><strong>O – Offer:</strong> Server offers an IP address.</li>
        <li><strong>R – Request:</strong> Client requests the offered address.</li>
        <li><strong>A – Acknowledge:</strong> Server confirms the lease.</li>
        </ul>
      `},
      {num:176,type:"question",q:"What is a DHCP Scope?",a:`
        <p>A DHCP Scope defines the pool of IP addresses available for clients.</p>
        <p><strong>Example:</strong> Start: 192.168.1.100 — End: 192.168.1.200</p>
        <p>Only addresses in this range are assigned automatically.</p>
      `},
      {num:177,type:"question",q:"What is a DHCP Reservation?",a:`
        <p>A reservation ensures a device always receives the same IP address based on its MAC address.</p>
        <p>Common devices: printers, servers, IP cameras, network appliances</p>
      `},
      {num:178,type:"question",q:"What is a DHCP Exclusion?",a:`
        <p>Excluded addresses are never assigned automatically.</p>
        <p><strong>Example:</strong> Scope 100–200, Exclude 100–110</p>
        <p>Those addresses remain available for static assignments.</p>
      `},
      {num:179,type:"question",q:"What is a File Server?",a:`
        <p>A File Server stores and shares files over the network.</p>
        <p>Advantages: centralized storage, easier backups, permission management, collaboration, reduced duplicate files</p>
      `},
      {num:180,type:"question",q:"What is a Print Server?",a:`
        <p>A Print Server centrally manages network printers.</p>
        <p>Benefits: driver management, queue management, centralized deployment, easier maintenance</p>
      `},
      {num:181,type:"question",q:"What is an NTFS Permission?",a:`
        <p>Controls access to files and folders.</p>
        <p>Common permissions: Read, Write, Modify, Read & Execute, Full Control</p>
      `},
      {num:182,type:"question",q:"What is the difference between Share Permission and NTFS Permission?",a:`
        <table class="mini-table">
        <tr><th>Share Permission</th><th>NTFS Permission</th></tr>
        <tr><td>Applies only over the network</td><td>Applies locally and over the network</td></tr>
        <tr><td>Simpler permission set</td><td>More detailed permission set</td></tr>
        <tr><td>Used when accessing shared folders</td><td>Always applies on NTFS volumes</td></tr>
        </table>
        <p>When accessing a shared folder over the network, the effective access is determined by the combination of Share and NTFS permissions. The most restrictive effective permission applies.</p>
      `},
      {num:183,type:"question",q:"What is DFS (Distributed File System)?",a:`
        <p>DFS allows administrators to present shared folders from multiple servers under a single logical namespace.</p>
        <p><strong>Example:</strong> Instead of \\\\Server1\\Finance, \\\\Server2\\HR, \\\\Server3\\IT, users access \\\\Company\\Shares.</p>
        <p>This simplifies access and administration.</p>
      `},
      {num:184,type:"question",q:"What is Hyper-V?",a:`
        <p>Hyper-V is Microsoft's built-in virtualization platform.</p>
        <p>It allows one physical server to run multiple virtual machines (VMs).</p>
        <p><strong>Advantages:</strong> better hardware utilization, isolation between VMs, easier testing, simplified backup and recovery, server consolidation</p>
      `},
      {num:185,type:"question",q:"What is the difference between a Physical Machine and a Virtual Machine?",a:`
        <table class="mini-table">
        <tr><th>Physical Machine</th><th>Virtual Machine</th></tr>
        <tr><td>Dedicated hardware</td><td>Runs on a hypervisor</td></tr>
        <tr><td>One OS per hardware</td><td>Multiple OSs on one host</td></tr>
        <tr><td>Less flexible</td><td>Easier to clone, snapshot, and migrate</td></tr>
        <tr><td>Hardware replacement required for scaling</td><td>Easier to scale resources</td></tr>
        </table>
      `},
      {num:null,type:"practical",q:"Scenario: Employees cannot log into the domain. How do you troubleshoot?",a:`
        <ul>
        <li>Verify the Domain Controller is running.</li>
        <li>Check DNS configuration on the client.</li>
        <li>Ping the Domain Controller.</li>
        <li>Confirm time synchronization.</li>
        <li>Check Active Directory for account status.</li>
        <li>Review Event Viewer on both client and server.</li>
        <li>Test another user account.</li>
        <li>Verify network connectivity and firewall rules.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario: DHCP is not assigning IP addresses. What are the possible causes and troubleshooting steps?",a:`
        <p>Possible causes:</p>
        <ul>
        <li>DHCP service stopped.</li>
        <li>Scope exhausted.</li>
        <li>Network connectivity issue.</li>
        <li>VLAN misconfiguration.</li>
        <li>DHCP relay missing (for routed networks).</li>
        <li>Firewall blocking DHCP traffic.</li>
        </ul>
        <p>Troubleshooting:</p>
        <ul>
        <li>Verify the DHCP service is running.</li>
        <li>Check scope availability.</li>
        <li>Confirm the client is in the correct VLAN.</li>
        <li>Run <code>ipconfig /renew</code>.</li>
        <li>Check Event Viewer for DHCP errors.</li>
        <li>Test with another client device.</li>
        </ul>
      `},
      {num:null,type:"practical",q:"Scenario: Users cannot access shared files. What do you check?",a:`
        <ul>
        <li>Verify the file server is online.</li>
        <li>Check network connectivity.</li>
        <li>Confirm Share permissions.</li>
        <li>Confirm NTFS permissions.</li>
        <li>Verify group membership.</li>
        <li>Check available disk space.</li>
        <li>Review server logs for access-denied events.</li>
        </ul>
      `},
      {num:null,type:"tip",q:"Interview tip",a:`
        <p>When discussing Windows Server, emphasize:</p>
        <ul>
        <li>Centralized management</li>
        <li>Security</li>
        <li>High availability</li>
        <li>Scalability</li>
        <li>Backup and disaster recovery</li>
        <li>Least privilege access</li>
        </ul>
        <p>These concepts demonstrate an enterprise mindset beyond basic desktop support.</p>
      `},
      {num:null,type:"reference",q:"Next chapter",a:`
        <p><strong>Windows Server (Part 2)</strong></p>

        <ul>
        <li>IIS (Internet Information Services)</li>
        <li>Remote Desktop Services (RDS)</li>

        <li>Windows Server Backup</li>
        <li>Certificate Services (AD CS)</li>
        <li>Kerberos authentication</li>
        <li>LDAP</li>

        </ul>
        <p>These topics are especially valuable for IT Officer, System Administrator, and Infrastructure Support interviews in medium and large organizations.</p>
      `}
    ]

  {
    id:"ch6-p2",
    part:"Volume 1",
    number:"Ch. 6 · Part 2",
    title:"Windows Server Administration (Advanced Enterprise Level)",
    questions:[
      {num:186,type:"question",q:"What is IIS?",a:`
        <p><strong>IIS</strong> (Internet Information Services) is Microsoft's web server software used to host websites, web applications, APIs, and web services on Windows Server.</p>
        <p>Commonly hosts: ASP.NET websites, PHP websites, static HTML sites, REST APIs</p>
        <p><strong>IIS components:</strong></p>
        <ul><li>Website</li><li>Application Pool</li><li>Virtual Directory</li><li>Bindings</li><li>SSL Certificates</li><li>Logs</li></ul>
        <table class="mini-table"><thead><tr><th>Port</th><th>Protocol</th></tr></thead><tbody>
        <tr><td>80</td><td>HTTP</td></tr>
        <tr><td>443</td><td>HTTPS</td></tr>
        </tbody></table>
      `},
      {num:187,type:"question",q:"What is an Application Pool?",a:`
        <p>An Application Pool isolates web applications from each other.</p>
        <p>Advantages:</p>
        <ul><li>Better security</li><li>Better stability</li><li>One website crashing doesn't affect others</li><li>Independent memory management</li></ul>
      `},
      {num:188,type:"question",q:"What is HTTPS?",a:`
        <p><strong>HTTPS</strong> = HTTP Secure. Uses SSL/TLS encryption instead of plain HTTP.</p>
        <p>Advantages: encryption, authentication, integrity, secure login, secure payment</p>
        <p>Default port: <strong>443</strong></p>
      `},
      {num:189,type:"question",q:"What is SSL/TLS?",a:`
        <p><strong>SSL</strong> = Secure Socket Layer. <strong>TLS</strong> = Transport Layer Security. TLS is the modern protocol replacing SSL.</p>
        <p>Functions:</p>
        <ul><li>Encrypts traffic</li><li>Prevents eavesdropping</li><li>Prevents tampering</li><li>Verifies server identity</li></ul>
      `},
      {num:190,type:"question",q:"What is a certificate?",a:`
        <p>A digital certificate verifies the identity of a server.</p>
        <p>Contains: domain name, public key, issuer, expiration date</p>
        <p>Usually issued by a Certificate Authority (CA).</p>
      `},
      {num:191,type:"question",q:"What is Active Directory Certificate Services (AD CS)?",a:`
        <p>AD CS allows organizations to create their own internal Certificate Authority.</p>
        <p>Used for: internal HTTPS, VPN, Wi-Fi authentication, smart cards, device certificates</p>
      `},
      {num:192,type:"question",q:"What is Remote Desktop Services (RDS)?",a:`
        <p>RDS allows multiple users to remotely access Windows desktops or applications hosted on a server.</p>
        <p>Uses: remote workers, terminal servers, published applications</p>
      `},
      {num:193,type:"question",q:"RDP vs RDS — what's the difference?",a:`
        <table class="mini-table"><thead><tr><th>RDP</th><th>RDS</th></tr></thead><tbody>
        <tr><td>Remote connection protocol</td><td>Complete remote desktop solution</td></tr>
        <tr><td>One user per workstation</td><td>Multiple users on one server</td></tr>
        <tr><td>Basic remote administration</td><td>Enterprise remote access</td></tr>
        </tbody></table>
      `},
      {num:194,type:"question",q:"What is Hyper-V?",a:`
        <p>Hyper-V is Microsoft's Type-1 hypervisor.</p>
        <p>Allows: multiple virtual machines, virtual networking, snapshots, virtual disks, live migration (with supporting infrastructure)</p>
      `},
      {num:195,type:"question",q:"What are the advantages of virtualization?",a:`
        <ul><li>Lower hardware cost</li><li>Better utilization</li><li>Easy backup</li><li>Fast deployment</li><li>Isolation</li><li>Snapshots</li><li>Disaster recovery</li><li>Easier testing</li></ul>
      `},
      {num:196,type:"question",q:"What is a snapshot (checkpoint)?",a:`
        <p>A snapshot (checkpoint in Hyper-V) captures the VM's state at a point in time.</p>
        <p>Useful before: Windows Updates, software installation, configuration changes.</p>
        <p class="tip">💡 If something fails, you can roll back.</p>
      `},
      {num:197,type:"question",q:"What is Failover Clustering?",a:`
        <p>Failover Clustering allows multiple servers to work together. If one server fails, another automatically takes over.</p>
        <p>Used for: SQL Server, File Server, Hyper-V, enterprise applications</p>
      `},
      {num:198,type:"question",q:"What is High Availability (HA)?",a:`
        <p>High Availability means systems remain available despite hardware or software failures.</p>
        <p>Methods: clustering, RAID, redundant power supplies, multiple Internet connections, multiple Domain Controllers</p>
      `},
      {num:199,type:"question",q:"What is Load Balancing?",a:`
        <p>Load balancing distributes incoming requests across multiple servers.</p>
        <p>Benefits: better performance, higher availability, scalability, fault tolerance</p>
      `},
      {num:200,type:"question",q:"What is Storage Spaces?",a:`
        <p>Storage Spaces combines multiple physical disks into storage pools.</p>
        <p>Supports: mirroring, parity, simple layouts</p>
        <p>Provides flexibility similar to RAID in many scenarios.</p>
      `},
      {num:201,type:"question",q:"What is Windows Server Backup?",a:`
        <p>A built-in backup solution.</p>
        <p>Can back up: entire server, files, volumes, System State</p>
      `},
      {num:202,type:"question",q:"What is System State Backup?",a:`
        <p>Includes:</p>
        <ul><li>Active Directory</li><li>Registry</li><li>Boot files</li><li>COM+ database</li><li>SYSVOL (on Domain Controllers)</li></ul>
        <p class="tip">💡 Critical for restoring a Domain Controller.</p>
      `},
      {num:203,type:"question",q:"What is SYSVOL?",a:`
        <p>SYSVOL stores Group Policies and logon scripts.</p>
        <p>Replicated automatically between Domain Controllers.</p>
      `},
      {num:204,type:"question",q:"What is NETLOGON?",a:`
        <p>NETLOGON stores logon scripts and authentication-related resources.</p>
        <p>Accessible through <code>\\\\DomainController\\NETLOGON</code></p>
      `},
      {num:205,type:"question",q:"What is Kerberos?",a:`
        <p>Kerberos is the default authentication protocol used in Windows domains — one of the most important Active Directory questions.</p>
        <p>Advantages: secure, fast, mutual authentication, uses tickets instead of repeatedly sending passwords</p>
        <p><strong>Kerberos flow (simplified):</strong></p>
        <p>User logs in → gets Ticket Granting Ticket (TGT) → requests Service Ticket → accesses server</p>
      `},
      {num:206,type:"question",q:"What is LDAP?",a:`
        <p><strong>LDAP</strong> = Lightweight Directory Access Protocol.</p>
        <p>Used to search Active Directory: query users, query groups, query computers</p>
      `},
      {num:207,type:"question",q:"What is the Global Catalog?",a:`
        <p>The Global Catalog contains searchable information about objects across the Active Directory forest.</p>
        <p>Benefits: faster searches, user logon support, forest-wide object lookup</p>
      `},
      {num:208,type:"question",q:"What are FSMO roles?",a:`
        <p><strong>FSMO</strong> = Flexible Single Master Operations. There are five roles.</p>
        <p><strong>Forest roles:</strong></p>
        <ul>
        <li><strong>Schema Master</strong> — responsible for schema changes</li>
        <li><strong>Domain Naming Master</strong> — responsible for adding or removing domains</li>
        </ul>
        <p><strong>Domain roles:</strong></p>
        <ul>
        <li><strong>RID Master</strong> — allocates Relative IDs for security identifiers (SIDs)</li>
        <li><strong>PDC Emulator</strong> — handles password changes, time synchronization, and compatibility with older systems</li>
        <li><strong>Infrastructure Master</strong> — updates references to objects across domains</li>
        </ul>
        <p class="tip">💡 Interview tip: you don't need to memorize every detail of FSMO roles, but you should know there are five roles, two are forest-wide, three are domain-wide, and the PDC Emulator is especially important.</p>
      `},
      {num:209,type:"question",q:"What is replication?",a:`
        <p>Active Directory replication keeps data synchronized between Domain Controllers.</p>
        <p>If a new user is created on one Domain Controller, replication copies the information to the others.</p>
      `},
      {num:210,type:"question",q:"What is multi-master replication?",a:`
        <p>Most Active Directory changes can be made on any writable Domain Controller. Changes are then replicated automatically to other writable Domain Controllers.</p>
        <p class="tip">💡 Some operations, such as FSMO tasks, have single-role owners.</p>
      `},
      {num:null,type:"practical",q:"Practical scenario 1: users cannot access the company website hosted on IIS — how do you troubleshoot it?",a:`
        <ol>
        <li>Check IIS service.</li>
        <li>Verify website status.</li>
        <li>Verify bindings.</li>
        <li>Check SSL certificate.</li>
        <li>Test port 80/443.</li>
        <li>Check firewall.</li>
        <li>Review IIS logs.</li>
        <li>Review Event Viewer.</li>
        </ol>
      `},
      {num:null,type:"practical",q:"Practical scenario 2: one Domain Controller stops working — what happens?",a:`
        <p>If another healthy Domain Controller is available:</p>
        <ul>
        <li>Users can often continue to authenticate.</li>
        <li>Group Policy and DNS may continue to function depending on the environment.</li>
        <li>Replicated data remains available.</li>
        </ul>
        <p class="warn">⚠ If it was the only Domain Controller, authentication and many domain services may be unavailable until it is restored.</p>
      `},
      {num:null,type:"practical",q:"Practical scenario 3: users report \"Access Denied\" — possible causes?",a:`
        <ul><li>NTFS permissions</li><li>Share permissions</li><li>Group membership</li><li>GPO restriction</li><li>Account disabled</li><li>Authentication failure</li></ul>
      `},
      {num:null,type:"practical",q:"Practical scenario 4: a virtual machine won't start — what do you check?",a:`
        <ul><li>Hyper-V service</li><li>Available RAM</li><li>Available disk space</li><li>Virtual switch configuration</li><li>Checkpoint issues</li><li>Event Viewer</li></ul>
      `},
      {num:null,type:"practical",q:"Practical scenario 5: the server is running slowly — possible causes?",a:`
        <ul><li>High CPU usage</li><li>Low memory</li><li>Disk bottleneck</li><li>Too many virtual machines</li><li>Antivirus scan</li><li>Windows Update</li><li>Storage issues</li></ul>
      `},
      {num:null,type:"tip",q:"Interview tip: how to structure enterprise server troubleshooting answers",a:`
        <p>For enterprise server questions, structure your answers like this:</p>
        <ol>
        <li><strong>Identify the issue</strong> — describe the symptom.</li>
        <li><strong>Verify the basics</strong> — network, power, services, permissions.</li>
        <li><strong>Use diagnostic tools</strong> — Event Viewer, Server Manager, Performance Monitor, PowerShell.</li>
        <li><strong>Resolve the root cause</strong> — avoid temporary fixes when possible.</li>
        <li><strong>Verify and document</strong> — confirm normal operation and record the resolution.</li>
        </ol>
        <p>This method shows that you think like a professional systems administrator.</p>
      `},

        <li>Enterprise troubleshooting</li>
        </ul>
      `}
    ]
